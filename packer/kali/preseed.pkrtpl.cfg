# Kali's installer answers for the template build (kali.pkr.hcl), fetched from Packer's web server.
# The build user exists only until clean.sh deletes it; machines get "kali" from the panel.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string tpl-kali
d-i netcfg/get_domain string
d-i netcfg/hostname string tpl-kali

d-i mirror/country string manual
d-i mirror/http/hostname string ${mirror_host}
d-i mirror/http/directory string ${mirror_dir}
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

d-i passwd/root-login boolean false
d-i passwd/user-fullname string builder
d-i passwd/username string builder
d-i passwd/user-password-crypted password ${password_hash}
d-i user-setup/allow-password-weak boolean true

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-swapfile/size string 0

d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true

# Kali's default tools and the Xfce desktop (prepare.sh needs a desktop), plus SSH for the build.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string kali-linux-default kali-desktop-xfce openssh-server open-vm-tools sudo
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string \
  in-target sh -c 'mkdir -p /home/builder/.ssh && echo "${ssh_public_key}" > /home/builder/.ssh/authorized_keys && chown -R builder:builder /home/builder/.ssh && chmod 700 /home/builder/.ssh && chmod 600 /home/builder/.ssh/authorized_keys'; \
  in-target sh -c 'echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder && chmod 440 /etc/sudoers.d/builder'; \
  in-target systemctl enable ssh

d-i finish-install/reboot_in_progress note
