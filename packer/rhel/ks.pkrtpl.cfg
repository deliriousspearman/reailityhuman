# Kickstart for the RHEL-family template builds (rhel.pkr.hcl): the installer finds it on the CD
# labelled OEMDRV. A minimal install from the distribution's repositories (or a mirror), with VMware
# Tools so Packer sees the address, and a build user that only exists until clean.sh deletes it.
text
eula --agreed
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=tpl-${distro}
url --url=${baseos}
repo --name=AppStream --baseurl=${appstream}

rootpw --lock
user --name=builder --groups=wheel --password=${build_password} --plaintext
sshkey --username=builder "${ssh_public_key}"
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,vmtoolsd
firstboot --disable
skipx

zerombr
clearpart --all --initlabel
autopart --type=lvm --nohome
bootloader

reboot --eject

%packages
@^minimal-environment
open-vm-tools
openssh-server
sudo
%end

%post
echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
chmod 440 /etc/sudoers.d/builder
%end
