# Kickstart for the legacy CentOS template build (centos-legacy.pkr.hcl: CentOS 7), found on the CD
# labelled OEMDRV. A minimal install from the ISO (the vault for anything it lacks), with VMware Tools
# so Packer sees the address, and a build user that only exists until clean-legacy.sh deletes it.
install
cdrom
repo --name=vault-os --baseurl=${vault}/os/x86_64/
repo --name=vault-updates --baseurl=${vault}/updates/x86_64/
text
eula --agreed
lang en_US.UTF-8
keyboard us
timezone UTC --isUtc
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=tpl-centos

rootpw --lock
user --name=builder --groups=wheel --password=${build_password} --plaintext
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd
firstboot --disable
skipx

zerombr
clearpart --all --initlabel
autopart --type=lvm --nohome
bootloader --location=mbr

reboot --eject

%packages
@^minimal
open-vm-tools
openssh-server
sudo
%end

%post
mkdir -p /home/builder/.ssh
echo "${ssh_public_key}" > /home/builder/.ssh/authorized_keys
chown -R builder:builder /home/builder/.ssh
chmod 700 /home/builder/.ssh
chmod 600 /home/builder/.ssh/authorized_keys
restorecon -R /home/builder/.ssh
echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
chmod 440 /etc/sudoers.d/builder
systemctl enable vmtoolsd
%end
