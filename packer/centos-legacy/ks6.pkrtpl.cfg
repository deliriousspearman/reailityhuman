# Kickstart for the legacy CentOS 6 template build (centos-legacy.pkr.hcl), fetched from Packer's web
# server (CentOS 6's installer doesn't look for an OEMDRV volume). A minimal install from the ISO and
# the vault (6.10, the last release), VMware Tools from EPEL's archive (CentOS 6 has none of its own)
# so Packer sees the address, and a build user that only exists until clean-legacy.sh deletes it.
install
cdrom
repo --name=vault-updates --baseurl=${vault}/updates/x86_64/
repo --name=epel --baseurl=${epel}
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=eth0 --onboot=yes --hostname=tpl-centos

# EL6's rootpw needs a value: a hash nothing matches, so root stays locked. (Its user command takes
# the password as it is, with no --plaintext.)
rootpw --iscrypted !!
user --name=builder --groups=wheel --password=${build_password}
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd
firstboot --disable
skipx

zerombr
clearpart --all --initlabel
autopart
bootloader --location=mbr

reboot --eject

%packages
@core
open-vm-tools
openssh-server
sudo
%end

%post
mkdir -p /home/builder/.ssh
echo "${ssh_public_key}" > /home/builder/.ssh/authorized_keys
chown -R builder:builder /home/builder/.ssh
chmod 700 /home/builder/.ssh
chmod 600 /home/builder/.ssh/authorized_keys
restorecon -R /home/builder/.ssh
echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
chmod 440 /etc/sudoers.d/builder
# requiretty (CentOS 6's sudo default) would refuse Packer's commands, which have no terminal.
sed -i 's/^Defaults *requiretty/# &/' /etc/sudoers
chkconfig vmtoolsd on
%end
