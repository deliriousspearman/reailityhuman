# Kickstart for the Fedora template builds (fedora.pkr.hcl): the installer finds it on the CD labelled
# OEMDRV. Fedora Server's or Workstation's package set from Fedora's repositories (or a mirror), with
# VMware Tools so Packer sees the address, and a build user that only exists until clean.sh deletes it.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=tpl-fedora-${edition}
%{ if mirror != "" ~}
url --url=${mirror}/releases/${version}/Everything/x86_64/os/
repo --name=updates --baseurl=${mirror}/updates/${version}/Everything/x86_64/
%{ else ~}
url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-${version}&arch=x86_64"
repo --name=updates --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f${version}&arch=x86_64"
%{ endif ~}

rootpw --lock
user --name=builder --groups=wheel --password=${build_password} --plaintext
sshkey --username=builder "${ssh_public_key}"
selinux --enforcing
services --enabled=sshd,vmtoolsd
firstboot --disable

zerombr
clearpart --all --initlabel
%{ if edition == "workstation" ~}
# Workstation: its own defaults, Btrfs and the desktop at boot. Its firewall zone already lets SSH and
# Remote Desktop in.
firewall --enabled --service=ssh
xconfig --startxonboot
autopart --type=btrfs
%{ else ~}
# Server: its own defaults, LVM (prepare.sh grows root into the rest of the group) and Cockpit.
firewall --enabled --service=ssh,cockpit
skipx
autopart --type=lvm --nohome
%{ endif ~}
bootloader

reboot --eject

%packages
%{ if edition == "workstation" ~}
@^workstation-product-environment
# Its first-sign-in wizard: each machine's user is made by the panel.
-gnome-initial-setup
open-vm-tools-desktop
%{ else ~}
@^server-product-environment
%{ endif ~}
open-vm-tools
openssh-server
sudo
%end

%post
echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
chmod 440 /etc/sudoers.d/builder
%end
