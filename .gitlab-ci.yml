# Checks and builds the panel and tests the backend on every push, and deploys it from the default
# branch with deploy/deploy.sh, the same script used for manual deploys.
#
# Required CI/CD variables (Settings → CI/CD → Variables, mark as Protected):
#   DEPLOY_HOST       server address
#   SITE_ADDRESS      address browsers use for the panel (usually the same as DEPLOY_HOST)
#   SSH_PRIVATE_KEY   type "File": private key of DEPLOY_USER on the server
#   SSH_KNOWN_HOSTS   type "File": output of `ssh-keyscan <DEPLOY_HOST>`
# Optional:
#   DEPLOY_USER       SSH user in the docker group (default: user)

stages: [build, deploy]

build:
  stage: build
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm/]
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline --no-audit --no-fund
    - npm run check
    - npm run build
  artifacts:
    paths: [frontend/build/]
    expire_in: 1 week

# Static checks of the template scripts (they run on VMs, so CI only lints them).
scripts-check:
  stage: build
  image: koalaman/shellcheck-alpine:v0.10.0
  script:
    - shellcheck scripts/template/*.sh scripts/template/legacy/*.sh scripts/template/legacy/lab-firstboot scripts/template/alpine/*.sh scripts/template/freebsd/lab-firstboot scripts/template/freebsd/lab_firstboot scripts/template/freebsd/*.sh scripts/isos/fetch.sh scripts/isos/fetch-images.sh packer/vyos/build-iso.sh scripts/template/proxmox/*.sh scripts/template/proxmox/lab-firstboot packer/proxmox/*.sh scripts/template/truenas/*.sh scripts/template/truenas/lab-firstboot packer/mikrotik/import-chr.sh packer/metasploitable/*.sh packer/cachyos/install.sh scripts/isos/fetch-media.sh scripts/capture/lab-capture scripts/capture/*.sh deploy/bundle.sh deploy/install.sh deploy/deploy.sh deploy/update-builder.sh
    - shellcheck -s sh scripts/template/opnsense/*.sh scripts/template/opnsense/lab-firstboot packer/opnsense/live.sh scripts/template/pfsense/*.sh packer/pfsense/live.sh

# The Windows template scripts: parsed with PowerShell's own parser (they run on VMs, so CI only
# checks they're well-formed). Not required for deploys: it pulls from Microsoft's registry.
scripts-check-windows:
  stage: build
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  script:
    - |
      pwsh -NoProfile -Command '
        $bad = 0
        foreach ($f in Get-ChildItem scripts/template/*.ps1, packer/windows-server/*.ps1) {
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $bad++; $errors | ForEach-Object { "$($f.Name):$($_.Extent.StartLineNumber): $($_.Message)" } } else { "$($f.Name): parses" }
        }
        exit $bad'

# The backend's tests, against PostgreSQL and vcsim (VMware's vCenter simulator), as
# backend/compose.test.yaml runs them locally.
backend-test:
  stage: build
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: vmware/vcsim:v0.53.0
      alias: vcsim
  variables:
    POSTGRES_USER: labdeploy
    POSTGRES_PASSWORD: labdeploy
    POSTGRES_DB: labdeploy
    DATABASE_URL: postgresql://labdeploy:labdeploy@postgres/labdeploy
    VCSIM_URL: vcsim:8989
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip
    # The app runs from its source folder, as in the image.
    PYTHONPATH: $CI_PROJECT_DIR/backend
  cache:
    key:
      files: [backend/pyproject.toml]
    paths: [.pip/]
  script:
    # ssh-keygen, as in the panel's image: the capture tests make the panel's key.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client >/dev/null
    - cd backend
    - pip install --quiet '.[test]' && pip uninstall --quiet -y lab-deploy
    - pytest -q -p no:cacheprovider

# The offline install's own tests (deploy/install/labinstall): its manifest against the panel's catalogue
# (every template the panel can deploy must be buildable offline), the extras' image ISOs, the media
# folder's package lists against the builds, and its helpers.
install-test:
  stage: build
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip
  cache:
    key: install-test
    paths: [.pip/]
  script:
    - pip install --quiet pyyaml==6.0.3 pyvmomi==9.1.1.0 pytest==9.1.1
    - cd deploy/install
    - python -m pytest -q -p no:cacheprovider labinstall/

deploy:
  stage: deploy
  image: alpine:3
  needs: [build, backend-test, scripts-check, install-test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  environment:
    name: production
    url: https://${SITE_ADDRESS}
  before_script:
    - apk add --no-cache bash openssh-client rsync
    - install -d -m 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - SKIP_BUILD=1 SSH_KEY="$SSH_PRIVATE_KEY" deploy/deploy.sh
