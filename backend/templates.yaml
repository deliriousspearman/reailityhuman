# Template versions the panel can deploy, and those planned (prepped, the template not built yet).
# Everything else in the frontend's catalogue (frontend/src/lib/templates.ts) shows as "coming soon".
#
#   vsphere     the vSphere template, under the datacenter's VM folder. It needs a snapshot named
#               "clean" (machines are linked clones of it), cloud-init and open-vm-tools. How to
#               build one: docs/setup-vsphere.md and scripts/template/.
#   username    the account cloud-init creates; its password is generated for each machine.
#   family      debian (Debian, Ubuntu; the default), rhel (CentOS Stream, Rocky, Alma) or windows
#               (sysprepped with Cloudbase-Init: scripts/template/prepare.ps1 and clean.ps1).
#   adminGroup  optional: the group that gives that account sudo. Default: "sudo" for the debian
#               family, "wheel" for rhel. (Windows users always go in Administrators.)
#   extras      optional: extras (extras.yaml) people can tick at deploy. Only list those whose
#               packages are in the template, i.e. it was built with scripts/template/prepare.sh
#               from after extras existed; older templates list none.
#   access      optional: how people reach it, from ssh, rdp, web and console. Default: what the
#               frontend's catalogue (frontend/src/lib/templates.ts) says for the template.
#   webUrl      optional: its web interface, with {ip} for its address. Default: the catalogue's,
#               else https://{ip}/
#   planned     optional: true while its template isn't built yet. It can't be deployed, but shows
#               under each service it will offer ("Soon"). Once built, take this out.
#   plannedExtras  optional: extras prepped in prepare.sh but not in this template yet, as it was built
#               before them; shown as "Soon" under those services. Once rebuilt, move them to extras.
#
# Each template and version here must also be in the frontend's catalogue, which has its name,
# description and category (a test checks).

- template: ubuntu
  version: "26.04"
  # Built by Packer (packer/build.sh ubuntu) on 2026-10-16, with every extra baked in.
  vsphere: Labs/Templates/tpl-ubuntu-26.04-20261016
  cpu: 2
  memoryGB: 2
  diskGB: 25
  username: ubuntu
  family: debian
  extras: [nginx, apache, apache-https, wordpress, nextcloud, nextcloud-snap, postgresql, mariadb, mysql, sqlite, mail, ftp, desktop]

# Windows Server 2025, with Desktop Experience and as Server Core (packer/windows-server, or by hand:
# docs/setup-vsphere.md, "Windows Server templates"). Windows needs more memory: Core runs in 2 GB, the
# desktop wants 4.
- template: windows-server
  version: "2025"
  # Built by Packer (packer/build.sh windows-server) on 2026-10-16, with Office's and SQL Server's files.
  vsphere: Labs/Templates/tpl-windows-server-2025-20261016
  cpu: 2
  memoryGB: 4
  diskGB: 60
  username: labadmin
  family: windows
  access: [rdp, ssh, console]
  extras: [iis, mssql, outlook]   # SQL Server and Outlook: built with prepare.ps1 -SqlServer and -Office
- template: windows-server
  version: "2025 Core"
  # Built by Packer (packer/build.sh windows-server -var edition=core) on 2026-10-16, with SQL Server's files.
  vsphere: Labs/Templates/tpl-windows-server-2025-core-20261016
  cpu: 2
  memoryGB: 2
  diskGB: 40
  username: labadmin
  family: windows
  access: [rdp, ssh, console]
  extras: [iis, mssql]   # not Outlook: it needs the desktop

# Kali Linux and Parrot Security: attack boxes, reached over Remote Desktop to their own desktop
# (packer/kali, or by hand: docs/setup-vsphere.md, "Kali Linux and Parrot Security templates"). Not
# the desktop extra: they have their own; nor MySQL: Debian has only MariaDB.
- template: kali
  version: "2026.2"
  # Built by Packer (packer/build.sh kali) on 2026-10-16.
  vsphere: Labs/Templates/tpl-kali-2026.2-20261016
  cpu: 2
  memoryGB: 4
  diskGB: 60
  username: kali
  family: debian
  access: [ssh, rdp, console]
  extras: [nginx, apache, apache-https, wordpress, nextcloud, nextcloud-snap, postgresql, mariadb, sqlite, mail, ftp]
- template: parrot
  version: "7"
  planned: true
  vsphere: Labs/Templates/tpl-parrot-7
  cpu: 2
  memoryGB: 4
  diskGB: 40
  username: labuser
  family: debian
  access: [ssh, rdp, console]
  extras: [nginx, apache, apache-https, wordpress, nextcloud, nextcloud-snap, postgresql, mariadb, sqlite, mail, ftp]
