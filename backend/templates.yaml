  version: "24.04"
  # Built by Packer (packer/build.sh ubuntu -var version=24.04 -var iso=ubuntu-24.04.5-live-server-amd64.iso) on 2026-10-18, with every
  # extra baked in.
  vsphere: Labs/Templates/tpl-ubuntu-24.04-20261018
  cpu: 2
  memoryGB: 2
  diskGB: 25
  username: ubuntu
  family: debian
  extras: [nginx, apache, apache-https, wordpress, nextcloud, nextcloud-snap, postgresql, mariadb, mysql, sqlite, mail, ftp, desktop, docker, juice-shop, dvwa, uptime-kuma, grafana, vaultwarden, gitea]
