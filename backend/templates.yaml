# Legacy practice targets: old releases, no security updates. Ubuntu 18.04 and 20.04 still have a new
# enough cloud-init (packer/ubuntu-di and packer/ubuntu); their extras are what works on their PHP and
# packages (not Nextcloud: it needs PHP 8.1+; not mail: written for Dovecot 2.4; not MySQL: its packages
# can't be fetched alongside MariaDB there, which they have instead). CentOS 7's cloud-init
# is too old, so it's the "legacy" family, set up by lab-firstboot (packer/centos-legacy), with no
# extras. Planned until each template is built.
- template: alma
  version: "8"
  # Built by Packer (packer/build.sh rhel -var distro=alma -var version=8 -var iso=…) on 2026-10-18, from AlmaLinux 8.10.
  vsphere: Labs/Templates/tpl-alma-8-20261018
  cpu: 2
  memoryGB: 2
  diskGB: 20
  username: labuser
  family: rhel
  extras: [nginx, apache, apache-https]
- template: ubuntu
  version: "20.04"
  # Built by Packer (packer/build.sh ubuntu -var version=20.04 …) on 2026-10-17.
  vsphere: Labs/Templates/tpl-ubuntu-20.04-20261017
  cpu: 2
  memoryGB: 2
  diskGB: 25
  username: ubuntu
  family: debian
  extras: [nginx, apache, apache-https, wordpress, postgresql, mariadb, sqlite, ftp]
- template: ubuntu
  version: "18.04"
  # Built by Packer (packer/build.sh ubuntu-di) on 2026-10-17, from the 18.04.6 debian-installer ISO.
  vsphere: Labs/Templates/tpl-ubuntu-18.04-20261017b
  cpu: 2
  memoryGB: 2
  diskGB: 25
  username: ubuntu
  family: debian
  # No WordPress: it needs PHP 7.4, and 18.04 has 7.2.
  extras: [nginx, apache, apache-https, postgresql, mariadb, sqlite, ftp]
- template: ubuntu
  version: "16.04"
  # Built by Packer (packer/build.sh ubuntu-di -var version=16.04 -var legacy=true) on 2026-10-18, from
  # the 16.04.7 server ISO. Its cloud-init can't read vCenter's data: the legacy family (lab-firstboot).
  vsphere: Labs/Templates/tpl-ubuntu-16.04-20261018
  cpu: 2
  memoryGB: 2
  diskGB: 25
  username: ubuntu
  family: legacy
  adminGroup: sudo
  access: [ssh, console]
- template: centos
  version: "7"
  # Built by Packer (packer/build.sh centos-legacy) on 2026-10-17, from CentOS 7.9 (2207-02).
  vsphere: Labs/Templates/tpl-centos-7-20261017
  cpu: 2
  memoryGB: 2
  diskGB: 20
  username: labuser
  family: legacy
  adminGroup: wheel
  access: [ssh, console]

# Metasploitable 2: a deliberately vulnerable Ubuntu 8.04, deployed as the complete image it is
# (packer/metasploitable/import-ms2.sh: Rapid7's image, with VMware's frozen Tools 10.0.12 added so
# the panel sees its address). Its own sign-in, msfadmin / msfadmin, is on every machine: keep these
# on the lab network only.
- template: metasploitable
  version: "2"
  # Imported on 2026-10-18 from metasploitable-linux-2.0.0.zip.
  vsphere: Labs/Templates/tpl-metasploitable-2-20261018
  cpu: 1
  memoryGB: 1
  diskGB: 8
  username: msfadmin
  password: msfadmin
  family: image
  access: [ssh, web, console]
  webUrl: http://{ip}/

