# OPNsense: a firewall (packer/opnsense). No cloud-init: scripts/template/opnsense/lab-firstboot sets
# root's password, SSH key and the host name in its config.xml at first boot (family legacy). Both
# adapters are DHCP clients on the lab network for now, with no DHCP server; WAN lets in the web UI,
# SSH and ping.
- template: opnsense
  version: "26.7"
  # Built by Packer (packer/build.sh opnsense) on 2026-10-18.
  vsphere: Labs/Templates/tpl-opnsense-26.7-20261018b
  cpu: 2
  memoryGB: 2
  diskGB: 20
  username: root
  family: legacy
  adminGroup: admins
  access: [web, ssh, console]

# VyOS: a command-line router (packer/vyos, from our own ISO: packer/vyos/build-iso.sh adds VMware Tools
# and cloud-init). Its cloud-init takes configuration commands (family vyos): the panel sets the host
# name, the user (vyos) with each machine's password and key, SSH, and DHCP on both adapters.
- template: vyos
  version: "1.5 rolling"
  # Built by Packer (packer/build.sh vyos) on 2026-10-18, from vyos-1.5-rolling-202610180239.
  vsphere: Labs/Templates/tpl-vyos-rolling-20261018b
  cpu: 2
  memoryGB: 1
  diskGB: 10
  username: vyos
  family: vyos
  access: [ssh, console]

