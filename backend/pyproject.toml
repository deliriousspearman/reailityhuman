[project]
name = "lab-deploy"
version = "0.1.0"
description = "API and job worker for the lab panel: deploys single machines on vSphere"
requires-python = ">=3.12"
dependencies = [
	"alembic==1.20.0",
	"fastapi==0.143.0",
	"procrastinate==3.10.0",
	"psycopg[binary]==3.3.6",
	"pydantic-settings==2.15.0",
	"pyvmomi==9.1.1.0",
	"pyyaml==6.0.3",
	"sqlalchemy==2.1.4",
	"uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
