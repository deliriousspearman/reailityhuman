# Pro Labs: multi-machine labs deployed as one instance (app/labs.py loads this).
#
#   slug        the lab's id (lowercase, hyphens); matches its page in frontend/src/lib/labs.ts
#   title       its name, as shown
#   description one line, shown on the catalogue card
#   level       Beginner, Intermediate or Advanced
#   domain      the AD domain (domain labs); empty for standalone
#   resetScope  lab (the whole instance resets together) or machine
#   planned     true while its golden templates aren't built: listed, but can't be deployed yet
#   machines    each a template from the catalogue (templates.yaml):
#                 name       role name; the machine's hostname is <instance>-<name> (keep it short)
#                 template   a template id, and version
#                 role       shown to learners
#                 bootOrder  lower sets up first (the domain controller before members)
#                 extras     extras applied at deploy (usually none: golden templates are pre-built)
#   flags       the flags planted per instance, for the checklist on the lab's page:
#                 id, where (a human description of where it's planted)

# Brookfield Logistics: a small company's Active Directory domain with the common misconfigurations,
# for practising a domain compromise end to end. Deployed from golden templates built once (the
# domain, Exchange with mailboxes and sample mail, and a joined workstation), so an instance comes up
# in minutes. Its weaknesses are seeded at deploy by the brookfield-dc and brookfield-member extras
# (extras.yaml), adapted from the vuln-ad project, on top of the Active Directory and Exchange extras.
# The members join the instance's own domain controller through "@dc" (the panel wires it up). Exchange
# makes a Brookfield instance take a few hours to deploy; it's a long-lived, one-at-a-time lab.
- slug: brookfield
  title: Brookfield Logistics
  description: A small company's Windows domain — a controller, a mail server and a staff workstation — set up with the usual Active Directory weaknesses to find and chain.
  level: Intermediate
  domain: brookfield.local
  resetScope: lab
  machines:
    - name: dc
      template: windows-server
      version: "2025"
      role: Domain controller
      bootOrder: 1
      extras:
        - {domain-controller: {domain: brookfield.local, netbios: BROOKFIELD}}
        - brookfield-dc
    - name: mail
      template: exchange
      version: SE
      role: Exchange mail server
      bootOrder: 2
      extras:
        - {exchange: {dc: "@dc", organization: Brookfield Logistics}}
        - {brookfield-member: {role: mail, dc: "@dc"}}
    - name: ws
      template: windows
      version: "11"
      role: Staff workstation
      bootOrder: 2
      extras:
        - {join-domain: {dc: "@dc"}}
        - {brookfield-member: {role: ws, dc: "@dc"}}
  # Planted fresh in every instance (actions.plant_flags), once each machine is running. file: the
  # flag's value is written there; run: the program is run with the value as its last argument. The
  # seeding extras make these paths and the share, and write the mail script.
  flags:
    - id: user
      where: the staff workstation, on the signed-in user's desktop (user.txt)
      machine: ws
      file: C:\Users\Public\Desktop\user.txt
    - id: share
      where: the Finance file share on the domain controller (flag.txt)
      machine: dc
      file: C:\Shares\Finance\flag.txt
    - id: mail
      where: a message in a user's mailbox (Outlook on the web)
      machine: mail
      run: C:\lab\plant-mail-flag.ps1
    - id: root
      where: the domain controller, on the Administrator's desktop (root.txt)
      machine: dc
      file: C:\Users\Administrator\Desktop\root.txt

# Meridian Logistics: a larger Active Directory domain with two replicating controllers, a certificate
# authority (AD CS), a SQL Server, a staff workstation and a Linux web portal. Built from the base
# templates with the Active Directory, AD CS, SQL Server and domain-join extras, then seeded into the
# lab by the meridian-* extras (extras.yaml). The centrepiece is a certificate relay across the two
# controllers (coerce dc2 -> relay to dc1's web enrolment, ESC8 -> a dc2 certificate -> DCSync); other
# routes are Kerberoasting, a backup account with replication rights, a GPP password in SYSVOL and an
# ESC1 template. Members wire to the instance's own first controller through "@dc1". Flat LAN with DHCP
# for now (the DMZ/Internal split waits for Networks). planned until its end-to-end walk-through passes.
- slug: meridian
  title: Meridian Logistics
  description: A larger Windows domain — two replicating controllers with a certificate authority, a SQL Server, a workstation and a Linux portal — chaining a web foothold to a full domain takeover via a certificate relay.
  level: Advanced
  domain: meridian.example
  resetScope: lab
  planned: true
  machines:
    - name: dc1
      template: windows-server
      version: "2025"
      role: First domain controller (with AD CS)
      bootOrder: 1
      extras:
        - {domain-controller: {domain: meridian.example, netbios: MERIDIAN}}
        - adcs
        - meridian-dc
    - name: dc2
      template: windows-server
      version: "2025"
      role: Second domain controller (replica)
      bootOrder: 2
      extras:
        - {additional-dc: {dc: "@dc1"}}
        - meridian-dc2
    - name: sql
      template: windows-server
      version: "2025"
      role: SQL Server
      bootOrder: 3
      extras:
        - {join-domain: {dc: "@dc1"}}
        - mssql
        - {meridian-member: {role: sql, dc: "@dc1"}}
    - name: ws
      template: windows
      version: "11"
      role: Staff workstation
      bootOrder: 3
      extras:
        - {join-domain: {dc: "@dc1"}}
        - {meridian-member: {role: ws, dc: "@dc1"}}
    - name: web
      template: ubuntu
      version: "24.04"
      role: Public web portal (domain-joined)
      bootOrder: 3
      extras:
        - {join-domain-linux: {dc: "@dc1"}}
        - meridian-web
  # Planted fresh per instance (actions.plant_flags) once each machine is running.
  flags:
    - id: web-user
      where: the web portal, readable after the foothold (/var/www/user.txt)
      machine: web
      file: /var/www/user.txt
    - id: web-root
      where: the web portal, after escalating to root (/root/root.txt)
      machine: web
      file: /root/root.txt
    - id: sql
      where: the SQL Server, on the Administrator's desktop (flag.txt)
      machine: sql
      file: C:\Users\Administrator\Desktop\flag.txt
    - id: ws
      where: the staff workstation, on the public desktop (user.txt)
      machine: ws
      file: C:\Users\Public\Desktop\user.txt
    - id: share
      where: the Logistics file share on the first controller (flag.txt)
      machine: dc1
      file: C:\Shares\Logistics\flag.txt
    - id: sysvol
      where: SYSVOL on the first controller (replicated to the second — confirm it there)
      machine: dc1
      file: C:\Windows\SYSVOL\sysvol\meridian.example\scripts\flag.txt
    - id: root
      where: the first domain controller, on the Administrator's desktop (root.txt)
      machine: dc1
      file: C:\Users\Administrator\Desktop\root.txt
