- id: k3s
  name: k3s (Kubernetes)
  category: Developer tools
  mediaIso: lab-media-k3s-v1.36.5-k3s1.iso
  description: k3s, a small certified Kubernetes, as a one-node cluster, with kubectl set up for the machine's user and Traefik taking web traffic on ports 80 and 443. Optionally with example workloads. Works offline.
  ports: [6443, 80, 443]
  minMemoryGB: 4
  minCPU: 2
  diskGB: 4
  setupMinutes: 5
  notes:
    - "Sign in over SSH and use kubectl, e.g. kubectl get nodes. To use it from elsewhere, copy ~/.kube/config and change its server to https://{ip}:6443. Images must already be on the machine (k3s ctr images import), as there's no internet."
    - text: "Example workloads, in the namespace demo: the deployment web (nginx, 2 replicas) with its service and an ingress answering on http://{ip}/, a config map, a secret (db-credentials) and the cron job hello (every 5 minutes)."
      when: {sample_data: ["yes"]}
  options:
    - id: sample_data
      label: Add example workloads
      help: A namespace with a web deployment and its ingress, a config map, a secret and a cron job, using images already on the machine.
      type: boolean
      default: "no"
  debian:
    packages: []
    script: |
      ip=$(lab_ip)
      dir=/var/lib/lab-deploy/k3s
      lab_media "$dir"
      install -m 0755 "$dir/k3s" /usr/local/bin/k3s
      # Images k3s imports at start: its own, and the example workloads'.
      mkdir -p /var/lib/rancher/k3s/agent/images
      cp "$dir/k3s-airgap-images-amd64.tar.zst" "$dir/demo-images.tar" /var/lib/rancher/k3s/agent/images/
      INSTALL_K3S_SKIP_DOWNLOAD=true K3S_KUBECONFIG_MODE=600 sh "$dir/install.sh" --tls-san "$ip" >/dev/null
      rm -rf "$dir"
      for i in $(seq 150); do
        k3s kubectl get nodes 2>/dev/null | grep -qw Ready && break
        sleep 2
      done
      k3s kubectl wait --for=condition=Ready node --all --timeout=120s >/dev/null
      home=$(getent passwd "$username" | cut -d: -f6)
      install -d -m 700 -o "$username" -g "$(id -gn "$username")" "$home/.kube"
      install -m 600 -o "$username" -g "$(id -gn "$username")" /etc/rancher/k3s/k3s.yaml "$home/.kube/config"
      echo 'export KUBECONFIG="$HOME/.kube/config"' >/etc/profile.d/lab-k3s.sh
      if [ "$sample_data" = yes ]; then
        k3s kubectl apply -f - >/dev/null <<EOF
      apiVersion: v1
      kind: Namespace
      metadata: {name: demo}
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: web-content, namespace: demo}
      data:
        index.html: "<h1>Hello from k3s on $hostname</h1><p>Served by the deployment web, in the namespace demo.</p>"
      ---
      apiVersion: v1
      kind: Secret
      metadata: {name: db-credentials, namespace: demo}
      stringData: {username: shop, password: $(openssl rand -hex 12)}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: web, namespace: demo, labels: {app: web}}
      spec:
        replicas: 2
        selector: {matchLabels: {app: web}}
        template:
          metadata: {labels: {app: web}}
          spec:
            containers:
              - name: nginx
                image: nginx:1.30.6-alpine
                imagePullPolicy: Never
                ports: [{containerPort: 80}]
                volumeMounts: [{name: content, mountPath: /usr/share/nginx/html}]
            volumes: [{name: content, configMap: {name: web-content}}]
      ---
      apiVersion: v1
      kind: Service
      metadata: {name: web, namespace: demo}
      spec:
        selector: {app: web}
        ports: [{port: 80, targetPort: 80}]
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: web, namespace: demo}
      spec:
        ingressClassName: traefik
        rules:
          - http:
              paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]
      ---
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: hello, namespace: demo}
      spec:
        schedule: "*/5 * * * *"
        jobTemplate:
          spec:
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: hello
                    image: busybox:1.37.0
                    imagePullPolicy: Never
                    command: [sh, -c, "date; echo Hello from the cron job hello"]
      EOF
        k3s kubectl -n demo rollout status deployment/web --timeout=180s >/dev/null
        for i in $(seq 60); do
          curl -fs http://127.0.0.1/ 2>/dev/null | grep -q "Hello from k3s" && break
          sleep 2
        done
      fi

- id: gitlab
  name: GitLab CE
  category: Developer tools
  dockerImage: gitlab/gitlab-ce:19.5.1-ce.0
  description: GitLab Community Edition (in Docker), Git hosting with issues, merge requests and CI/CD, as the machine's website, with its user as an administrator. Git over SSH on port 2222. Optionally with example projects. It needs 8 GB of memory and takes about ten minutes to start.
  ports: [80, 2222]
  minMemoryGB: 8
  minCPU: 4
  diskGB: 10
  setupMinutes: 20
  password: true
  links: ["http://{ip}/"]
  notes:
    - "Sign in as {username} (or root), with the machine's password. Clone over SSH with ssh://git@{ip}:2222/<group>/<project>.git. There are no CI runners: pipelines wait."
    - text: "Example data: the group lab-examples with webapp (a small Flask app with CI settings, issues, labels, a milestone and an open merge request) and infrastructure (deployment scripts, with a password committed and then removed, still in its history), and a CI/CD variable."
      when: {sample_data: ["yes"]}
  options:
    - id: sample_data
      label: Add example projects
      help: A group with two projects, their issues, labels, a milestone, a merge request and a CI/CD variable; one project has a password left in its Git history, to find.
      type: boolean
      default: "no"
  debian:
    packages: [docker.io]
    script: |
      ip=$(lab_ip)
      lab_docker gitlab --hostname "$hostname" -p 80:80 -p 2222:22 --shm-size 256m \
        -v gitlab-config:/etc/gitlab -v gitlab-logs:/var/log/gitlab -v gitlab-data:/var/opt/gitlab \
        -e GITLAB_ROOT_PASSWORD="$password" \
        -e GITLAB_OMNIBUS_CONFIG="external_url 'http://$ip'; gitlab_rails['gitlab_shell_ssh_port'] = 2222; puma['worker_processes'] = 0; sidekiq['concurrency'] = 10; prometheus_monitoring['enable'] = false; gitlab_rails['usage_ping_enabled'] = false" \
        gitlab/gitlab-ce:19.5.1-ce.0
      # Ready once every part of it answers (from inside: the check only answers to localhost).
      for _ in $(seq 180); do
        docker exec gitlab curl -fs -o /dev/null 'http://localhost/-/readiness?all=1' 2>/dev/null && break
        sleep 10
      done
      docker exec gitlab curl -fs -o /dev/null 'http://localhost/-/readiness?all=1' || { echo "GitLab didn't start in 30 minutes."; exit 1; }
      # A token for root, for an hour, to set the rest up through GitLab's API; deleted at the end.
      token="glpat-$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
      docker exec -e LAB_TOKEN="$token" gitlab gitlab-rails runner \
        "t = User.find_by_username('root').personal_access_tokens.create!(name: 'lab-panel-setup', scopes: ['api', 'sudo'], expires_at: 1.day.from_now); t.set_token(ENV['LAB_TOKEN']); t.save!"
      LAB_TOKEN=$token LAB_USER=$username LAB_PASSWORD=$password LAB_HOST=$hostname LAB_SAMPLE=$sample_data python3 - <<'EOF'
      import json, os, sys, time, urllib.error, urllib.parse, urllib.request

      API = "http://127.0.0.1/api/v4"
      TOKEN, USER, SAMPLE = os.environ["LAB_TOKEN"], os.environ["LAB_USER"], os.environ["LAB_SAMPLE"] == "yes"


      def call(method, path, /, **data):
          req = urllib.request.Request(API + path, method=method, headers={"PRIVATE-TOKEN": TOKEN, "Content-Type": "application/json"},
                                       data=json.dumps(data).encode() if data else None)
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  if e.code >= 500 and attempt < 9:
                      time.sleep(10)
                      continue
                  sys.exit(f"GitLab refused {method} {path}: {e.code} {e.read().decode(errors='replace')[:300]}")


      users = call("GET", "/users?username=" + urllib.parse.quote(USER))
      user = users[0] if users else call(
          "POST", "/users", username=USER, name=USER, email=f"{USER}@{os.environ['LAB_HOST']}.lab.example",
          password=os.environ["LAB_PASSWORD"], admin=True, skip_confirmation=True)
      call("PUT", "/application/settings", signup_enabled=False)
      if not SAMPLE:
          sys.exit(0)

      group = call("POST", "/groups", name="Lab examples", path="lab-examples", visibility="internal")
      call("POST", f"/groups/{group['id']}/members", user_id=user["id"], access_level=50)


      def project(name, description, files, message):
          p = call("POST", "/projects", name=name, namespace_id=group["id"], description=description, visibility="internal",
                   initialize_with_readme=False)
          call("POST", f"/projects/{p['id']}/repository/commits", branch="main", commit_message=message,
               actions=[{"action": "create", "file_path": f, "content": c} for f, c in files.items()])
          return p


      web = project("webapp", "A small Flask web app, with tests and CI settings.", {
          "README.md": "# webapp\n\nA small Flask app. Run it with `flask --app app run`.\n",
          "app.py": "from flask import Flask\n\napp = Flask(__name__)\n\n\n@app.get('/')\ndef index():\n    return 'Hello from webapp'\n",
          "requirements.txt": "flask==3.1.2\npytest==8.4.2\n",
          "tests/test_app.py": "from app import app\n\n\ndef test_index():\n    assert app.test_client().get('/').status_code == 200\n",
          ".gitlab-ci.yml": "stages: [test, build]\n\ntest:\n  stage: test\n  image: python:3.12\n  script:\n    - pip install -r requirements.txt\n    - pytest\n\nbuild:\n  stage: build\n  image: python:3.12\n  script:\n    - echo Building webapp\n",
      }, "First version of webapp")
      pid = web["id"]
      for name, color in (("bug", "#d9534f"), ("feature", "#5cb85c"), ("security", "#f0ad4e")):
          call("POST", f"/projects/{pid}/labels", name=name, color=color)
      milestone = call("POST", f"/projects/{pid}/milestones", title="v1.0", description="The first release.")
      issues = [
          ("Login page returns 500 with an empty password", "Steps: open /login, leave the password empty, submit.", "bug"),
          ("Add a login page", "Users need to sign in before they see their dashboard.", "feature"),
          ("Session cookie is missing the Secure flag", "Found in the last security review.", "security"),
          ("Write the deployment guide", "How to run webapp behind nginx.", "feature"),
          ("Typo on the home page", "'Helo' should be 'Hello'.", "bug"),
      ]
      for title, text, label in issues:
          issue = call("POST", f"/projects/{pid}/issues", title=title, description=text, labels=label, milestone_id=milestone["id"])
      call("PUT", f"/projects/{pid}/issues/{issue['iid']}", state_event="close")
      call("POST", f"/projects/{pid}/repository/branches", branch="feature/login", ref="main")
      call("POST", f"/projects/{pid}/repository/commits", branch="feature/login", commit_message="Add a login page",
           actions=[{"action": "create", "file_path": "templates/login.html",
                     "content": "<form method=\"post\">\n  <input name=\"user\">\n  <input name=\"password\" type=\"password\">\n  <button>Sign in</button>\n</form>\n"}])
      call("POST", f"/projects/{pid}/merge_requests", source_branch="feature/login", target_branch="main", title="Add a login page",
           description="Closes #2.", labels="feature", milestone_id=milestone["id"])
      call("POST", f"/projects/{pid}/variables", key="DEPLOY_TOKEN", value="lab-example-not-a-real-token", masked=False)

      infra = project("infrastructure", "Deployment scripts for webapp.", {
          "README.md": "# infrastructure\n\nScripts that deploy webapp.\n",
          "deploy.sh": "#!/bin/sh\nset -e\n. ./secrets.env\nscp -r app/ deploy@web01:/srv/webapp\n",
          "secrets.env": "DB_PASSWORD=Summer2024!\nAPI_KEY=lab-example-key-123\n",
      }, "Add deployment scripts")
      call("POST", f"/projects/{infra['id']}/repository/commits", branch="main", commit_message="Remove secrets from the repository",
           actions=[{"action": "delete", "file_path": "secrets.env"}])
      EOF
      # The setup token goes: only the people signing in remain.
      docker exec gitlab gitlab-rails runner "PersonalAccessToken.where(name: 'lab-panel-setup').each(&:revoke!)" >/dev/null

- id: jenkins
  name: Jenkins
  category: Developer tools
  dockerImage: lab-deploy/jenkins:2.580.2
  description: Jenkins LTS (in Docker) on port 8080, with pipelines, configuration as code and Job DSL, and its user as the administrator. Optionally with example jobs and their builds.
  ports: [8080]
  minMemoryGB: 4
  diskGB: 3
  setupMinutes: 5
  password: true
  links: ["http://{ip}:8080/"]
  notes:
    - "Sign in as {username}, with the machine's password. Its settings are configuration as code: /etc/jenkins-lab/jenkins.yaml, applied at each start."
    - text: "Example jobs, each built once: hello-pipeline, parameterized-deploy (dev, staging or prod), flaky-tests (fails half the time), uses-a-secret (the credential deploy-api-key) and nightly-backup (a freestyle job on a schedule)."
      when: {sample_data: ["yes"]}
  options:
    - id: sample_data
      label: Add example jobs
      help: Five jobs (pipelines, parameters, a flaky one, one using a stored credential, a scheduled freestyle job), each built once so there's history.
      type: boolean
      default: "no"
  debian:
    packages: [docker.io]
    script: |
      ip=$(lab_ip)
      conf=/etc/jenkins-lab
      mkdir -p "$conf"
      # Configuration as code: the user and password come from the container's environment (${...} is
      # read by Jenkins, not here), so nothing in them can change the file.
      cat >"$conf/jenkins.yaml" <<'EOF'
      jenkins:
        systemMessage: "Jenkins on a lab machine, set up by the lab panel."
        numExecutors: 2
        securityRealm:
          local:
            allowsSignup: false
            users:
              - id: "${LAB_USER}"
                password: "${LAB_PASSWORD}"
        authorizationStrategy:
          loggedInUsersCanDoAnything:
            allowAnonymousRead: false
      unclassified:
        location:
          url: "${LAB_URL}"
      EOF
      if [ "$sample_data" = yes ]; then
        cat >>"$conf/jenkins.yaml" <<'EOF'
      credentials:
        system:
          domainCredentials:
            - credentials:
                - string:
                    scope: GLOBAL
                    id: deploy-api-key
                    description: An example secret for uses-a-secret
                    secret: lab-example-not-a-real-key
      jobs:
        - script: |
            pipelineJob('hello-pipeline') {
              description('A pipeline in stages, with an artifact.')
              definition { cps { sandbox(true); script('''
                pipeline {
                  agent any
                  stages {
                    stage('Checkout') { steps { echo 'Checking out the code' } }
                    stage('Build') { steps { sh 'echo Building; sleep 2' } }
                    stage('Test') { steps { sh 'echo 12 tests passed' } }
                    stage('Package') { steps { writeFile file: 'app.txt', text: 'build output'; archiveArtifacts 'app.txt' } }
                  }
                }
              ''') } }
            }
            pipelineJob('parameterized-deploy') {
              description('Choose where to deploy.')
              parameters {
                choiceParam('TARGET', ['dev', 'staging', 'prod'], 'Where to deploy')
                booleanParam('DRY_RUN', true, 'Only show what would happen')
              }
              definition { cps { sandbox(true); script('''
                pipeline {
                  agent any
                  stages {
                    stage('Deploy') { steps { echo 'Deploying to ' + params.TARGET + (params.DRY_RUN ? ' (dry run)' : '') } }
                  }
                }
              ''') } }
            }
            pipelineJob('flaky-tests') {
              description('Fails about half the time.')
              definition { cps { sandbox(true); script('''
                pipeline {
                  agent any
                  stages {
                    stage('Test') { steps { sh 'test $(( $$ % 2 )) -eq 0 || { echo One test failed; exit 1; }' } }
                  }
                }
              ''') } }
            }
            pipelineJob('uses-a-secret') {
              description('Uses the credential deploy-api-key.')
              definition { cps { sandbox(true); script('''
                pipeline {
                  agent any
                  stages {
                    stage('Call the API') {
                      steps {
                        withCredentials([string(credentialsId: 'deploy-api-key', variable: 'KEY')]) {
                          sh 'echo Calling the API with a key of $(printf %s "$KEY" | wc -c) characters'
                        }
                      }
                    }
                  }
                }
              ''') } }
            }
            freeStyleJob('nightly-backup') {
              description('A freestyle job on a schedule.')
              triggers { cron('H 2 * * *') }
              steps { shell('echo Backing up; tar czf backup.tgz --files-from /dev/null') }
            }
      EOF
      fi
      chmod 644 "$conf/jenkins.yaml"
      lab_docker jenkins -p 8080:8080 -v jenkins:/var/jenkins_home -v "$conf:/var/jenkins_casc:ro" \
        -e CASC_JENKINS_CONFIG=/var/jenkins_casc/jenkins.yaml -e LAB_USER="$username" -e LAB_PASSWORD="$password" \
        -e LAB_URL="http://$ip:8080/" lab-deploy/jenkins:2.580.2
      lab_wait_http http://127.0.0.1:8080/login 600
      for _ in $(seq 120); do
        [ "$(curl -s -o /dev/null -w '%{http_code}' -u "$username:$password" http://127.0.0.1:8080/api/json)" = 200 ] && break
        sleep 5
      done
      if [ "$sample_data" = yes ]; then
        # Each job built once, so there's history (a crumb with its session cookie, as Jenkins asks).
        jar=$(mktemp)
        crumb=$(curl -fsS -c "$jar" -u "$username:$password" 'http://127.0.0.1:8080/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,":",//crumb)')
        for job in hello-pipeline flaky-tests uses-a-secret nightly-backup; do
          curl -fsS -b "$jar" -u "$username:$password" -H "$crumb" -X POST "http://127.0.0.1:8080/job/$job/build" -o /dev/null
        done
        curl -fsS -b "$jar" -u "$username:$password" -H "$crumb" -X POST "http://127.0.0.1:8080/job/parameterized-deploy/buildWithParameters?TARGET=staging" -o /dev/null
        rm -f "$jar"
      fi

- id: minio
  name: MinIO
  category: Storage
  description: MinIO, S3-compatible object storage, with its web console and its user as the administrator; and mc, its command-line client. The April 2025 release, the last with the full console.
  ports: [9000, 9001]
  diskGB: 2
  password: true
  links: ["http://{ip}:9001/"]
  notes:
    - "Sign in to the console as {username}, with the machine's password."
    - "The S3 API is http://{ip}:9000: access key {username}, secret key the machine's password. On the machine, mc knows it as lab, e.g. mc ls lab."
  options:
    - id: bucket
      label: Bucket
      help: A bucket to make, e.g. backups. Leave it blank for none.
      type: text
      pattern: "[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]"
  debian:
    # Built from source into the template (prepare.sh's bake_minio; scripts/template/build-minio.sh).
    packages: []
    script: |
      [ -x /usr/local/bin/minio ] || { echo "This template has no MinIO: rebuild it with today's prepare.sh."; exit 1; }
      id minio-user >/dev/null 2>&1 || useradd -r -M -d /var/lib/minio -s /usr/sbin/nologin minio-user
      install -d -o minio-user -g minio-user -m 750 /var/lib/minio
      # Its administrator, for systemd: in double quotes, with \ and " escaped.
      quote() { local v=${1//\\/\\\\}; printf '"%s"' "${v//\"/\\\"}"; }
      install -m 600 /dev/null /etc/default/minio
      cat >/etc/default/minio <<EOF
      MINIO_VOLUMES=/var/lib/minio
      MINIO_OPTS="--address :9000 --console-address :9001"
      MINIO_ROOT_USER=$(quote "$username")
      MINIO_ROOT_PASSWORD=$(quote "$password")
      EOF
      cat >/etc/systemd/system/minio.service <<'EOF'
      # Written by the lab panel's minio extra.
      [Unit]
      Description=MinIO object storage
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=minio-user
      Group=minio-user
      EnvironmentFile=/etc/default/minio
      ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
      Restart=always
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
      EOF
      systemctl daemon-reload
      systemctl enable -q minio
      systemctl restart minio
      lab_wait_http http://127.0.0.1:9000/minio/health/live
      lab_open 9000/tcp 9001/tcp
      # mc, signed in as the administrator, for the user and root.
      sudo -u "$username" -H /usr/local/bin/mc alias set lab http://127.0.0.1:9000 "$username" "$password" >/dev/null
      /usr/local/bin/mc alias set lab http://127.0.0.1:9000 "$username" "$password" >/dev/null
      if [ -n "$bucket" ]; then /usr/local/bin/mc mb --ignore-existing "lab/$bucket" >/dev/null; fi

# Wazuh: the server (manager, indexer and dashboard on one machine), and its agent on other machines,
# which picks a Wazuh server machine and enrols with it. Both from files kept in the template
# (prepare.sh's bake_wazuh and bake_wazuh_agent), so they work offline.

- id: elk
  name: Elastic Stack (ELK)
  category: Monitoring
  dockerImages: [elasticsearch:9.5.5, kibana:9.5.5, logstash:9.5.5]
  description: Elasticsearch, Logstash and Kibana (in Docker), for collecting, searching and charting logs, with the machine's user as a superuser. Kibana on port 5601, Elasticsearch on 9200, and Logstash taking Beats on 5044, JSON lines over TCP on 5000 and syslog on UDP 5514. Optionally with Kibana's example data and this machine's own logs. It needs 8 GB of memory.
  ports: [9200, 5601, 5044, 5000, 5514]
  minMemoryGB: 8
  minCPU: 2
  diskGB: 8
  setupMinutes: 10
  password: true
  links: ["http://{ip}:5601/"]
  notes:
    - "Sign in to Kibana as {username} (or elastic), with the machine's password; Elasticsearch takes the same, e.g. curl -u {username} http://{ip}:9200/. Logstash puts what it gets in the logstash-* indexes (the Logstash data view in Kibana)."
    - "Windows machines can send their event logs here: deploy one with Send event logs to ELK, choosing this machine. They're in the Windows event logs data view."
    - text: "Example data: Kibana's web logs, ecommerce orders and flights, with their dashboards, and this machine's syslog, sent through Logstash."
      when: {sample_data: ["yes"]}
  options:
    - id: sample_data
      label: Add example data
      help: Kibana's three example data sets (web logs, ecommerce, flights) and their dashboards, and this machine's own syslog sent through Logstash.
      type: boolean
      default: "no"
  debian:
    packages: [docker.io]
    script: |
      ip=$(lab_ip)
      conf=/etc/elk-lab
      mkdir -p "$conf/pipeline"
      # Elasticsearch needs more memory maps than Linux allows by default.
      echo "vm.max_map_count = 262144" >/etc/sysctl.d/90-lab-elastic.conf
      sysctl -q -w vm.max_map_count=262144
      systemctl enable -q --now docker
      docker network inspect elk >/dev/null 2>&1 || docker network create elk >/dev/null
      jstr() { V="$1" python3 -c 'import json, os; print(json.dumps(os.environ["V"]))'; }
      lab_docker elasticsearch --network elk -p 9200:9200 -v elasticsearch:/usr/share/elasticsearch/data \
        -e discovery.type=single-node -e xpack.security.http.ssl.enabled=false -e ES_JAVA_OPTS="-Xms2g -Xmx2g" \
        -e ELASTIC_PASSWORD="$password" elasticsearch:9.5.5
      es() { curl -fsS -u "elastic:$password" -H 'Content-Type: application/json' "$@"; }
      for i in $(seq 180); do
        es -o /dev/null "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" 2>/dev/null && break
        sleep 2
      done
      es -o /dev/null "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
      kibana_password=$(openssl rand -hex 16)
      es -o /dev/null -X POST http://127.0.0.1:9200/_security/user/kibana_system/_password -d "{\"password\":\"$kibana_password\"}"
      es -o /dev/null -X POST "http://127.0.0.1:9200/_security/user/$username" \
        -d "{\"password\":$(jstr "$password"),\"roles\":[\"superuser\"],\"full_name\":\"$username\"}"
      cat >"$conf/pipeline/logstash.conf" <<'EOF'
      # Written by the lab panel: Beats, JSON lines over TCP and syslog over UDP, into logstash-* indexes;
      # Windows event logs (Winlogbeat) into winlogbeat-* ones.
      input {
        beats { port => 5044 }
        tcp { port => 5000 codec => json_lines }
        udp { port => 5514 type => "syslog" }
      }
      output {
        if [agent][type] == "winlogbeat" {
          elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            user => "elastic"
            password => "${ES_PASSWORD}"
            index => "winlogbeat-%{+YYYY.MM.dd}"
          }
        } else {
          elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            user => "elastic"
            password => "${ES_PASSWORD}"
            index => "logstash-%{+YYYY.MM.dd}"
          }
        }
      }
      EOF
      lab_docker logstash --network elk -p 5044:5044 -p 5000:5000 -p 5514:5514/udp \
        -v "$conf/pipeline:/usr/share/logstash/pipeline:ro" -e ES_PASSWORD="$password" \
        -e XPACK_MONITORING_ENABLED=false -e LS_JAVA_OPTS="-Xms512m -Xmx512m" logstash:9.5.5
      lab_docker kibana --network elk -p 5601:5601 -e ELASTICSEARCH_HOSTS=http://elasticsearch:9200 \
        -e ELASTICSEARCH_USERNAME=kibana_system -e ELASTICSEARCH_PASSWORD="$kibana_password" \
        -e XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY="$(openssl rand -hex 32)" -e TELEMETRY_OPTIN=false \
        -e SERVER_PUBLICBASEURL="http://$ip:5601" kibana:9.5.5
      # Sample data's routes are internal ones: Kibana takes them only with x-elastic-internal-origin.
      kb() { curl -fsS -u "$username:$password" -H 'kbn-xsrf: lab' -H 'x-elastic-internal-origin: Kibana' -H 'Content-Type: application/json' "$@"; }
      for i in $(seq 300); do
        curl -s -u "$username:$password" http://127.0.0.1:5601/api/status 2>/dev/null | grep -q '"level":"available"' && break
        sleep 2
      done
      curl -s -u "$username:$password" http://127.0.0.1:5601/api/status | grep -q '"level":"available"'
      # "Available" comes a little before all its APIs answer: the first call, until it does.
      for i in $(seq 60); do
        kb -o /dev/null -X POST http://127.0.0.1:5601/api/data_views/data_view \
          -d '{"data_view":{"title":"logstash-*","name":"Logstash","timeFieldName":"@timestamp"}}' 2>/dev/null && break
        sleep 2
      done
      kb http://127.0.0.1:5601/api/data_views | grep -qF '"title":"logstash-*"'
      # For Windows machines sending their event logs (the Send event logs to ELK extra).
      kb -o /dev/null -X POST http://127.0.0.1:5601/api/data_views/data_view \
        -d '{"data_view":{"title":"winlogbeat-*","name":"Windows event logs","timeFieldName":"@timestamp"}}'
      if [ "$sample_data" = yes ]; then
        for set in logs ecommerce flights; do
          kb -o /dev/null -X POST "http://127.0.0.1:5601/api/sample_data/$set"
        done
        for i in $(seq 120); do
          (exec 3<>/dev/tcp/127.0.0.1/5000) 2>/dev/null && break
          sleep 2
        done
        {
          for level in info info warning error info; do
            printf '{"message":"Example event from %s","level":"%s","service":"lab-shop"}\n' "$hostname" "$level"
          done
        } >/dev/tcp/127.0.0.1/5000
        if systemctl cat rsyslog.service >/dev/null 2>&1; then
          echo '*.* @127.0.0.1:5514' >/etc/rsyslog.d/90-lab-elk.conf
          systemctl restart rsyslog
          logger -t lab-panel "Syslog from $hostname now goes to Logstash"
        fi
      fi

- id: graylog
  name: Graylog
  category: Monitoring
  # MongoDB 7.0: 8.0 and 8.3 refuse to start on Linux 6.19 and later (Ubuntu 26.04's), SERVER-121912.
  dockerImages: [graylog/graylog:7.2.1, opensearchproject/opensearch:2.19.7, mongo:7.0.45]
  description: Graylog (in Docker), for collecting and searching logs, with OpenSearch and MongoDB, and the machine's user as its administrator. Its web interface on port 9000, syslog on UDP 1514 and GELF on UDP 12201. Optionally with example messages and this machine's own logs. It needs 8 GB of memory.
  ports: [9000, 1514, 12201]
  minMemoryGB: 8
  minCPU: 2
  diskGB: 6
  setupMinutes: 10
  password: true
  links: ["http://{ip}:9000/"]
  notes:
    - "Sign in as {username}, with the machine's password. Send syslog to UDP port 1514 and GELF to UDP 12201 (System → Inputs)."
    - text: "Example data: a generator input making fake web-server messages (source example.org) all the time, and this machine's syslog."
      when: {sample_data: ["yes"]}
  options:
    - id: sample_data
      label: Add example messages
      help: An input that keeps generating fake web-server messages, and this machine's own syslog sent to Graylog.
      type: boolean
      default: "no"
  debian:
    packages: [docker.io]
    script: |
      ip=$(lab_ip)
      # OpenSearch needs more memory maps than Linux allows by default.
      echo "vm.max_map_count = 262144" >/etc/sysctl.d/90-lab-opensearch.conf
      sysctl -q -w vm.max_map_count=262144
      systemctl enable -q --now docker
      docker network inspect graylog >/dev/null 2>&1 || docker network create graylog >/dev/null
      lab_docker graylog-mongodb --network graylog -v graylog-mongodb:/data/db mongo:7.0.45
      lab_docker graylog-opensearch --network graylog -v graylog-opensearch:/usr/share/opensearch/data \
        -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true \
        -e action.auto_create_index=false -e OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g" opensearchproject/opensearch:2.19.7
      lab_docker graylog --network graylog -p 9000:9000 -p 1514:1514/udp -p 12201:12201/udp -v graylog:/usr/share/graylog/data \
        -e GRAYLOG_PASSWORD_SECRET="$(openssl rand -hex 48)" -e GRAYLOG_ROOT_USERNAME="$username" \
        -e GRAYLOG_ROOT_PASSWORD_SHA2="$(printf %s "$password" | sha256sum | cut -d' ' -f1)" \
        -e GRAYLOG_HTTP_EXTERNAL_URI="http://$ip:9000/" -e GRAYLOG_ELASTICSEARCH_HOSTS=http://graylog-opensearch:9200 \
        -e GRAYLOG_MONGODB_URI=mongodb://graylog-mongodb:27017/graylog graylog/graylog:7.2.1
      for i in $(seq 300); do
        [ "$(curl -s http://127.0.0.1:9000/api/system/lbstatus 2>/dev/null)" = ALIVE ] && break
        sleep 2
      done
      [ "$(curl -s http://127.0.0.1:9000/api/system/lbstatus)" = ALIVE ]
      gl() { curl -fsS -u "$username:$password" -H 'X-Requested-By: lab-panel' -H 'Content-Type: application/json' "$@"; }
      input() { gl -o /dev/null -X POST http://127.0.0.1:9000/api/system/inputs -d "{\"title\":\"$1\",\"type\":\"$2\",\"global\":true,\"configuration\":$3}"; }
      input "Syslog UDP" org.graylog2.inputs.syslog.udp.SyslogUDPInput \
        '{"bind_address":"0.0.0.0","port":1514,"recv_buffer_size":262144,"store_full_message":true,"allow_override_date":true}'
      input "GELF UDP" org.graylog2.inputs.gelf.udp.GELFUDPInput \
        '{"bind_address":"0.0.0.0","port":12201,"recv_buffer_size":262144,"decompress_size_limit":8388608}'
      if [ "$sample_data" = yes ]; then
        input "Example web traffic" org.graylog2.inputs.random.FakeHttpMessageInput \
          '{"sleep":500,"sleep_deviation":300,"source":"example.org","throttling_allowed":false}'
        if systemctl cat rsyslog.service >/dev/null 2>&1; then
          echo '*.* @127.0.0.1:1514;RSYSLOG_SyslogProtocol23Format' >/etc/rsyslog.d/90-lab-graylog.conf
          systemctl restart rsyslog
          logger -t lab-panel "Syslog from $hostname now goes to Graylog"
        fi
      fi

- id: winlogbeat
  name: Send event logs to ELK
  category: Monitoring
  mediaIso: lab-media-winlogbeat-9.5.5.iso
  description: Winlogbeat, sending this machine's Windows event logs (Application, System, Security and PowerShell) to an Elastic Stack (ELK) machine you've deployed, through its Logstash. They're in that machine's Kibana as the Windows event logs data view.
  setupMinutes: 3
  notes:
    - "In the ELK machine's Kibana: Discover → the Windows event logs data view (winlogbeat-* indexes). Winlogbeat runs as the service winlogbeat; its settings are in C:\\Program Files\\Winlogbeat\\winlogbeat.yml."
  options:
    - id: elk
      label: Elastic Stack machine
      type: machine
      extra: elk
      help: A running machine with the Elastic Stack (ELK) extra, which receives the logs.
  windows:
    script: |
      # Winlogbeat comes on a CD: the one with lab-media.txt.
      $cd = Get-PSDrive -PSProvider FileSystem | Where-Object { Test-Path (Join-Path $_.Root 'lab-media.txt') } | Select-Object -First 1
      if (-not $cd) { throw "Winlogbeat's media CD wasn't attached." }
      $zip = Get-ChildItem -Path $cd.Root -Filter 'winlogbeat-*.zip' | Select-Object -First 1
      $dest = 'C:\Program Files\Winlogbeat'
      if (Get-Service winlogbeat -ErrorAction SilentlyContinue) { Stop-Service winlogbeat; & sc.exe delete winlogbeat | Out-Null }
      if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
      $tmp = Join-Path $env:TEMP 'lab-winlogbeat'
      Expand-Archive -Path $zip.FullName -DestinationPath $tmp -Force
      Move-Item -Path (Get-ChildItem -Path $tmp -Directory | Select-Object -First 1).FullName -Destination $dest
      Remove-Item -Recurse -Force $tmp
      @"
      # Written by the lab panel: this machine's event logs, to $elk_name's Logstash.
      winlogbeat.event_logs:
        - name: Application
          ignore_older: 72h
        - name: System
          ignore_older: 72h
        - name: Security
          ignore_older: 72h
        - name: Windows PowerShell
          ignore_older: 72h
        - name: Microsoft-Windows-PowerShell/Operational
          ignore_older: 72h
      output.logstash:
        hosts: ["${elk_ip}:5044"]
      logging.to_files: true
      "@ | Set-Content -Encoding ascii -Path "$dest\winlogbeat.yml"
      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dest\install-service-winlogbeat.ps1" | Out-Null
      if ($LASTEXITCODE) { throw "Winlogbeat's service didn't install." }
      Start-Service winlogbeat

- id: wazuh
  name: Wazuh server
  category: Security
  description: "Wazuh 4.14, the open-source SIEM and XDR: its manager, indexer and dashboard on this machine. Machines with the Wazuh agent extra report to it. Installed as the machine starts: about 15 minutes."
  ports: [443, 1514, 1515, 9200, 55000]
  password: true
  # Wazuh's own minimum for all in one: on 2 vCPU its installer's steps run past their waits (and it then
  # removes everything).
  minMemoryGB: 4
  minCPU: 4
  setupMinutes: 30
  diskGB: 20
  links: ["https://{ip}/"]
  notes:
    - "Sign in to the dashboard as {username}, with the machine's password (an administrator). The certificate is self-signed."
    - "Agents report to {ip} on ports 1514 and 1515: deploy machines with the Wazuh agent extra and choose this one."
    - "Wazuh's own accounts (admin, the API's) have generated passwords: sudo tar -xOf /root/wazuh/wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt"
    - "Vulnerability detection is off: its feed comes from the internet (cti.wazuh.com) and takes over 16 GB. With internet and the disk to spare, set it to yes under <vulnerability-detection> in /var/ossec/etc/ossec.conf and restart wazuh-manager."
  debian:
    # Its installer and its offline bundle (every package) are in /opt/lab-deploy/wazuh; these are what
    # its offline installation expects to find installed.
    packages: [apt-transport-https, libcap2-bin, gnupg, debconf, adduser, procps, curl, tar, gawk, lsof, openssl]
    script: |
      src=/opt/lab-deploy/wazuh
      [ -s "$src/wazuh-offline.tar.gz" ] || { echo "This template has no Wazuh server: rebuild it with today's prepare.sh."; exit 1; }
      rm -rf /root/wazuh
      mkdir -p /root/wazuh
      cp "$src/wazuh-install.sh" /root/wazuh/
      cd /root/wazuh
      # It gives its dashboard 5 minutes to start, then removes everything: on a busy lab host that's too
      # little. Twenty.
      sed -i 's/^\(\s*max_dashboard_initialize_retries=\)20$/\180/' wazuh-install.sh
      grep -q 'max_dashboard_initialize_retries=80' wazuh-install.sh || { echo "Wazuh's installer has changed: its dashboard wait isn't where it was."; exit 1; }
      # Its bundle, unpacked where its installer looks, and this machine's copy of it removed: there's no
      # room for it twice over (1.6 GB) and Wazuh. The installer wants the archive there too, but doesn't
      # unpack it when the folder is: an empty one stands in.
      tar -xzf "$src/wazuh-offline.tar.gz"
      rm -f "$src/wazuh-offline.tar.gz"
      tar -czf wazuh-offline.tar.gz -T /dev/null
      # Its manager's unit allows 45 seconds to start; with the indexer already running on a lab's 2 vCPU,
      # it takes longer, and the installer then removes everything. Ten minutes.
      mkdir -p /etc/systemd/system/wazuh-manager.service.d
      printf '[Service]\nTimeoutStartSec=600\n' >/etc/systemd/system/wazuh-manager.service.d/lab-timeout.conf
      # No vulnerability detection: its feed (from cti.wazuh.com, which an offline lab hasn't got) takes over
      # 16 GB as it's processed, filling the disk past what the indexer allows, which fails the install.
      # Unreachable while installing; then switched off.
      echo "127.0.0.1 cti.wazuh.com # lab panel: no vulnerability feed" >>/etc/hosts
      # Its manager's package holds a vulnerability database (vd_*.tar.xz, 456 MB) that it unpacks on its
      # first start, to about 17 GB, which filled the disk and failed the install. Not installed (dpkg leaves
      # out what path-exclude names): vulnerability detection is off anyway (below).
      echo 'path-exclude=/var/ossec/tmp/vd_*.tar.xz' >/etc/dpkg/dpkg.cfg.d/lab-wazuh
      if ! bash wazuh-install.sh --offline-installation --all-in-one </dev/null; then
        # Its last step, loading the internal users with their new passwords into the indexer (securityadmin),
        # sometimes fails on a busy 2 vCPU machine, with everything else installed and running (and Filebeat
        # already on its new password). That step again, a few times.
        tail -5 /var/log/wazuh-install.log | grep -q "Could not load the changes" || exit 1
        [ -s /etc/wazuh-indexer/backup/internal_users.yml ] || exit 1
        loaded=no
        for _ in 1 2 3 4 5; do
          sleep 20
          if OPENSEARCH_CONF_DIR=/etc/wazuh-indexer OPENSEARCH_JAVA_HOME=/usr/share/wazuh-indexer/jdk \
            /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh -p 9200 -nhnv -icl -h 127.0.0.1 \
            -cacert /etc/wazuh-indexer/certs/root-ca.pem -cert /etc/wazuh-indexer/certs/admin.pem \
            -key /etc/wazuh-indexer/certs/admin-key.pem -f /etc/wazuh-indexer/backup/internal_users.yml -t internalusers; then
            loaded=yes
            break
          fi
        done
        [ "$loaded" = yes ] || { echo "Wazuh's internal users couldn't be loaded into its indexer."; exit 1; }
        rm -rf /etc/wazuh-indexer/backup
        systemctl restart filebeat wazuh-dashboard
      fi
      rm -rf wazuh-offline wazuh-offline.tar.gz
      sed -i '/<vulnerability-detection>/,/<\/vulnerability-detection>/ s#<enabled>yes</enabled>#<enabled>no</enabled>#' /var/ossec/etc/ossec.conf
      sed -i '/cti\.wazuh\.com # lab panel/d' /etc/hosts
      # What it fetched of it: removed with the manager stopped (it's still writing there while it runs).
      systemctl stop wazuh-manager
      rm -rf /var/ossec/queue/vd /var/ossec/tmp/*
      systemctl start wazuh-manager
      rm -f /etc/dpkg/dpkg.cfg.d/lab-wazuh
      # The machine's user as a dashboard administrator, through the indexer's API. (Wazuh's own
      # password tool only takes passwords with one of .*+?- in them, which the machine's may not have.)
      admin=$(tar -xOf wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt |
        awk '/indexer_username: .admin./ { found = 1; next } found && /indexer_password:/ { gsub(/[\x27"]/, "", $2); print $2; exit }')
      body=$(python3 -c 'import json, sys; print(json.dumps({"password": sys.argv[1], "backend_roles": ["admin"]}))' "$password")
      curl -ksSf -u "admin:$admin" -X PUT -H 'Content-Type: application/json' \
        "https://127.0.0.1:9200/_plugins/_security/api/internalusers/$username" -d "$body" >/dev/null
      lab_wait_http https://127.0.0.1/ 300

- id: wazuh-agent
  name: Wazuh agent
  category: Security
  description: The Wazuh agent, reporting to a Wazuh server you've deployed (a machine with the Wazuh server extra). It enrols itself as this machine's name.
  setupMinutes: 5
  notes:
    - "It reports to the Wazuh server chosen: this machine shows in its dashboard under Agents as {hostname}."
  options:
    - id: wazuh
      label: Wazuh server
      type: machine
      extra: wazuh
      help: A running machine with the Wazuh server extra.
  debian:
    # The agent's package is in /opt/lab-deploy/wazuh-agent (prepare.sh's bake_wazuh_agent).
    packages: []
    script: |
      deb=$(ls /opt/lab-deploy/wazuh-agent/wazuh-agent_*.deb 2>/dev/null | head -1)
      [ -n "$deb" ] || { echo "This template has no Wazuh agent: rebuild it with today's prepare.sh."; exit 1; }
      WAZUH_MANAGER=$wazuh_ip WAZUH_AGENT_NAME=$hostname DEBIAN_FRONTEND=noninteractive dpkg -i "$deb" >/dev/null
      systemctl daemon-reload
      systemctl enable -q wazuh-agent
      systemctl restart wazuh-agent
      # Enrolled once it has its key from the server.
      for _ in $(seq 60); do [ -s /var/ossec/etc/client.keys ] && exit 0; sleep 5; done
      echo "It didn't enrol with $wazuh_name ($wazuh_ip): is the Wazuh server running, and port 1515 open?"
      exit 1

# Zabbix 7.0 LTS: the server (PostgreSQL, the web interface in Apache), and its agent (Zabbix agent 2) on
# other machines, which picks a Zabbix server machine and registers itself there. Their packages are in
# the template (from Zabbix's own repository), switched off.

- id: zabbix
  name: Zabbix server
  category: Monitoring
  description: Zabbix 7.0 LTS monitoring, with PostgreSQL and its web interface; its user is the administrator. Machines with the Zabbix agent extra add themselves to it, with the Linux template.
  ports: [80, 10051]
  password: true
  setupMinutes: 5
  diskGB: 3
  links: ["http://{ip}/zabbix/"]
  notes:
    - "Sign in as {username}, with the machine's password (Zabbix's Admin is renamed to it)."
    - "Agents send to {ip} on port 10051: deploy machines with the Zabbix agent extra and choose this one; they show under Monitoring → Hosts within a few minutes."
  debian:
    packages: [zabbix-server-pgsql, zabbix-frontend-php, zabbix-apache-conf, zabbix-sql-scripts, zabbix-agent2, php-pgsql, postgresql, apache2, libapache2-mod-php]
    script: |
      # PostgreSQL's SSL is on ssl-cert's snakeoil certificate, which clean.sh deletes from templates: this
      # machine's own, or it won't start (as the postgresql extra does).
      if [ ! -e /etc/ssl/private/ssl-cert-snakeoil.key ] && command -v make-ssl-cert >/dev/null; then
        make-ssl-cert generate-default-snakeoil --force-overwrite
      fi
      systemctl enable -q postgresql
      systemctl restart postgresql
      # Started in the background (postgresql.service only starts its clusters'): ready once it answers.
      for _ in $(seq 60); do pg_isready -q && break; sleep 2; done
      db_pass=$(openssl rand -hex 16)
      if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'zabbix'" | grep -q 1; then
        sudo -u postgres psql -qc "CREATE USER zabbix PASSWORD '$db_pass'"
        sudo -u postgres createdb -O zabbix zabbix
        # Where 7.0's package puts its schema (6.x: /usr/share/zabbix-sql-scripts).
        schema=$(ls /usr/share/zabbix/sql-scripts/postgresql/server.sql.gz /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz 2>/dev/null | head -1)
        zcat "$schema" | sudo -u zabbix psql -q zabbix >/dev/null
      else
        sudo -u postgres psql -qc "ALTER USER zabbix PASSWORD '$db_pass'"
      fi
      sed -i -E "s/^#? ?DBPassword=.*/DBPassword=$db_pass/" /etc/zabbix/zabbix_server.conf
      # The web interface, set up (its first-visit wizard writes this file).
      cat >/etc/zabbix/web/zabbix.conf.php <<EOF
      <?php
      // Written by the lab panel's zabbix extra.
      \$DB['TYPE'] = 'POSTGRESQL';
      \$DB['SERVER'] = 'localhost';
      \$DB['PORT'] = '0';
      \$DB['DATABASE'] = 'zabbix';
      \$DB['USER'] = 'zabbix';
      \$DB['PASSWORD'] = '$db_pass';
      \$DB['SCHEMA'] = '';
      \$DB['ENCRYPTION'] = false;
      \$DB['KEY_FILE'] = '';
      \$DB['CERT_FILE'] = '';
      \$DB['CA_FILE'] = '';
      \$DB['VERIFY_HOST'] = false;
      \$DB['CIPHER_LIST'] = '';
      \$DB['VAULT'] = '';
      \$DB['VAULT_URL'] = '';
      \$DB['VAULT_DB_PATH'] = '';
      \$DB['VAULT_TOKEN'] = '';
      \$DB['DOUBLE_IEEE754'] = true;
      \$ZBX_SERVER_NAME = '$hostname';
      \$IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      EOF
      chown www-data:www-data /etc/zabbix/web/zabbix.conf.php
      chmod 640 /etc/zabbix/web/zabbix.conf.php
      # The machine's user in Admin's place, with its password.
      hash=$(php -r 'echo password_hash($argv[1], PASSWORD_BCRYPT);' "$password")
      sudo -u postgres psql -q zabbix -v u="$username" -v h="$hash" <<'SQL'
      UPDATE users SET username = :'u', passwd = :'h' WHERE username = 'Admin' OR username = :'u';
      SQL
      # Newer releases' packages (Ubuntu 26.04's) hand PHP to PHP-FPM, through Apache's proxy, not mod_php.
      if grep -q 'proxy:unix' /etc/apache2/conf-enabled/zabbix.conf 2>/dev/null; then
        a2enmod -q proxy proxy_fcgi
        # The proxy doesn't hand PHP the Authorization header, which the API's tokens come in.
        printf '%s\n' "# Written by the lab panel: Zabbix API tokens (Authorization: Bearer) reach PHP-FPM." \
          'SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1' >/etc/apache2/conf-available/lab-zabbix-auth.conf
        a2enconf -q lab-zabbix-auth
        for unit in $(systemctl list-unit-files --no-legend 'php*-fpm.service' | awk '{print $1}'); do
          systemctl enable -q "$unit"
          systemctl restart "$unit"
        done
      fi
      systemctl enable -q zabbix-server zabbix-agent2 apache2
      systemctl restart zabbix-server zabbix-agent2 apache2
      lab_wait_http http://127.0.0.1/zabbix/
      # Agents that say they're the lab's (their HostMetadata) are added with the Linux template.
      python3 - "$username" "$password" <<'PY'
      import json, sys, urllib.request
      def api(method, params, auth=None):
          headers = {"Content-Type": "application/json-rpc"}
          if auth:
              headers["Authorization"] = "Bearer " + auth
          req = urllib.request.Request("http://127.0.0.1/zabbix/api_jsonrpc.php", headers=headers,
                                       data=json.dumps({"jsonrpc": "2.0", "method": method, "params": params, "id": 1}).encode())
          out = json.load(urllib.request.urlopen(req, timeout=60))
          if "error" in out:
              raise SystemExit(f"Zabbix API {method}: {out['error']}")
          return out["result"]
      token = api("user.login", {"username": sys.argv[1], "password": sys.argv[2]})
      if api("action.get", {"filter": {"name": "Lab panel agents"}}, token):
          sys.exit(0)
      template = api("template.get", {"filter": {"host": "Linux by Zabbix agent"}}, token)[0]["templateid"]
      group = api("hostgroup.get", {"filter": {"name": "Linux servers"}}, token)[0]["groupid"]
      api("action.create", {
          "name": "Lab panel agents", "eventsource": 2,
          "filter": {"evaltype": 0, "conditions": [{"conditiontype": 24, "operator": 2, "value": "lab-panel"}]},
          "operations": [
              {"operationtype": 2},
              {"operationtype": 4, "opgroup": [{"groupid": group}]},
              {"operationtype": 6, "optemplate": [{"templateid": template}]},
          ],
      }, token)
      PY

- id: zabbix-agent
  name: Zabbix agent
  category: Monitoring
  description: Zabbix agent 2, reporting to a Zabbix server you've deployed (a machine with the Zabbix server extra), which adds this machine with the Linux template.
  ports: [10050]
  setupMinutes: 5
  notes:
    - "It reports to the Zabbix server chosen: this machine shows there under Monitoring → Hosts as {hostname}."
  options:
    - id: zabbix
      label: Zabbix server
      type: machine
      extra: zabbix
      help: A running machine with the Zabbix server extra.
  debian:
    packages: [zabbix-agent2]
    script: |
      config=/etc/zabbix/zabbix_agent2.conf
      sed -i -E -e "s/^Server=.*/Server=$zabbix_ip/" -e "s/^ServerActive=.*/ServerActive=$zabbix_ip/" \
        -e "s/^Hostname=.*/Hostname=$hostname/" -e '/^HostMetadata=/d' "$config"
      echo "HostMetadata=lab-panel" >>"$config"
      systemctl enable -q zabbix-agent2
      systemctl restart zabbix-agent2
      lab_open 10050/tcp
      # Registered once the server has it as a host (its auto-registration runs every minute or so).
      for _ in $(seq 40); do
        found=$(python3 - "$zabbix_ip" "$zabbix_username" "$zabbix_password" "$hostname" <<'PY'
      import json, sys, urllib.request
      ip, user, password, name = sys.argv[1:]
      def api(method, params, auth=None):
          headers = {"Content-Type": "application/json-rpc"}
          if auth:
              headers["Authorization"] = "Bearer " + auth
          req = urllib.request.Request(f"http://{ip}/zabbix/api_jsonrpc.php", headers=headers,
                                       data=json.dumps({"jsonrpc": "2.0", "method": method, "params": params, "id": 1}).encode())
          return json.load(urllib.request.urlopen(req, timeout=30)).get("result")
      try:
          token = api("user.login", {"username": user, "password": password})
          print("yes" if api("host.get", {"filter": {"host": name}}, token) else "no")
      except Exception:
          print("no")
      PY
      )
        [ "$found" = yes ] && exit 0
        sleep 15
      done
      echo "$zabbix_name ($zabbix_ip) didn't add this machine: is the Zabbix server running, and port 10051 open?"
      exit 1

- id: iis
  name: IIS
  category: Web servers
  description: Microsoft's web server on port 80, with a page showing the machine's name.
  ports: [80]
  links: ["http://{ip}/"]
  windows:
    script: |
      if (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue) {
        Install-WindowsFeature -Name Web-Server -IncludeManagementTools | Out-Null
      } else {
        # Windows 10/11: an optional feature rather than a server role.
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebServerRole, IIS-WebServer -All -NoRestart | Out-Null
      }
      Set-Content -Path C:\inetpub\wwwroot\index.html -Encoding ascii -Value "<h1>$hostname</h1><p>IIS, deployed by the lab panel.</p>"

- id: mssql
  name: SQL Server
  category: Databases
  description: Microsoft SQL Server 2025 Developer edition, from files in the template, reachable from the network with the machine's user as an administrator. Optionally filled with dummy data.
  ports: [1433]
  password: true
  minMemoryGB: 2
  notes:
    - "Connect to {ip} (port 1433) with SQL Server authentication, as {username} with the machine's password, e.g. from SQL Server Management Studio or sqlcmd -S {ip} -U {username}. Trust the server certificate: it's self-signed."
    - text: "Dummy data is in the database Chinook: 11 tables (Artist, Album, Track, Customer, Invoice…), e.g. SELECT count(*) FROM Track; gives 3503."
      when: {sample_data: ["yes"]}
  options:
    - *sample_data
  windows:
    script: |
      # The install media prepare.ps1 -SqlServer copied into the template, and Chinook's script.
      $src = 'C:\LabDeploy\sqlserver'
      if (-not (Test-Path "$src\setup.exe")) {
        throw "This template has no SQL Server files in $src. Rebuild it with prepare.ps1 -SqlServer."
      }
      $logs = 'C:\ProgramData\lab-deploy\logs'
      if (-not (Get-Service -Name MSSQLSERVER -ErrorAction SilentlyContinue)) {
        # Takes about 10 minutes. Windows sign-in for Administrators (and SYSTEM, which runs this);
        # SQL Server sign-in too, for the machine's user below. "sa" gets a random password, then is
        # switched off: the machine's password only ever goes in through SQL, not a command line.
        $sa = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ }) + 'aA1!'
        $arguments = '/Q /ACTION=Install /FEATURES=SQLEngine /INSTANCENAME=MSSQLSERVER /IACCEPTSQLSERVERLICENSETERMS ' +
          '/UPDATEENABLED=False /TCPENABLED=1 /SECURITYMODE=SQL /SAPWD="' + $sa + '" ' +
          '/SQLSVCACCOUNT="NT Service\MSSQLSERVER" /SQLSYSADMINACCOUNTS="BUILTIN\Administrators" "NT AUTHORITY\SYSTEM"'
        $setup = Start-Process -FilePath "$src\setup.exe" -ArgumentList $arguments -Wait -PassThru
        # 3010: installed, a restart needed to finish; it's done after the steps below.
        if ($setup.ExitCode -ne 0 -and $setup.ExitCode -ne 3010) {
          throw "SQL Server setup failed (exit code $($setup.ExitCode)); its logs are under C:\Program Files\Microsoft SQL Server\*\Setup Bootstrap\Log."
        }
        $restart = $setup.ExitCode -eq 3010
      } else {
        $restart = $false
      }
      Start-Service -Name MSSQLSERVER
      if (-not (Get-NetFirewallRule -Name 'LabSqlServer' -ErrorAction SilentlyContinue)) {
        New-NetFirewallRule -Name 'LabSqlServer' -DisplayName 'SQL Server (lab panel)' -Direction Inbound -Protocol TCP -LocalPort 1433 -Action Allow | Out-Null
      }

      # T-SQL as this script's account (SYSTEM, a sysadmin), in batches split at "GO" lines.
      function Invoke-Sql([string]$Text) {
        $connection = New-Object System.Data.SqlClient.SqlConnection 'Server=localhost;Integrated Security=True;Database=master'
        $connection.Open()
        try {
          foreach ($batch in [regex]::Split($Text, '(?im)^\s*GO\s*$')) {
            if (-not $batch.Trim()) { continue }
            $command = $connection.CreateCommand()
            $command.CommandText = $batch
            $command.CommandTimeout = 600
            $command.ExecuteNonQuery() | Out-Null
          }
        } finally {
          $connection.Close()
        }
      }
      $name = $username.Replace(']', ']]')
      $secret = $password.Replace("'", "''")
      Invoke-Sql @"
      IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'$($username.Replace("'", "''"))')
        CREATE LOGIN [$name] WITH PASSWORD = N'$secret', CHECK_POLICY = OFF;
      ELSE
        ALTER LOGIN [$name] WITH PASSWORD = N'$secret', CHECK_POLICY = OFF;
      ALTER SERVER ROLE sysadmin ADD MEMBER [$name];
      ALTER LOGIN sa DISABLE;
      "@
      if ($sample_data -eq 'yes') {
        Invoke-Sql ([IO.File]::ReadAllText('C:\LabDeploy\chinook\Chinook_SqlServer.sql'))
      }
      if ($restart) { exit 3010 }

- id: outlook
  name: Outlook
  category: Mail
  description: Microsoft Outlook (Office LTSC 2024), unactivated, from files in the template. Not on Server Core.
  minMemoryGB: 4
  notes:
    - "Office isn't activated: Outlook shows a licence notice, and after its grace period some features stop working. Fine for a short-lived machine."
    - "Add an account in Outlook yourself, e.g. a mail server deployed from the panel (IMAP on 143 or 993, SMTP on 587)."
  windows:
    script: |
      # The Office files prepare.ps1 -Office copied into the template, with the download's settings
      # (product, language, the apps left out), scripts/template/office/download.xml.
      $src = 'C:\LabDeploy\office'
      if (-not (Test-Path "$src\setup.exe")) {
        throw "This template has no Office files in $src. Rebuild it with prepare.ps1 -Office."
      }
      [xml]$config = Get-Content -Path "$src\download.xml"
      $add = $config.Configuration.SelectSingleNode('Add')
      $add.SetAttribute('SourcePath', $src)
      $add.SetAttribute('AllowCdnFallback', 'FALSE')
      foreach ($node in @($config.Configuration.SelectNodes('Display|Logging'))) {
        $config.Configuration.RemoveChild($node) | Out-Null
      }
      $logs = 'C:\ProgramData\lab-deploy\logs\office'
      $display = $config.CreateElement('Display')
      $display.SetAttribute('Level', 'None')
      $display.SetAttribute('AcceptEULA', 'TRUE')
      $logging = $config.CreateElement('Logging')
      $logging.SetAttribute('Level', 'Standard')
      $logging.SetAttribute('Path', $logs)
      $config.Configuration.AppendChild($display) | Out-Null
      $config.Configuration.AppendChild($logging) | Out-Null
      $install = 'C:\ProgramData\lab-deploy\outlook.xml'
      $config.Save($install)

      # Waits until Office is installed: about 5 to 10 minutes.
      $setup = Start-Process -FilePath "$src\setup.exe" -ArgumentList '/configure', "`"$install`"" -Wait -PassThru
      if ($setup.ExitCode -ne 0) { throw "Office setup failed (exit code $($setup.ExitCode)); its logs are in $logs." }
      $exe = Join-Path $env:ProgramFiles 'Microsoft Office\root\Office16\OUTLOOK.EXE'
      if (-not (Test-Path $exe)) { throw "Office setup finished, but there's no $exe." }
      $link = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:PUBLIC\Desktop\Outlook.lnk")
      $link.TargetPath = $exe
      $link.Save()

# Active Directory: a Windows Server machine becomes a domain's first domain controller; other
# Windows machines join that domain, choosing the controller from the running machines (a machine
# option: the panel passes its address, domain and sign-in to the script, as dc_*).
- id: domain-controller
  name: Domain controller
  category: Active Directory
  description: Makes this server the first domain controller of a new Active Directory forest, with its DNS. Its user becomes a domain administrator.
  ports: [53, 88, 389, 636, 3268]
  password: true
  setupMinutes: 20
  notes:
    - "Domain {domain} (short name {netbios}): sign in as {netbios}\\{username} with the machine's password, over Remote Desktop or SSH."
    - "Other Windows machines join it with the Join a domain extra, choosing this machine. They use it for DNS, so keep it running while they're in use."
    - "Its address came from DHCP. If it changes (say, after a long time off), redeploy the machines in its domain."
  options:
    - id: domain
      label: Domain name
      type: hostname
      default: lab.internal
      help: The domain's DNS name, two labels or more, e.g. corp.lab.internal.
    - id: netbios
      label: Short name
      type: text
      pattern: "[A-Za-z][A-Za-z0-9-]{0,14}"
      default: LAB
      help: The domain's NetBIOS name, as in LAB\user. Up to 15 letters, digits or hyphens.
  windows:
    script: |
      if (-not (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue)) {
        throw "A domain controller needs Windows Server."
      }
      if ($domain -notlike '*.*' -or $domain.StartsWith('*')) {
        throw "The domain name needs two labels or more, e.g. lab.internal."
      }
      # Already promoted: the first-boot script does the rest (the user into Domain Admins).
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4) { exit 0 }
      Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools | Out-Null
      # The built-in Administrator becomes the domain's, and promotion wants it to have a strong
      # password: a random one. It stays switched off, as the first-boot script left it.
      $random = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ }) + 'aA1!'
      Get-LocalUser | Where-Object { $_.SID.Value -like 'S-1-5-21-*-500' } |
        Set-LocalUser -Password (ConvertTo-SecureString $random -AsPlainText -Force)
      Import-Module ADDSDeployment
      # Directory Services Restore Mode's password: the machine's.
      $safe = ConvertTo-SecureString $password -AsPlainText -Force
      $result = Install-ADDSForest -DomainName $domain -DomainNetbiosName $netbios.ToUpper() -SafeModeAdministratorPassword $safe `
        -InstallDns -NoRebootOnCompletion -Force -WarningAction SilentlyContinue
      if ($result.Status -ne 'Success') { throw "Promotion failed: $($result.Message)" }
      exit 3010

- id: join-domain
  name: Join a domain
  category: Active Directory
  description: Joins this machine to the domain of a domain controller you've deployed, which it then uses for DNS. Domain users can sign in to it.
  setupMinutes: 5
  notes:
    - "Sign in with a domain account, e.g. the domain controller's user as DOMAIN\\user (its page has the details). This machine's own user still works, as .\\{username}."
  options:
    - id: dc
      label: Domain controller
      type: machine
      extra: domain-controller
      help: A running machine with the Domain controller extra.
  windows:
    script: |
      $computer = Get-CimInstance Win32_ComputerSystem
      if ($computer.PartOfDomain -and $computer.Domain -eq $dc_domain) { exit 0 }
      # The domain controller answers DNS for the domain, and forwards other names to the LAN's DNS.
      $adapter = Get-NetAdapter | Where-Object Status -eq 'Up' | Select-Object -First 1
      Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dc_ip
      Clear-DnsClientCache
      $deadline = (Get-Date).AddMinutes(5)
      while (-not (Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.$dc_domain" -Type SRV -ErrorAction SilentlyContinue)) {
        if ((Get-Date) -gt $deadline) { throw "Can't find the domain $dc_domain through $dc_name ($dc_ip)." }
        Start-Sleep -Seconds 10
      }
      $credential = New-Object PSCredential("$($dc_netbios.ToUpper())\$dc_username", (ConvertTo-SecureString $dc_password -AsPlainText -Force))
      Add-Computer -DomainName $dc_domain -Credential $credential -Force -WarningAction SilentlyContinue
      exit 3010

# A second (writable) domain controller of a domain deployed with the Domain controller extra: it gets
# a full copy of the directory, DNS and the global catalogue, and replicates both ways with the first.
# A domain controller has no local accounts, so it signs in as the first's user (account: dc): the
# panel gives it that user and password, rather than a password of its own that nothing would use.
- id: additional-dc
  name: Additional domain controller
  category: Active Directory
  description: Makes this server a second domain controller of a domain you've deployed, with its own DNS and a copy of the directory that replicates both ways with the first. It signs in as the first one's user.
  ports: [53, 88, 389, 636, 3268]
  setupMinutes: 50
  account: dc
  notes:
    - "Sign in as the domain controller's user (DOMAIN\\{username}), with the same password: this machine has no account of its own."
    - "Check replication with repadmin /replsummary or repadmin /showrepl. Members can use either controller."
  options:
    - id: dc
      label: Domain controller
      type: machine
      extra: domain-controller
      help: A running machine with the Domain controller extra, whose domain this one joins as a second controller.
  windows:
    script: |
      if (-not (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue)) {
        throw "A domain controller needs Windows Server."
      }
      $adapter = Get-NetAdapter | Where-Object Status -eq 'Up' | Select-Object -First 1
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -lt 4) {
        # Find the domain through the first controller (as Join a domain does), then promote.
        Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dc_ip
        Clear-DnsClientCache
        $deadline = (Get-Date).AddMinutes(5)
        while (-not (Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.$dc_domain" -Type SRV -ErrorAction SilentlyContinue)) {
          if ((Get-Date) -gt $deadline) { throw "Can't find the domain $dc_domain through $dc_name ($dc_ip)." }
          Start-Sleep -Seconds 10
        }
        Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools | Out-Null
        Import-Module ADDSDeployment
        $credential = New-Object PSCredential("$($dc_netbios.ToUpper())\$dc_username", (ConvertTo-SecureString $dc_password -AsPlainText -Force))
        # Directory Services Restore Mode's password: the domain user's, which is this machine's too.
        $safe = ConvertTo-SecureString $dc_password -AsPlainText -Force
        $promote = @{
          DomainName = $dc_domain; Credential = $credential; SafeModeAdministratorPassword = $safe
          InstallDns = $true; NoGlobalCatalog = $false; Force = $true; WarningAction = 'SilentlyContinue'
        }
        # A controller promoted moments ago answers DNS before it serves as one (SYSVOL, the locator), and
        # promotion then fails "could not be contacted": Windows' own checks, until they pass.
        $deadline = (Get-Date).AddMinutes(15)
        while ($true) {
          $failed = @(Test-ADDSDomainControllerInstallation @promote | Where-Object Status -eq 'Error')
          if ($failed.Count -eq 0) { break }
          if ((Get-Date) -gt $deadline) { throw "$dc_name isn't ready to take a second controller: $($failed[0].Message)" }
          Start-Sleep -Seconds 30
        }
        $result = Install-ADDSDomainController @promote -NoRebootOnCompletion
        if ($result.Status -ne 'Success') { throw "Promotion failed: $($result.Message)" }
        # 3011: restart, then run again to check replication.
        exit 3011
      }
      # After the restart: the first controller for DNS, then itself.
      Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dc_ip, '127.0.0.1'
      Import-Module ActiveDirectory
      $deadline = (Get-Date).AddMinutes(15)
      while (-not (Get-ADDomainController -Server localhost -ErrorAction SilentlyContinue)) {
        if ((Get-Date) -gt $deadline) { throw "Active Directory didn't come up." }
        Start-Sleep -Seconds 10
      }
      # This controller's DNS records (its _msdcs alias above all), registered with the first controller's
      # DNS directly: otherwise they reach it only by replication from here, which needs them first, and
      # the first controller can't add its links from here until its next KCC run (up to 15 minutes).
      ipconfig /registerdns | Out-Null
      nltest /dsregdns | Out-Null
      # Then links both ways: here from the first controller, and on the first controller from here (its
      # KCC asked to run again), replicated now rather than on the schedule, every one without failures.
      $deadline = (Get-Date).AddMinutes(20)
      while ($true) {
        repadmin /kcc $dc_name | Out-Null
        repadmin /kcc $env:COMPUTERNAME | Out-Null
        repadmin /syncall $env:COMPUTERNAME /Ade | Out-Null
        repadmin /syncall $env:COMPUTERNAME /AdeP | Out-Null
        $inbound = @(repadmin /showrepl $env:COMPUTERNAME /csv | ConvertFrom-Csv)
        $outbound = @(repadmin /showrepl $dc_name /csv | ConvertFrom-Csv | Where-Object { $_.'Source DSA' -eq $env:COMPUTERNAME })
        $failing = @($inbound + $outbound | Where-Object { [int]$_.'Number of Failures' -gt 0 })
        if ($inbound.Count -gt 0 -and $outbound.Count -gt 0 -and $failing.Count -eq 0) { break }
        if ((Get-Date) -gt $deadline) {
          $why = if ($inbound.Count -eq 0) { "nothing replicates here from $dc_name" }
            elseif ($outbound.Count -eq 0) { "$dc_name doesn't replicate from here" }
            else { ($failing | ForEach-Object { "$($_.'Naming Context') from $($_.'Source DSA'): $($_.'Last Failure Status')" }) -join '; ' }
          throw "Replication isn't working: $why"
        }
        Start-Sleep -Seconds 20
      }
      Write-Output "Replicating both ways with $dc_name ($($inbound.Count) partitions in, $($outbound.Count) out)"
      exit 0

# Exchange Server SE on its own template (templates.yaml: exchange), with its files and prerequisites
# baked in (prepare.ps1 -Exchange). It joins a domain controller's domain, then runs Exchange's setup as
# that controller's user (a domain, schema and enterprise administrator), which also prepares the
# forest. Unlicensed, it's a 180-day trial.
- id: freeipa
  name: FreeIPA
  category: Identity
  description: A FreeIPA identity management server for a new domain (LDAP, Kerberos, DNS, certificates and a web interface), with admin and the machine's user as administrators. Optionally with example users, groups, sudo and access rules. Linux machines can join its domain.
  ports: [80, 443, 389, 636, 88, 464, 53]
  minMemoryGB: 4
  minCPU: 2
  diskGB: 2
  setupMinutes: 20
  password: true
  links: ["https://{hostname}.{domain}/ipa/ui/"]
  notes:
    - "Sign in as admin or {username}, with the machine's password. The web interface answers only on its name: use {ip} as your DNS server (it serves {domain}), or add \"{ip} {hostname}.{domain}\" to your hosts file. On the machine: kinit admin, then ipa user-find."
    - text: "Example data: the users alice, bob, carol, dave and eve (password Welcome-2026, to change at first sign-in), the groups developers and ops, a sudo rule giving ops everything, an access rule letting developers in over SSH, and the host web01.{domain}."
      when: {sample_data: ["yes"]}
  options:
    - id: domain
      label: Domain
      type: hostname
      default: ipa.lab.example
      help: The new domain, e.g. ipa.lab.example; its Kerberos realm is the same in capitals. The machine is named <its name>.<domain>.
    - id: sample_data
      label: Add example data
      help: Five users, two groups, a sudo rule, an access (HBAC) rule and a host.
      type: boolean
      default: "no"
  rhel:
    packages: [ipa-server, ipa-server-dns]
    script: |
      ip=$(lab_ip)
      fqdn="$hostname.$domain"
      realm=$(printf %s "$domain" | tr '[:lower:]' '[:upper:]')
      # FreeIPA needs its full name, resolving to its address, and kept across restarts.
      echo "preserve_hostname: true" >/etc/cloud/cloud.cfg.d/99-lab-freeipa.cfg
      hostnamectl set-hostname "$fqdn"
      sed -i "/[[:space:]]$hostname\$/d; /[[:space:]]$hostname[[:space:]]/d" /etc/hosts
      echo "$ip $fqdn $hostname" >>/etc/hosts
      ipa-server-install --unattended --realm "$realm" --domain "$domain" --hostname "$fqdn" --ip-address "$ip" \
        --ds-password "$password" --admin-password "$password" --setup-dns --auto-forwarders --auto-reverse --no-ntp \
        >/var/log/lab-deploy/freeipa-install.log 2>&1 || { tail -5 /var/log/lab-deploy/freeipa-install.log >&2; exit 1; }
      lab_open 80/tcp 443/tcp 389/tcp 636/tcp 88/tcp 88/udp 464/tcp 464/udp 53/tcp 53/udp
      printf '%s\n' "$password" | kinit admin >/dev/null
      # The machine's user as an administrator too, with the same password, not to be changed.
      printf '%s\n' "$password" | ipa user-add "$username" --first Lab --last User --password >/dev/null
      ipa user-mod "$username" --setattr krbPasswordExpiration=20380101000000Z >/dev/null
      ipa group-add-member admins --users="$username" >/dev/null
      if [ "$sample_data" = yes ]; then
        for person in alice:Alice:Smith bob:Bob:Jones carol:Carol:Taylor dave:Dave:Brown eve:Eve:Wilson; do
          IFS=: read -r uid first last <<<"$person"
          printf 'Welcome-2026\n' | ipa user-add "$uid" --first "$first" --last "$last" --email "$uid@$domain" --password >/dev/null
        done
        ipa group-add developers --desc "Software developers" >/dev/null
        ipa group-add ops --desc "Operations" >/dev/null
        ipa group-add-member developers --users=alice --users=bob >/dev/null
        ipa group-add-member ops --users=carol --users=dave >/dev/null
        ipa sudorule-add ops-all --hostcat=all --cmdcat=all --runasusercat=all --desc "Operations can run anything as anyone" >/dev/null
        ipa sudorule-add-user ops-all --groups=ops >/dev/null
        ipa hbacrule-add developers-ssh --hostcat=all --desc "Developers sign in over SSH" >/dev/null
        ipa hbacrule-add-user developers-ssh --groups=developers >/dev/null
        ipa hbacrule-add-service developers-ssh --hbacsvcs=sshd >/dev/null
        ipa host-add "web01.$domain" --force --desc "An example web server" >/dev/null
      fi
      kdestroy -A

- id: exchange
  name: Exchange Server
  category: Mail
  description: Exchange Server SE (Mailbox role) in a domain controller's domain, with a mailbox for the controller's user. Takes over an hour to set up.
  # No ports listed: it's alone on its template, so there's nothing to clash with.
  setupMinutes: 150
  minMemoryGB: 8
  # Exchange's install writes tens of GB as the clone grows; counted so a deploy that would fill the
  # datastore is refused up front (without this it under-counted and a Brookfield deploy filled it).
  diskGB: 45
  notes:
    - "Outlook on the web: https://{ip}/owa, and the admin centre: https://{ip}/ecp. Sign in as the domain controller's user (DOMAIN\\user, with its password; its machine page has them). The certificate is self-signed."
    - "Unlicensed, Exchange runs as a 180-day trial. It uses the domain controller for DNS, so keep that running."
  options:
    - id: dc
      label: Domain controller
      type: machine
      extra: domain-controller
      help: A running machine with the Domain controller extra. Exchange joins its domain.
    - id: organization
      label: Organisation name
      type: text
      pattern: "[A-Za-z0-9][A-Za-z0-9 -]{0,63}"
      default: Lab
      help: The Exchange organisation's name, shown in its admin centre.
  windows:
    script: |
      $src = 'C:\LabDeploy\exchange'
      if (-not (Test-Path "$src\Setup.exe")) {
        throw "This template has no Exchange files in $src. Rebuild it with prepare.ps1 -Exchange."
      }
      $admin = "$($dc_netbios.ToUpper())\$dc_username"
      # First: join the domain (as the Join a domain extra), then restart.
      $computer = Get-CimInstance Win32_ComputerSystem
      if (-not ($computer.PartOfDomain -and $computer.Domain -eq $dc_domain)) {
        $adapter = Get-NetAdapter | Where-Object Status -eq 'Up' | Select-Object -First 1
        Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dc_ip
        Clear-DnsClientCache
        $deadline = (Get-Date).AddMinutes(5)
        while (-not (Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.$dc_domain" -Type SRV -ErrorAction SilentlyContinue)) {
          if ((Get-Date) -gt $deadline) { throw "Can't find the domain $dc_domain through $dc_name ($dc_ip)." }
          Start-Sleep -Seconds 10
        }
        $credential = New-Object PSCredential($admin, (ConvertTo-SecureString $dc_password -AsPlainText -Force))
        Add-Computer -DomainName $dc_domain -Credential $credential -Force -WarningAction SilentlyContinue
        # Restart, then run this again (3011, not 3010: it isn't done).
        exit 3011
      }

      # Then Exchange's setup, as the domain administrator: it prepares the schema and the domain, which
      # the machine's own account can't. A scheduled task runs it as that user, and this waits for it.
      function Invoke-AsAdmin([string]$Name, [string]$Command, [int]$Hours) {
        # The whole command in one more pair of quotes: cmd.exe strips the first and last quote of
        # what follows /c when it starts with one.
        $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$Command`""
        Register-ScheduledTask -TaskName $Name -Action $action -User $admin -Password $dc_password -RunLevel Highest -Force | Out-Null
        Start-ScheduledTask -TaskName $Name
        Start-Sleep -Seconds 10
        $deadline = (Get-Date).AddHours($Hours)
        while ((Get-ScheduledTask -TaskName $Name).State -eq 'Running') {
          if ((Get-Date) -gt $deadline) { throw "$Name didn't finish within $Hours hours." }
          Start-Sleep -Seconds 30
        }
        $result = (Get-ScheduledTaskInfo -TaskName $Name).LastTaskResult
        Unregister-ScheduledTask -TaskName $Name -Confirm:$false
        return $result
      }
      $logs = 'C:\ProgramData\lab-deploy\logs'
      # Windows features Exchange's setup checks for that templates built before 2026-10-21 lack
      # (prepare.ps1 installs them now). From files already on the machine; no restart.
      $missing = Get-WindowsFeature -Name NET-WCF-HTTP-Activation45, NET-WCF-Pipe-Activation45 | Where-Object { -not $_.Installed }
      if ($missing) { Install-WindowsFeature -Name $missing.Name | Out-Null }
      if (-not (Get-Service -Name MSExchangeIS -ErrorAction SilentlyContinue)) {
        $setup = "`"$src\Setup.exe`" /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF /Mode:Install /Roles:Mailbox " +
          "/OrganizationName:`"$organization`" > `"$logs\exchange-setup.log`" 2>&1"
        $code = Invoke-AsAdmin 'LabExchangeSetup' $setup 4
        if ($code -ne 0) {
          throw "Exchange's setup failed (exit code $code): see $logs\exchange-setup.log and C:\ExchangeSetupLogs\ExchangeSetup.log."
        }
      }
      # A mailbox for the domain controller's user, so Outlook on the web works straight away.
      $mailbox = "powershell.exe -NoProfile -Command `"Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn; " +
        "if (-not (Get-Mailbox -Identity '$dc_username' -ErrorAction SilentlyContinue)) { Enable-Mailbox -Identity '$dc_username' }`" " +
        "> `"$logs\exchange-mailbox.log`" 2>&1"
      $code = Invoke-AsAdmin 'LabExchangeMailbox' $mailbox 1
      if ($code -ne 0) { throw "Making $dc_username's mailbox failed: see $logs\exchange-mailbox.log." }
      # Exchange asks for a restart after setup.
      exit 3010

# Brookfield Pro Lab seeding (labs.yaml: brookfield). Two extras, applied on top of the Active
# Directory and Exchange extras, that turn a plain domain into the lab: users and groups, a bounded
# set of the usual Active Directory weaknesses (adapted from the vuln-ad project), a file share, sample
# mail, and the places the panel plants the instance's flags (actions.plant_flags). They run no
# packages — just built-in AD and Exchange cmdlets — so any Windows template can offer them without a
# rebuild. Not meant to be picked by hand: they belong to the lab.
- id: brookfield-dc
  name: Brookfield lab (domain)
  category: Pro Labs
  description: Seeds the Brookfield Pro Lab's domain controller — users, groups, deliberate weaknesses, a file share and the flag targets. For the Brookfield lab, not for a machine on its own.
  setupMinutes: 10
  windows:
    script: |
      # Runs on the domain controller after it's promoted (the machine's user is a domain admin).
      Import-Module ActiveDirectory
      $deadline = (Get-Date).AddMinutes(15)
      while ($true) {
        try { $domain = Get-ADDomain; break } catch { if ((Get-Date) -gt $deadline) { throw "Active Directory didn't come up." }; Start-Sleep -Seconds 10 }
      }
      $dn = $domain.DistinguishedName
      function Try-Step([string]$What, [scriptblock]$Do) {
        try { & $Do } catch { Write-Output "skipped $What : $($_.Exception.Message)" }
      }
      function New-Pwd { -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 16 | ForEach-Object { [char]$_ }) + 'aA1!' }

      # People. Named so the lab feels real; each enabled with a strong random password.
      $people = @('olivia.bennett','liam.carter','sophia.walsh','noah.fisher','emma.doyle','james.holt','ava.reid','lucas.frost','mia.chapman','ethan.park')
      foreach ($sam in $people) {
        Try-Step "user $sam" {
          if (-not (Get-ADUser -Filter "SamAccountName -eq '$sam'")) {
            $given, $sur = $sam.Split('.')
            New-ADUser -Name "$given $sur" -GivenName $given -Surname $sur -SamAccountName $sam `
              -UserPrincipalName "$sam@$($domain.DNSRoot)" -AccountPassword (ConvertTo-SecureString (New-Pwd) -AsPlainText -Force) `
              -Enabled $true -ErrorAction Stop
          }
        }
      }
      # Groups, with some members.
      foreach ($g in 'IT Admins','Finance','HR','Helpdesk') {
        Try-Step "group $g" { if (-not (Get-ADGroup -Filter "Name -eq '$g'")) { New-ADGroup -Name $g -GroupScope Global } }
      }
      Try-Step 'group members' {
        Add-ADGroupMember -Identity 'IT Admins' -Members 'liam.carter','james.holt' -ErrorAction SilentlyContinue
        Add-ADGroupMember -Identity 'Finance' -Members 'olivia.bennett','ava.reid','mia.chapman' -ErrorAction SilentlyContinue
        Add-ADGroupMember -Identity 'Helpdesk' -Members 'noah.fisher','lucas.frost' -ErrorAction SilentlyContinue
      }

      # --- Deliberate weaknesses (a bounded, representative set; see the vuln-ad project) ---
      # Kerberoasting: an ordinary account with a service principal name and a weak password.
      Try-Step 'kerberoastable service account' {
        if (-not (Get-ADUser -Filter "SamAccountName -eq 'svc_sql'")) {
          New-ADUser -Name 'svc_sql' -SamAccountName 'svc_sql' -UserPrincipalName "svc_sql@$($domain.DNSRoot)" `
            -AccountPassword (ConvertTo-SecureString 'Summer2024' -AsPlainText -Force) -Enabled $true -PasswordNeverExpires $true
        }
        Set-ADUser -Identity 'svc_sql' -ServicePrincipalNames @{Replace="MSSQLSvc/sql.$($domain.DNSRoot):1433"}
      }
      # AS-REP roasting: a user that doesn't require Kerberos pre-authentication.
      Try-Step 'as-rep roastable user' { Set-ADAccountControl -Identity 'ethan.park' -DoesNotRequirePreAuth $true }
      # A password left in a user's description.
      Try-Step 'password in description' {
        Set-ADAccountPassword -Identity 'sophia.walsh' -Reset -NewPassword (ConvertTo-SecureString 'Autumn2023!' -AsPlainText -Force)
        Set-ADUser -Identity 'sophia.walsh' -Description 'Temp account, password Autumn2023!'
      }
      # A password shared across several accounts (password spraying).
      Try-Step 'shared weak password' {
        foreach ($u in 'emma.doyle','noah.fisher','mia.chapman') {
          Set-ADAccountPassword -Identity $u -Reset -NewPassword (ConvertTo-SecureString 'Welcome1' -AsPlainText -Force)
        }
      }
      # A default password a new starter must change.
      Try-Step 'default password' {
        Set-ADAccountPassword -Identity 'lucas.frost' -Reset -NewPassword (ConvertTo-SecureString 'Changeme123!' -AsPlainText -Force)
        Set-ADUser -Identity 'lucas.frost' -ChangePasswordAtLogon $true -Description 'New starter, default password'
      }
      # A weak ACL: Domain Users can fully control the Helpdesk group.
      Try-Step 'weak acl on Helpdesk' {
        $helpdesk = [ADSI]("LDAP://" + (Get-ADGroup 'Helpdesk').DistinguishedName)
        $everyone = (Get-ADGroup 'Domain Users').SID
        $ace = New-Object DirectoryServices.ActiveDirectoryAccessRule($everyone, 'GenericAll', 'Allow', 'All')
        $helpdesk.psbase.ObjectSecurity.AddAccessRule($ace); $helpdesk.psbase.CommitChanges()
      }
      Try-Step 'smb signing off' { Set-SmbServerConfiguration -RequireSecuritySignature $false -EnableSecuritySignature $false -Force -Confirm:$false }
      Try-Step 'admin password never expires' { Set-ADUser -Identity 'Administrator' -PasswordNeverExpires $true }

      # The Finance file share (the 'share' flag goes in it); a decoy document for colour.
      Try-Step 'finance share' {
        New-Item -ItemType Directory -Force -Path 'C:\Shares\Finance' | Out-Null
        Set-Content -Path 'C:\Shares\Finance\Q3-budget-DRAFT.txt' -Value "Draft figures. Do not circulate.`r`nShared drive password: Welcome1" -ErrorAction SilentlyContinue
        if (-not (Get-SmbShare -Name 'Finance' -ErrorAction SilentlyContinue)) {
          New-SmbShare -Name 'Finance' -Path 'C:\Shares\Finance' -ChangeAccess 'Everyone' | Out-Null
        }
      }
      # Where the panel plants the flags: the Finance share, and the Administrator's desktop (root.txt).
      New-Item -ItemType Directory -Force -Path 'C:\Shares\Finance' | Out-Null
      New-Item -ItemType Directory -Force -Path 'C:\Users\Administrator\Desktop' | Out-Null
      exit 0

- id: brookfield-member
  name: Brookfield lab (member)
  category: Pro Labs
  description: Seeds a Brookfield Pro Lab member — the staff workstation (weakened, with the user flag target) or the mail server (sample mail and the mail flag script). For the Brookfield lab, not for a machine on its own.
  setupMinutes: 10
  options:
    - id: role
      label: Role in the lab
      type: choice
      default: ws
      choices:
        - {value: ws, label: Staff workstation}
        - {value: mail, label: Mail server}
      help: Which Brookfield machine this is.
    - id: dc
      label: Domain controller
      type: machine
      extra: domain-controller
      help: The lab's domain controller (the panel wires this to the instance's own).
  windows:
    script: |
      function Try-Step([string]$What, [scriptblock]$Do) {
        try { & $Do } catch { Write-Output "skipped $What : $($_.Exception.Message)" }
      }
      if ($role -eq 'ws') {
        # The staff workstation. The 'user' flag goes on the public desktop (every user sees it).
        New-Item -ItemType Directory -Force -Path 'C:\Users\Public\Desktop' | Out-Null
        # A bounded set of workstation weaknesses (see the vuln-ad project).
        Try-Step 'wdigest plaintext creds' {
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -Name 'UseLogonCredential' -Value 1 -PropertyType DWord -Force | Out-Null
        }
        Try-Step 'smb signing off' { Set-SmbClientConfiguration -RequireSecuritySignature $false -EnableSecuritySignature $false -Force -Confirm:$false }
        # A domain user who is a local administrator here.
        Try-Step 'domain user in local admins' { Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-544') -Member "$($dc_netbios.ToUpper())\olivia.bennett" -ErrorAction SilentlyContinue }
        exit 0
      }

      # The mail server. Exchange is installed (the Exchange extra ran first) and the domain
      # controller's user already has a mailbox. Populate it and leave the flag script.
      $logs = 'C:\ProgramData\lab-deploy\logs'
      New-Item -ItemType Directory -Force -Path $logs | Out-Null
      $admin = "$($dc_netbios.ToUpper())\$dc_username"
      $me = "$dc_username@$dc_domain"
      # Mailbox-enable a couple of staff (best-effort), as the domain admin.
      Try-Step 'mailboxes for staff' {
        $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument ("/c `"powershell.exe -NoProfile -Command `"`"Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn; foreach (`$u in 'olivia.bennett','liam.carter') { if (-not (Get-Mailbox -Identity `$u -ErrorAction SilentlyContinue)) { Enable-Mailbox -Identity `$u } }`"`" > `"$logs\brookfield-mailboxes.log`" 2>&1`"")
        Register-ScheduledTask -TaskName 'BrookfieldMailboxes' -Action $action -User $admin -Password $dc_password -RunLevel Highest -Force | Out-Null
        Start-ScheduledTask -TaskName 'BrookfieldMailboxes'
        $wait = (Get-Date).AddMinutes(10)
        while ((Get-ScheduledTask -TaskName 'BrookfieldMailboxes').State -eq 'Running') { if ((Get-Date) -gt $wait) { break }; Start-Sleep -Seconds 15 }
        Unregister-ScheduledTask -TaskName 'BrookfieldMailboxes' -Confirm:$false
      }
      # Sample mail, so Outlook on the web isn't empty. Internal SMTP submission to the server itself.
      $subjects = @('Q3 budget review','Password reset policy','Welcome to Brookfield','Re: shared drive access','VPN details')
      $bodies = @('Please review the attached figures before Friday.','Reminder: choose a strong password and do not reuse it.','Your account is ready. Temporary password: Welcome1','The Finance share is on the domain controller.','VPN uses the same credentials as your account.')
      Try-Step 'sample mail' {
        for ($i = 0; $i -lt 6; $i++) {
          Send-MailMessage -SmtpServer 'localhost' -From $me -To $me -Subject ($subjects | Get-Random) -Body ($bodies | Get-Random) -ErrorAction SilentlyContinue
        }
      }
      # The flag script the panel runs to drop the instance's 'mail' flag into the mailbox. Built as
      # lines (not a here-string, whose terminator can't be indented inside this YAML); $me is filled
      # in now, `$Flag stays for the script's own parameter.
      New-Item -ItemType Directory -Force -Path 'C:\lab' | Out-Null
      $planter = @(
        'param([string]$Flag)',
        "Send-MailMessage -SmtpServer 'localhost' -From '$me' -To '$me' -Subject 'Internal: credentials rotation' -Body `"Recovery token for this quarter: `$Flag. Keep it safe.`""
      )
      Set-Content -Path 'C:\lab\plant-mail-flag.ps1' -Value ($planter -join [Environment]::NewLine) -Encoding UTF8
      exit 0
