- id: minio
  name: MinIO
  category: Storage
  description: MinIO, S3-compatible object storage, with its web console and its user as the administrator; and mc, its command-line client. The April 2025 release, the last with the full console.
  ports: [9000, 9001]
  password: true
  links: ["http://{ip}:9001/"]
  notes:
    - "Sign in to the console as {username}, with the machine's password."
    - "The S3 API is http://{ip}:9000: access key {username}, secret key the machine's password. On the machine, mc knows it as lab, e.g. mc ls lab."
  options:
    - id: bucket
      label: Bucket
      help: A bucket to make, e.g. backups. Leave it blank for none.
      type: text
      pattern: "[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]"
  debian:
    # Built from source into the template (prepare.sh's bake_minio; scripts/template/build-minio.sh).
    packages: []
    script: |
      [ -x /usr/local/bin/minio ] || { echo "This template has no MinIO: rebuild it with today's prepare.sh."; exit 1; }
      id minio-user >/dev/null 2>&1 || useradd -r -M -d /var/lib/minio -s /usr/sbin/nologin minio-user
      install -d -o minio-user -g minio-user -m 750 /var/lib/minio
      # Its administrator, for systemd: in double quotes, with \ and " escaped.
      quote() { local v=${1//\\/\\\\}; printf '"%s"' "${v//\"/\\\"}"; }
      install -m 600 /dev/null /etc/default/minio
      cat >/etc/default/minio <<EOF
      MINIO_VOLUMES=/var/lib/minio
      MINIO_OPTS="--address :9000 --console-address :9001"
      MINIO_ROOT_USER=$(quote "$username")
      MINIO_ROOT_PASSWORD=$(quote "$password")
      EOF
      cat >/etc/systemd/system/minio.service <<'EOF'
      # Written by the lab panel's minio extra.
      [Unit]
      Description=MinIO object storage
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=minio-user
      Group=minio-user
      EnvironmentFile=/etc/default/minio
      ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
      Restart=always
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
      EOF
      systemctl daemon-reload
      systemctl enable -q minio
      systemctl restart minio
      lab_wait_http http://127.0.0.1:9000/minio/health/live
      lab_open 9000/tcp 9001/tcp
      # mc, signed in as the administrator, for the user and root.
      sudo -u "$username" -H /usr/local/bin/mc alias set lab http://127.0.0.1:9000 "$username" "$password" >/dev/null
      /usr/local/bin/mc alias set lab http://127.0.0.1:9000 "$username" "$password" >/dev/null
      if [ -n "$bucket" ]; then /usr/local/bin/mc mb --ignore-existing "lab/$bucket" >/dev/null; fi

# Wazuh: the server (manager, indexer and dashboard on one machine), and its agent on other machines,
# which picks a Wazuh server machine and enrols with it. Both from files kept in the template
# (prepare.sh's bake_wazuh and bake_wazuh_agent), so they work offline.

- id: wazuh
  name: Wazuh server
  category: Security
  description: "Wazuh 4.14, the open-source SIEM and XDR: its manager, indexer and dashboard on this machine. Machines with the Wazuh agent extra report to it. Installed as the machine starts: about 15 minutes."
  ports: [443, 1514, 1515, 9200, 55000]
  password: true
  # Wazuh's own minimum for all in one: on 2 vCPU its installer's steps run past their waits (and it then
  # removes everything).
  minMemoryGB: 4
  minCPU: 4
  setupMinutes: 30
  links: ["https://{ip}/"]
  notes:
    - "Sign in to the dashboard as {username}, with the machine's password (an administrator). The certificate is self-signed."
    - "Agents report to {ip} on ports 1514 and 1515: deploy machines with the Wazuh agent extra and choose this one."
    - "Wazuh's own accounts (admin, the API's) have generated passwords: sudo tar -xOf /root/wazuh/wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt"
    - "Vulnerability detection is off: its feed comes from the internet (cti.wazuh.com) and takes over 16 GB. With internet and the disk to spare, set it to yes under <vulnerability-detection> in /var/ossec/etc/ossec.conf and restart wazuh-manager."
  debian:
    # Its installer and its offline bundle (every package) are in /opt/lab-deploy/wazuh; these are what
    # its offline installation expects to find installed.
    packages: [apt-transport-https, libcap2-bin, gnupg, debconf, adduser, procps, curl, tar, gawk, lsof, openssl]
    script: |
      src=/opt/lab-deploy/wazuh
      [ -s "$src/wazuh-offline.tar.gz" ] || { echo "This template has no Wazuh server: rebuild it with today's prepare.sh."; exit 1; }
      rm -rf /root/wazuh
      mkdir -p /root/wazuh
      cp "$src/wazuh-install.sh" /root/wazuh/
      cd /root/wazuh
      # Its bundle, unpacked where its installer looks, and this machine's copy of it removed: there's no
      # room for it twice over (1.6 GB) and Wazuh. The installer wants the archive there too, but doesn't
      # unpack it when the folder is: an empty one stands in.
      tar -xzf "$src/wazuh-offline.tar.gz"
      rm -f "$src/wazuh-offline.tar.gz"
      tar -czf wazuh-offline.tar.gz -T /dev/null
      # Its manager's unit allows 45 seconds to start; with the indexer already running on a lab's 2 vCPU,
      # it takes longer, and the installer then removes everything. Ten minutes.
      mkdir -p /etc/systemd/system/wazuh-manager.service.d
      printf '[Service]\nTimeoutStartSec=600\n' >/etc/systemd/system/wazuh-manager.service.d/lab-timeout.conf
      # No vulnerability detection: its feed (from cti.wazuh.com, which an offline lab hasn't got) takes over
      # 16 GB as it's processed, filling the disk past what the indexer allows, which fails the install.
      # Unreachable while installing; then switched off.
      echo "127.0.0.1 cti.wazuh.com # lab panel: no vulnerability feed" >>/etc/hosts
      if ! bash wazuh-install.sh --offline-installation --all-in-one </dev/null; then
        # Its last step, loading the internal users with their new passwords into the indexer (securityadmin),
        # sometimes fails on a busy 2 vCPU machine, with everything else installed and running (and Filebeat
        # already on its new password). That step again, a few times.
        tail -5 /var/log/wazuh-install.log | grep -q "Could not load the changes" || exit 1
        [ -s /etc/wazuh-indexer/backup/internal_users.yml ] || exit 1
        loaded=no
        for _ in 1 2 3 4 5; do
          sleep 20
          if OPENSEARCH_CONF_DIR=/etc/wazuh-indexer OPENSEARCH_JAVA_HOME=/usr/share/wazuh-indexer/jdk \
            /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh -p 9200 -nhnv -icl -h 127.0.0.1 \
            -cacert /etc/wazuh-indexer/certs/root-ca.pem -cert /etc/wazuh-indexer/certs/admin.pem \
            -key /etc/wazuh-indexer/certs/admin-key.pem -f /etc/wazuh-indexer/backup/internal_users.yml -t internalusers; then
            loaded=yes
            break
          fi
        done
        [ "$loaded" = yes ] || { echo "Wazuh's internal users couldn't be loaded into its indexer."; exit 1; }
        rm -rf /etc/wazuh-indexer/backup
        systemctl restart filebeat wazuh-dashboard
      fi
      rm -rf wazuh-offline wazuh-offline.tar.gz
      sed -i '/<vulnerability-detection>/,/<\/vulnerability-detection>/ s#<enabled>yes</enabled>#<enabled>no</enabled>#' /var/ossec/etc/ossec.conf
      sed -i '/cti\.wazuh\.com # lab panel/d' /etc/hosts
      # What it fetched of it: removed with the manager stopped (it's still writing there while it runs).
      systemctl stop wazuh-manager
      rm -rf /var/ossec/queue/vd /var/ossec/tmp/*
      systemctl start wazuh-manager
      # The machine's user as a dashboard administrator, through the indexer's API. (Wazuh's own
      # password tool only takes passwords with one of .*+?- in them, which the machine's may not have.)
      admin=$(tar -xOf wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt |
        awk '/indexer_username: .admin./ { found = 1; next } found && /indexer_password:/ { gsub(/[\x27"]/, "", $2); print $2; exit }')
      body=$(python3 -c 'import json, sys; print(json.dumps({"password": sys.argv[1], "backend_roles": ["admin"]}))' "$password")
      curl -ksSf -u "admin:$admin" -X PUT -H 'Content-Type: application/json' \
        "https://127.0.0.1:9200/_plugins/_security/api/internalusers/$username" -d "$body" >/dev/null
      lab_wait_http https://127.0.0.1/ 300

- id: wazuh-agent
  name: Wazuh agent
  category: Security
  description: The Wazuh agent, reporting to a Wazuh server you've deployed (a machine with the Wazuh server extra). It enrols itself as this machine's name.
  setupMinutes: 5
  notes:
    - "It reports to the Wazuh server chosen: this machine shows in its dashboard under Agents as {hostname}."
  options:
    - id: wazuh
      label: Wazuh server
      type: machine
      extra: wazuh
      help: A running machine with the Wazuh server extra.
  debian:
    # The agent's package is in /opt/lab-deploy/wazuh-agent (prepare.sh's bake_wazuh_agent).
    packages: []
    script: |
      deb=$(ls /opt/lab-deploy/wazuh-agent/wazuh-agent_*.deb 2>/dev/null | head -1)
      [ -n "$deb" ] || { echo "This template has no Wazuh agent: rebuild it with today's prepare.sh."; exit 1; }
      WAZUH_MANAGER=$wazuh_ip WAZUH_AGENT_NAME=$hostname DEBIAN_FRONTEND=noninteractive dpkg -i "$deb" >/dev/null
      systemctl daemon-reload
      systemctl enable -q wazuh-agent
      systemctl restart wazuh-agent
      # Enrolled once it has its key from the server.
      for _ in $(seq 60); do [ -s /var/ossec/etc/client.keys ] && exit 0; sleep 5; done
      echo "It didn't enrol with $wazuh_name ($wazuh_ip): is the Wazuh server running, and port 1515 open?"
      exit 1

# Zabbix 7.0 LTS: the server (PostgreSQL, the web interface in Apache), and its agent (Zabbix agent 2) on
# other machines, which picks a Zabbix server machine and registers itself there. Their packages are in
# the template (from Zabbix's own repository), switched off.

- id: zabbix
  name: Zabbix server
  category: Monitoring
  description: Zabbix 7.0 LTS monitoring, with PostgreSQL and its web interface; its user is the administrator. Machines with the Zabbix agent extra add themselves to it, with the Linux template.
  ports: [80, 10051]
  password: true
  setupMinutes: 5
  links: ["http://{ip}/zabbix/"]
  notes:
    - "Sign in as {username}, with the machine's password (Zabbix's Admin is renamed to it)."
    - "Agents send to {ip} on port 10051: deploy machines with the Zabbix agent extra and choose this one; they show under Monitoring → Hosts within a few minutes."
  debian:
    packages: [zabbix-server-pgsql, zabbix-frontend-php, zabbix-apache-conf, zabbix-sql-scripts, zabbix-agent2, php-pgsql, postgresql, apache2, libapache2-mod-php]
    script: |
      systemctl enable -q --now postgresql
      db_pass=$(openssl rand -hex 16)
      if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'zabbix'" | grep -q 1; then
        sudo -u postgres psql -qc "CREATE USER zabbix PASSWORD '$db_pass'"
        sudo -u postgres createdb -O zabbix zabbix
        # Where 7.0's package puts its schema (6.x: /usr/share/zabbix-sql-scripts).
        schema=$(ls /usr/share/zabbix/sql-scripts/postgresql/server.sql.gz /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz 2>/dev/null | head -1)
        zcat "$schema" | sudo -u zabbix psql -q zabbix >/dev/null
      else
        sudo -u postgres psql -qc "ALTER USER zabbix PASSWORD '$db_pass'"
      fi
      sed -i -E "s/^#? ?DBPassword=.*/DBPassword=$db_pass/" /etc/zabbix/zabbix_server.conf
      # The web interface, set up (its first-visit wizard writes this file).
      cat >/etc/zabbix/web/zabbix.conf.php <<EOF
      <?php
      // Written by the lab panel's zabbix extra.
      \$DB['TYPE'] = 'POSTGRESQL';
      \$DB['SERVER'] = 'localhost';
      \$DB['PORT'] = '0';
      \$DB['DATABASE'] = 'zabbix';
      \$DB['USER'] = 'zabbix';
      \$DB['PASSWORD'] = '$db_pass';
      \$DB['SCHEMA'] = '';
      \$DB['ENCRYPTION'] = false;
      \$DB['KEY_FILE'] = '';
      \$DB['CERT_FILE'] = '';
      \$DB['CA_FILE'] = '';
      \$DB['VERIFY_HOST'] = false;
      \$DB['CIPHER_LIST'] = '';
      \$DB['VAULT'] = '';
      \$DB['VAULT_URL'] = '';
      \$DB['VAULT_DB_PATH'] = '';
      \$DB['VAULT_TOKEN'] = '';
      \$DB['DOUBLE_IEEE754'] = true;
      \$ZBX_SERVER_NAME = '$hostname';
      \$IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      EOF
      chown www-data:www-data /etc/zabbix/web/zabbix.conf.php
      chmod 640 /etc/zabbix/web/zabbix.conf.php
      # The machine's user in Admin's place, with its password.
      hash=$(php -r 'echo password_hash($argv[1], PASSWORD_BCRYPT);' "$password")
      sudo -u postgres psql -q zabbix -v u="$username" -v h="$hash" <<'SQL'
      UPDATE users SET username = :'u', passwd = :'h' WHERE username = 'Admin' OR username = :'u';
      SQL
      systemctl enable -q zabbix-server zabbix-agent2 apache2
      systemctl restart zabbix-server zabbix-agent2 apache2
      lab_wait_http http://127.0.0.1/zabbix/
      # Agents that say they're the lab's (their HostMetadata) are added with the Linux template.
      python3 - "$username" "$password" <<'PY'
      import json, sys, urllib.request
      def api(method, params, auth=None):
          headers = {"Content-Type": "application/json-rpc"}
          if auth:
              headers["Authorization"] = "Bearer " + auth
          req = urllib.request.Request("http://127.0.0.1/zabbix/api_jsonrpc.php", headers=headers,
                                       data=json.dumps({"jsonrpc": "2.0", "method": method, "params": params, "id": 1}).encode())
          out = json.load(urllib.request.urlopen(req, timeout=60))
          if "error" in out:
              raise SystemExit(f"Zabbix API {method}: {out['error']}")
          return out["result"]
      token = api("user.login", {"username": sys.argv[1], "password": sys.argv[2]})
      if api("action.get", {"filter": {"name": "Lab panel agents"}}, token):
          sys.exit(0)
      template = api("template.get", {"filter": {"host": "Linux by Zabbix agent"}}, token)[0]["templateid"]
      group = api("hostgroup.get", {"filter": {"name": "Linux servers"}}, token)[0]["groupid"]
      api("action.create", {
          "name": "Lab panel agents", "eventsource": 2,
          "filter": {"evaltype": 0, "conditions": [{"conditiontype": 24, "operator": 2, "value": "lab-panel"}]},
          "operations": [
              {"operationtype": 2},
              {"operationtype": 4, "opgroup": [{"groupid": group}]},
              {"operationtype": 6, "optemplate": [{"templateid": template}]},
          ],
      }, token)
      PY

- id: zabbix-agent
  name: Zabbix agent
  category: Monitoring
  description: Zabbix agent 2, reporting to a Zabbix server you've deployed (a machine with the Zabbix server extra), which adds this machine with the Linux template.
  ports: [10050]
  setupMinutes: 5
  notes:
    - "It reports to the Zabbix server chosen: this machine shows there under Monitoring → Hosts as {hostname}."
  options:
    - id: zabbix
      label: Zabbix server
      type: machine
      extra: zabbix
      help: A running machine with the Zabbix server extra.
  debian:
    packages: [zabbix-agent2]
    script: |
      config=/etc/zabbix/zabbix_agent2.conf
      sed -i -E -e "s/^Server=.*/Server=$zabbix_ip/" -e "s/^ServerActive=.*/ServerActive=$zabbix_ip/" \
        -e "s/^Hostname=.*/Hostname=$hostname/" -e '/^HostMetadata=/d' "$config"
      echo "HostMetadata=lab-panel" >>"$config"
      systemctl enable -q zabbix-agent2
      systemctl restart zabbix-agent2
      lab_open 10050/tcp
      # Registered once the server has it as a host (its auto-registration runs every minute or so).
      for _ in $(seq 40); do
        found=$(python3 - "$zabbix_ip" "$zabbix_username" "$zabbix_password" "$hostname" <<'PY'
      import json, sys, urllib.request
      ip, user, password, name = sys.argv[1:]
      def api(method, params, auth=None):
          headers = {"Content-Type": "application/json-rpc"}
          if auth:
              headers["Authorization"] = "Bearer " + auth
          req = urllib.request.Request(f"http://{ip}/zabbix/api_jsonrpc.php", headers=headers,
                                       data=json.dumps({"jsonrpc": "2.0", "method": method, "params": params, "id": 1}).encode())
          return json.load(urllib.request.urlopen(req, timeout=30)).get("result")
      try:
          token = api("user.login", {"username": user, "password": password})
          print("yes" if api("host.get", {"filter": {"host": name}}, token) else "no")
      except Exception:
          print("no")
      PY
      )
        [ "$found" = yes ] && exit 0
        sleep 15
      done
      echo "$zabbix_name ($zabbix_ip) didn't add this machine: is the Zabbix server running, and port 10051 open?"
      exit 1

- id: iis
  name: IIS
  category: Web servers
  description: Microsoft's web server on port 80, with a page showing the machine's name.
  ports: [80]
  links: ["http://{ip}/"]
  windows:
    script: |
      if (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue) {
        Install-WindowsFeature -Name Web-Server -IncludeManagementTools | Out-Null
      } else {
        # Windows 10/11: an optional feature rather than a server role.
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebServerRole, IIS-WebServer -All -NoRestart | Out-Null
      }
      Set-Content -Path C:\inetpub\wwwroot\index.html -Encoding ascii -Value "<h1>$hostname</h1><p>IIS, deployed by the lab panel.</p>"

- id: mssql
  name: SQL Server
  category: Databases
  description: Microsoft SQL Server 2025 Developer edition, from files in the template, reachable from the network with the machine's user as an administrator. Optionally filled with dummy data.
  ports: [1433]
  password: true
  minMemoryGB: 2
  notes:
    - "Connect to {ip} (port 1433) with SQL Server authentication, as {username} with the machine's password, e.g. from SQL Server Management Studio or sqlcmd -S {ip} -U {username}. Trust the server certificate: it's self-signed."
    - text: "Dummy data is in the database Chinook: 11 tables (Artist, Album, Track, Customer, Invoice…), e.g. SELECT count(*) FROM Track; gives 3503."
      when: {sample_data: ["yes"]}
  options:
    - *sample_data
  windows:
    script: |
      # The install media prepare.ps1 -SqlServer copied into the template, and Chinook's script.
      $src = 'C:\LabDeploy\sqlserver'
      if (-not (Test-Path "$src\setup.exe")) {
        throw "This template has no SQL Server files in $src. Rebuild it with prepare.ps1 -SqlServer."
      }
      $logs = 'C:\ProgramData\lab-deploy\logs'
      if (-not (Get-Service -Name MSSQLSERVER -ErrorAction SilentlyContinue)) {
        # Takes about 10 minutes. Windows sign-in for Administrators (and SYSTEM, which runs this);
        # SQL Server sign-in too, for the machine's user below. "sa" gets a random password, then is
        # switched off: the machine's password only ever goes in through SQL, not a command line.
        $sa = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ }) + 'aA1!'
        $arguments = '/Q /ACTION=Install /FEATURES=SQLEngine /INSTANCENAME=MSSQLSERVER /IACCEPTSQLSERVERLICENSETERMS ' +
          '/UPDATEENABLED=False /TCPENABLED=1 /SECURITYMODE=SQL /SAPWD="' + $sa + '" ' +
          '/SQLSVCACCOUNT="NT Service\MSSQLSERVER" /SQLSYSADMINACCOUNTS="BUILTIN\Administrators" "NT AUTHORITY\SYSTEM"'
        $setup = Start-Process -FilePath "$src\setup.exe" -ArgumentList $arguments -Wait -PassThru
        # 3010: installed, a restart needed to finish; it's done after the steps below.
        if ($setup.ExitCode -ne 0 -and $setup.ExitCode -ne 3010) {
          throw "SQL Server setup failed (exit code $($setup.ExitCode)); its logs are under C:\Program Files\Microsoft SQL Server\*\Setup Bootstrap\Log."
        }
        $restart = $setup.ExitCode -eq 3010
      } else {
        $restart = $false
      }
      Start-Service -Name MSSQLSERVER
      if (-not (Get-NetFirewallRule -Name 'LabSqlServer' -ErrorAction SilentlyContinue)) {
        New-NetFirewallRule -Name 'LabSqlServer' -DisplayName 'SQL Server (lab panel)' -Direction Inbound -Protocol TCP -LocalPort 1433 -Action Allow | Out-Null
      }

      # T-SQL as this script's account (SYSTEM, a sysadmin), in batches split at "GO" lines.
      function Invoke-Sql([string]$Text) {
        $connection = New-Object System.Data.SqlClient.SqlConnection 'Server=localhost;Integrated Security=True;Database=master'
        $connection.Open()
        try {
          foreach ($batch in [regex]::Split($Text, '(?im)^\s*GO\s*$')) {
            if (-not $batch.Trim()) { continue }
            $command = $connection.CreateCommand()
            $command.CommandText = $batch
            $command.CommandTimeout = 600
            $command.ExecuteNonQuery() | Out-Null
          }
        } finally {
          $connection.Close()
        }
      }
      $name = $username.Replace(']', ']]')
      $secret = $password.Replace("'", "''")
      Invoke-Sql @"
      IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'$($username.Replace("'", "''"))')
        CREATE LOGIN [$name] WITH PASSWORD = N'$secret', CHECK_POLICY = OFF;
      ELSE
        ALTER LOGIN [$name] WITH PASSWORD = N'$secret', CHECK_POLICY = OFF;
      ALTER SERVER ROLE sysadmin ADD MEMBER [$name];
      ALTER LOGIN sa DISABLE;
      "@
      if ($sample_data -eq 'yes') {
        Invoke-Sql ([IO.File]::ReadAllText('C:\LabDeploy\chinook\Chinook_SqlServer.sql'))
      }
      if ($restart) { exit 3010 }

- id: outlook
  name: Outlook
  category: Mail
  description: Microsoft Outlook (Office LTSC 2024), unactivated, from files in the template. Not on Server Core.
  minMemoryGB: 4
  notes:
    - "Office isn't activated: Outlook shows a licence notice, and after its grace period some features stop working. Fine for a short-lived machine."
    - "Add an account in Outlook yourself, e.g. a mail server deployed from the panel (IMAP on 143 or 993, SMTP on 587)."
  windows:
    script: |
      # The Office files prepare.ps1 -Office copied into the template, with the download's settings
      # (product, language, the apps left out), scripts/template/office/download.xml.
      $src = 'C:\LabDeploy\office'
      if (-not (Test-Path "$src\setup.exe")) {
        throw "This template has no Office files in $src. Rebuild it with prepare.ps1 -Office."
      }
      [xml]$config = Get-Content -Path "$src\download.xml"
      $add = $config.Configuration.SelectSingleNode('Add')
      $add.SetAttribute('SourcePath', $src)
      $add.SetAttribute('AllowCdnFallback', 'FALSE')
      foreach ($node in @($config.Configuration.SelectNodes('Display|Logging'))) {
        $config.Configuration.RemoveChild($node) | Out-Null
      }
      $logs = 'C:\ProgramData\lab-deploy\logs\office'
      $display = $config.CreateElement('Display')
      $display.SetAttribute('Level', 'None')
      $display.SetAttribute('AcceptEULA', 'TRUE')
      $logging = $config.CreateElement('Logging')
      $logging.SetAttribute('Level', 'Standard')
      $logging.SetAttribute('Path', $logs)
      $config.Configuration.AppendChild($display) | Out-Null
      $config.Configuration.AppendChild($logging) | Out-Null
      $install = 'C:\ProgramData\lab-deploy\outlook.xml'
      $config.Save($install)

      # Waits until Office is installed: about 5 to 10 minutes.
      $setup = Start-Process -FilePath "$src\setup.exe" -ArgumentList '/configure', "`"$install`"" -Wait -PassThru
      if ($setup.ExitCode -ne 0) { throw "Office setup failed (exit code $($setup.ExitCode)); its logs are in $logs." }
      $exe = Join-Path $env:ProgramFiles 'Microsoft Office\root\Office16\OUTLOOK.EXE'
      if (-not (Test-Path $exe)) { throw "Office setup finished, but there's no $exe." }
      $link = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:PUBLIC\Desktop\Outlook.lnk")
      $link.TargetPath = $exe
      $link.Save()

# Active Directory: a Windows Server machine becomes a domain's first domain controller; other
# Windows machines join that domain, choosing the controller from the running machines (a machine
# option: the panel passes its address, domain and sign-in to the script, as dc_*).
- id: domain-controller
  name: Domain controller
  category: Active Directory
  description: Makes this server the first domain controller of a new Active Directory forest, with its DNS. Its user becomes a domain administrator.
  ports: [53, 88, 389, 636, 3268]
  password: true
  setupMinutes: 20
  notes:
    - "Domain {domain} (short name {netbios}): sign in as {netbios}\\{username} with the machine's password, over Remote Desktop or SSH."
    - "Other Windows machines join it with the Join a domain extra, choosing this machine. They use it for DNS, so keep it running while they're in use."
    - "Its address came from DHCP. If it changes (say, after a long time off), redeploy the machines in its domain."
  options:
    - id: domain
      label: Domain name
      type: hostname
      default: lab.internal
      help: The domain's DNS name, two labels or more, e.g. corp.lab.internal.
    - id: netbios
      label: Short name
      type: text
      pattern: "[A-Za-z][A-Za-z0-9-]{0,14}"
      default: LAB
      help: The domain's NetBIOS name, as in LAB\user. Up to 15 letters, digits or hyphens.
  windows:
    script: |
      if (-not (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue)) {
        throw "A domain controller needs Windows Server."
      }
      if ($domain -notlike '*.*' -or $domain.StartsWith('*')) {
        throw "The domain name needs two labels or more, e.g. lab.internal."
      }
      # Already promoted: the first-boot script does the rest (the user into Domain Admins).
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4) { exit 0 }
      Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools | Out-Null
      # The built-in Administrator becomes the domain's, and promotion wants it to have a strong
      # password: a random one. It stays switched off, as the first-boot script left it.
      $random = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ }) + 'aA1!'
      Get-LocalUser | Where-Object { $_.SID.Value -like 'S-1-5-21-*-500' } |
        Set-LocalUser -Password (ConvertTo-SecureString $random -AsPlainText -Force)
      Import-Module ADDSDeployment
      # Directory Services Restore Mode's password: the machine's.
      $safe = ConvertTo-SecureString $password -AsPlainText -Force
      $result = Install-ADDSForest -DomainName $domain -DomainNetbiosName $netbios.ToUpper() -SafeModeAdministratorPassword $safe `
        -InstallDns -NoRebootOnCompletion -Force -WarningAction SilentlyContinue
      if ($result.Status -ne 'Success') { throw "Promotion failed: $($result.Message)" }
      exit 3010

- id: join-domain
  name: Join a domain
  category: Active Directory
  description: Joins this machine to the domain of a domain controller you've deployed, which it then uses for DNS. Domain users can sign in to it.
  setupMinutes: 5
  notes:
    - "Sign in with a domain account, e.g. the domain controller's user as DOMAIN\\user (its page has the details). This machine's own user still works, as .\\{username}."
  options:
    - id: dc
      label: Domain controller
      type: machine
      extra: domain-controller
      help: A running machine with the Domain controller extra.
  windows:
    script: |
      $computer = Get-CimInstance Win32_ComputerSystem
      if ($computer.PartOfDomain -and $computer.Domain -eq $dc_domain) { exit 0 }
      # The domain controller answers DNS for the domain, and forwards other names to the LAN's DNS.
      $adapter = Get-NetAdapter | Where-Object Status -eq 'Up' | Select-Object -First 1
      Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dc_ip
      Clear-DnsClientCache
      $deadline = (Get-Date).AddMinutes(5)
      while (-not (Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.$dc_domain" -Type SRV -ErrorAction SilentlyContinue)) {
        if ((Get-Date) -gt $deadline) { throw "Can't find the domain $dc_domain through $dc_name ($dc_ip)." }
        Start-Sleep -Seconds 10
      }
      $credential = New-Object PSCredential("$($dc_netbios.ToUpper())\$dc_username", (ConvertTo-SecureString $dc_password -AsPlainText -Force))
      Add-Computer -DomainName $dc_domain -Credential $credential -Force -WarningAction SilentlyContinue
      exit 3010

# Exchange Server SE on its own template (templates.yaml: exchange), with its files and prerequisites
# baked in (prepare.ps1 -Exchange). It joins a domain controller's domain, then runs Exchange's setup as
# that controller's user (a domain, schema and enterprise administrator), which also prepares the
# forest. Unlicensed, it's a 180-day trial.
- id: exchange
  name: Exchange Server
  category: Mail
  description: Exchange Server SE (Mailbox role) in a domain controller's domain, with a mailbox for the controller's user. Takes over an hour to set up.
  # No ports listed: it's alone on its template, so there's nothing to clash with.
  setupMinutes: 150
  minMemoryGB: 8
  notes:
    - "Outlook on the web: https://{ip}/owa, and the admin centre: https://{ip}/ecp. Sign in as the domain controller's user (DOMAIN\\user, with its password; its machine page has them). The certificate is self-signed."
    - "Unlicensed, Exchange runs as a 180-day trial. It uses the domain controller for DNS, so keep that running."
  options:
    - id: dc
      label: Domain controller
      type: machine
      extra: domain-controller
      help: A running machine with the Domain controller extra. Exchange joins its domain.
    - id: organization
      label: Organisation name
      type: text
      pattern: "[A-Za-z0-9][A-Za-z0-9 -]{0,63}"
      default: Lab
      help: The Exchange organisation's name, shown in its admin centre.
  windows:
    script: |
      $src = 'C:\LabDeploy\exchange'
      if (-not (Test-Path "$src\Setup.exe")) {
        throw "This template has no Exchange files in $src. Rebuild it with prepare.ps1 -Exchange."
      }
      $admin = "$($dc_netbios.ToUpper())\$dc_username"
      # First: join the domain (as the Join a domain extra), then restart.
      $computer = Get-CimInstance Win32_ComputerSystem
      if (-not ($computer.PartOfDomain -and $computer.Domain -eq $dc_domain)) {
        $adapter = Get-NetAdapter | Where-Object Status -eq 'Up' | Select-Object -First 1
        Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses $dc_ip
        Clear-DnsClientCache
        $deadline = (Get-Date).AddMinutes(5)
        while (-not (Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.$dc_domain" -Type SRV -ErrorAction SilentlyContinue)) {
          if ((Get-Date) -gt $deadline) { throw "Can't find the domain $dc_domain through $dc_name ($dc_ip)." }
          Start-Sleep -Seconds 10
        }
        $credential = New-Object PSCredential($admin, (ConvertTo-SecureString $dc_password -AsPlainText -Force))
        Add-Computer -DomainName $dc_domain -Credential $credential -Force -WarningAction SilentlyContinue
        # Restart, then run this again (3011, not 3010: it isn't done).
        exit 3011
      }

      # Then Exchange's setup, as the domain administrator: it prepares the schema and the domain, which
      # the machine's own account can't. A scheduled task runs it as that user, and this waits for it.
      function Invoke-AsAdmin([string]$Name, [string]$Command, [int]$Hours) {
        # The whole command in one more pair of quotes: cmd.exe strips the first and last quote of
        # what follows /c when it starts with one.
        $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$Command`""
        Register-ScheduledTask -TaskName $Name -Action $action -User $admin -Password $dc_password -RunLevel Highest -Force | Out-Null
        Start-ScheduledTask -TaskName $Name
        Start-Sleep -Seconds 10
        $deadline = (Get-Date).AddHours($Hours)
        while ((Get-ScheduledTask -TaskName $Name).State -eq 'Running') {
          if ((Get-Date) -gt $deadline) { throw "$Name didn't finish within $Hours hours." }
          Start-Sleep -Seconds 30
        }
        $result = (Get-ScheduledTaskInfo -TaskName $Name).LastTaskResult
        Unregister-ScheduledTask -TaskName $Name -Confirm:$false
        return $result
      }
      $logs = 'C:\ProgramData\lab-deploy\logs'
      # Windows features Exchange's setup checks for that templates built before 2026-10-21 lack
      # (prepare.ps1 installs them now). From files already on the machine; no restart.
      $missing = Get-WindowsFeature -Name NET-WCF-HTTP-Activation45, NET-WCF-Pipe-Activation45 | Where-Object { -not $_.Installed }
      if ($missing) { Install-WindowsFeature -Name $missing.Name | Out-Null }
      if (-not (Get-Service -Name MSExchangeIS -ErrorAction SilentlyContinue)) {
        $setup = "`"$src\Setup.exe`" /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF /Mode:Install /Roles:Mailbox " +
          "/OrganizationName:`"$organization`" > `"$logs\exchange-setup.log`" 2>&1"
        $code = Invoke-AsAdmin 'LabExchangeSetup' $setup 4
        if ($code -ne 0) {
          throw "Exchange's setup failed (exit code $code): see $logs\exchange-setup.log and C:\ExchangeSetupLogs\ExchangeSetup.log."
        }
      }
      # A mailbox for the domain controller's user, so Outlook on the web works straight away.
      $mailbox = "powershell.exe -NoProfile -Command `"Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn; " +
        "if (-not (Get-Mailbox -Identity '$dc_username' -ErrorAction SilentlyContinue)) { Enable-Mailbox -Identity '$dc_username' }`" " +
        "> `"$logs\exchange-mailbox.log`" 2>&1"
      $code = Invoke-AsAdmin 'LabExchangeMailbox' $mailbox 1
      if ($code -ne 0) { throw "Making $dc_username's mailbox failed: see $logs\exchange-mailbox.log." }
      # Exchange asks for a restart after setup.
      exit 3010
