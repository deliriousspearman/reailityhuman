- id: node-exporter
  name: Node Exporter
  category: Monitoring
  dockerImage: prom/node-exporter:v1.12.1
  description: Prometheus's Node Exporter (in Docker), reporting this machine's CPU, memory, disks and network on port 9100, for a Prometheus to collect.
  ports: [9100]
  links: ["http://{ip}:9100/metrics"]
  notes:
    - "Add {ip}:9100 to a Prometheus machine's targets (its Targets option when you deploy it, or its prometheus.yml)."
  debian:
    packages: [docker.io]
    script: |
      lab_docker node-exporter --network host --pid host -v /:/host:ro,rslave prom/node-exporter:v1.12.1 --path.rootfs=/host
      lab_wait_http http://127.0.0.1:9100/metrics

- id: prometheus
  name: Prometheus
  category: Monitoring
  dockerImage: prom/prometheus:v3.15.1
  moreImages: [node-exporter]   # its example data runs Node Exporter
  description: Prometheus (in Docker), collecting metrics and evaluating alert rules, with its web interface on port 9090. Optionally with example data, and other machines to collect from.
  ports: [9090]
  links: ["http://{ip}:9090/"]
  notes:
    - "Its web interface has no sign-in: keep it on the lab network. Its settings are in /etc/prometheus-lab/prometheus.yml; after changing them, run sudo docker kill -s HUP prometheus."
    - text: "Example data: Node Exporter on this machine (port 9100, job node) reports its CPU, memory, disks and network, with example recording rules (instance:node_cpu_utilisation:ratio, …) and alerts (TargetDown, HighCPU, DiskAlmostFull, and Watchdog, always firing) under Alerts. Try node_load1 in the Query page."
      when: {sample_data: ["yes"]}
    - "With Grafana on the same machine, Grafana has it as its data source."
  options:
    - id: sample_data
      label: Add example data
      help: Node Exporter on this machine, so there are real metrics to query from the start, and example recording and alert rules.
      type: boolean
      default: "no"
    - id: targets
      label: Other machines to collect from
      help: "Addresses of machines with Node Exporter (or anything else Prometheus can read), separated by commas, e.g. 192.0.2.10, 192.0.2.11:9100. Port 9100 if none is given."
      type: text
      pattern: "[A-Za-z0-9.:, -]*"
  debian:
    packages: [docker.io]
    script: |
      conf=/etc/prometheus-lab
      mkdir -p "$conf"
      extra=""
      for t in $(printf '%s' "$targets" | tr ',' ' '); do
        case $t in *:*) ;; *) t="$t:9100" ;; esac
        extra="$extra'$t', "
      done
      {
        printf 'global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\nrule_files: [/etc/prometheus/rules.yml]\n'
        printf 'scrape_configs:\n  - job_name: prometheus\n    static_configs: [{targets: [localhost:9090]}]\n'
        if [ "$sample_data" = yes ]; then
          printf '  - job_name: node\n    static_configs: [{targets: [localhost:9100], labels: {machine: %s}}]\n' "$hostname"
        fi
        if [ -n "$extra" ]; then
          printf '  - job_name: targets\n    static_configs: [{targets: [%s]}]\n' "${extra%, }"
        fi
      } >"$conf/prometheus.yml"
      if [ "$sample_data" = yes ]; then
        cat >"$conf/rules.yml" <<'EOF'
      groups:
        - name: lab-examples
          rules:
            - record: instance:node_cpu_utilisation:ratio
              expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[1m]))
            - record: instance:node_memory_utilisation:ratio
              expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
            - alert: TargetDown
              expr: up == 0
              for: 1m
              labels: {severity: critical}
              annotations: {summary: "{{ $labels.instance }} ({{ $labels.job }}) is down"}
            - alert: HighCPU
              expr: instance:node_cpu_utilisation:ratio > 0.8
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "CPU above 80% on {{ $labels.instance }} for 5 minutes"}
            - alert: DiskAlmostFull
              expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.1
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "Less than 10% free on {{ $labels.mountpoint }} ({{ $labels.instance }})"}
            - alert: Watchdog
              expr: vector(1)
              labels: {severity: none}
              annotations: {summary: "Always firing, to show alerting works"}
      EOF
        lab_docker node-exporter --network host --pid host -v /:/host:ro,rslave prom/node-exporter:v1.12.1 --path.rootfs=/host
      else
        echo 'groups: []' >"$conf/rules.yml"
      fi
      chmod 644 "$conf"/*.yml
      lab_docker prometheus --network host -v prometheus:/prometheus -v "$conf:/etc/prometheus:ro" prom/prometheus:v3.15.1
      lab_wait_http http://127.0.0.1:9090/-/ready

- id: grafana
  name: Grafana
  category: Monitoring
  dockerImage: grafana/grafana:13.2.4
  description: Grafana dashboards as the machine's website (in Docker), with its user as the administrator. With Prometheus on the same machine, that's its data source. Optionally with example dashboards.
  ports: [80]
  password: true
  links: ["http://{ip}/"]
  notes:
    - "Sign in as {username}, with the machine's password."
    - text: "Example data: the dashboards in the folder Lab examples. Lab demo draws from Grafana's TestData source (no other machine needed); with Prometheus and its example data on this machine, This machine shows its CPU, memory, disk and network."
      when: {sample_data: ["yes"]}
  options:
    - id: sample_data
      label: Add example dashboards
      help: A TestData data source and a demo dashboard; with Prometheus here too, a dashboard of this machine's metrics.
      type: boolean
      default: "no"
  debian:
    packages: [docker.io]
    script: |
      prov=/etc/grafana-lab
      rm -rf "$prov"
      mkdir -p "$prov/datasources" "$prov/dashboards" "$prov/dashboard-files"
      # Prometheus on this machine (its extra runs first): Grafana's default data source.
      prometheus=no
      if docker inspect prometheus >/dev/null 2>&1; then
        prometheus=yes
        printf 'apiVersion: 1\ndatasources:\n  - {name: Prometheus, uid: lab-prometheus, type: prometheus, access: proxy, url: "http://%s:9090", isDefault: true}\n' \
          "$(lab_ip)" >"$prov/datasources/prometheus.yml"
      fi
      if [ "$sample_data" = yes ]; then
        printf 'apiVersion: 1\ndatasources:\n  - {name: TestData, uid: lab-testdata, type: grafana-testdata-datasource}\n' >"$prov/datasources/testdata.yml"
        printf 'apiVersion: 1\nproviders:\n  - {name: lab, folder: Lab examples, type: file, options: {path: /var/lib/grafana-dashboards}}\n' >"$prov/dashboards/lab.yml"
        cat >"$prov/dashboard-files/lab-demo.json" <<'EOF'
      {"uid": "lab-demo", "title": "Lab demo", "time": {"from": "now-6h", "to": "now"}, "refresh": "30s", "schemaVersion": 39,
       "panels": [
        {"type": "timeseries", "title": "Requests per second (random walk)", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "grafana-testdata-datasource", "uid": "lab-testdata"},
         "targets": [{"refId": "A", "scenarioId": "random_walk", "seriesCount": 3, "alias": "web0$seriesIndex"}]},
        {"type": "gauge", "title": "CPU", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 8},
         "datasource": {"type": "grafana-testdata-datasource", "uid": "lab-testdata"},
         "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}},
         "targets": [{"refId": "A", "scenarioId": "random_walk", "min": 0, "max": 100, "startValue": 40}]},
        {"type": "stat", "title": "Errors today", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 8},
         "datasource": {"type": "grafana-testdata-datasource", "uid": "lab-testdata"},
         "targets": [{"refId": "A", "scenarioId": "random_walk", "min": 0, "startValue": 12}]},
        {"type": "table", "title": "Servers", "gridPos": {"x": 0, "y": 8, "w": 24, "h": 7},
         "datasource": {"type": "grafana-testdata-datasource", "uid": "lab-testdata"},
         "targets": [{"refId": "A", "scenarioId": "csv_content",
                      "csvContent": "server,role,status,uptime_days\nweb01,web,up,41\nweb02,web,up,41\ndb01,database,up,97\nbackup01,backup,down,0"}]}
       ]}
      EOF
        if [ "$prometheus" = yes ]; then
          cat >"$prov/dashboard-files/this-machine.json" <<'EOF'
      {"uid": "lab-node", "title": "This machine", "time": {"from": "now-1h", "to": "now"}, "refresh": "30s", "schemaVersion": 39,
       "panels": [
        {"type": "timeseries", "title": "CPU used", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "lab-prometheus"}, "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"refId": "A", "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))", "legendFormat": "{{instance}}"}]},
        {"type": "timeseries", "title": "Memory used", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "lab-prometheus"}, "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"refId": "A", "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes", "legendFormat": "{{instance}}"}]},
        {"type": "bargauge", "title": "Disk free", "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "lab-prometheus"}, "fieldConfig": {"defaults": {"unit": "bytes"}},
         "targets": [{"refId": "A", "expr": "node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"}", "legendFormat": "{{mountpoint}}"}]},
        {"type": "timeseries", "title": "Network", "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "lab-prometheus"}, "fieldConfig": {"defaults": {"unit": "Bps"}},
         "targets": [{"refId": "A", "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[1m])", "legendFormat": "in {{device}}"},
                     {"refId": "B", "expr": "rate(node_network_transmit_bytes_total{device!=\"lo\"}[1m])", "legendFormat": "out {{device}}"}]}
       ]}
      EOF
        fi
      fi
      chmod -R a+rX "$prov"
      lab_docker grafana -p 80:3000 -v grafana:/var/lib/grafana \
        -v "$prov/datasources:/etc/grafana/provisioning/datasources:ro" -v "$prov/dashboards:/etc/grafana/provisioning/dashboards:ro" \
        -v "$prov/dashboard-files:/var/lib/grafana-dashboards:ro" \
        -e GF_SECURITY_ADMIN_USER="$username" -e GF_SECURITY_ADMIN_PASSWORD="$password" grafana/grafana:13.2.4
      lab_wait_http http://127.0.0.1/

- id: vaultwarden
