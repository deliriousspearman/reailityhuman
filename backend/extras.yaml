# Optional services people can tick when they deploy a machine. A template offers the ones listed
# under its `extras` in templates.yaml; their packages are already in the template (installed,
# switched off, by scripts/template/prepare.sh), so nothing is downloaded at deploy and it works
# without internet. On the machine's first boot, cloud-init runs each chosen extra's `script` for
# the template's family.
#
#   category   the heading it's listed under on the deploy form, e.g. Web servers; extras of a
#              category are listed in this file's order, and categories in order of first use
#   minMemoryGB  optional: the least memory a machine needs for it (e.g. a desktop); a machine with
#              it gets at least this much, more than its template's if need be
#   minCPU     optional: the least vCPUs it needs; likewise, a machine with it gets at least as many
#   ports      the ports it listens on. Extras that would share one can't be chosen together: each
#              web service (80/443) gets a machine of its own, while FTP or a desktop go with any.
#   links      addresses shown on the machine's page, once it has an address; and
#   notes      sentences shown with them, e.g. how to sign in. In both, {ip} is its address,
#              {username} its user, {hostname} its name, and {<option id>} that option's value. A
#              link or note can be {text, when: {<option id>: [values]}}, shown only for those values.
#   options    fields shown when the extra is ticked. Each value reaches the script as a shell
#              variable of the same name, already validated and quoted; scripts never get raw input.
#                type      hostname: a DNS name, optionally "*."-prefixed; text: matched by `pattern`;
#                          choice: one of `choices` ([{value, label}]); boolean: "yes" or "no"
#                when      optional: {<option id>: [values]}, to show it only then
#                default   used when it's left blank. {hostname} is the machine's name, {fqdn} the
#                          name plus MACHINE_DOMAIN (just the name when that's empty)
#   password   true if the script needs the machine's password as it is ($password), e.g. for a web
#              app's admin; then the panel clears it from vCenter once the machine is set up.
#              $username (the machine's user) is always set.
#   <family>   debian or rhel: `packages` (must be in prepare.sh's EXTRA_PACKAGES_<FAMILY>, which a
#              test checks) and `script`, run with bash -e as root. $hostname is always set, and
#              the helpers in extras.py's LIB are there: lab_cert (a self-signed certificate),
#              lab_apache, lab_apache_site (a folder as the whole site, optionally over HTTPS),
#              lab_open (firewalld), lab_ip.
#              windows: just `script`, PowerShell run as SYSTEM with $ErrorActionPreference = 'Stop'
#              (any PowerShell error fails the extra). A program that fails doesn't stop it, though:
#              after running one, check it, e.g. `if ($LASTEXITCODE) { throw "x.exe failed" }`.
#              Options and $hostname are PowerShell variables. Windows roles and features install
#              from files already on the machine, so nothing is baked into the template, except
#              for Outlook: prepare.ps1 -Office copies Office's install files in.
#              An extra that needs a restart to finish exits with 3010 ("done, restart needed"), e.g.
#              `if ((Install-WindowsFeature X).RestartNeeded -eq 'Yes') { exit 3010 }`: Windows
#              restarts and the extras after it carry on (3 restarts at most, for all of them).
#              One with more to do after the restart exits with 3011 instead: it runs again then.

- id: nginx
  name: nginx
  category: Web servers
  description: Web server on port 80, with a page showing the machine's name.
  ports: [80]
  links: ["http://{ip}/"]
  debian:
    packages: [nginx]
    script: |
      echo "<h1>$hostname</h1><p>nginx, deployed by the lab panel.</p>" >/var/www/html/index.html
      systemctl enable --now nginx
  rhel:
    packages: [nginx]
    script: |
      echo "<h1>$hostname</h1><p>nginx, deployed by the lab panel.</p>" >/usr/share/nginx/html/index.html
      systemctl enable --now nginx
      lab_open 80/tcp

- id: apache
  name: Apache
  category: Web servers
  description: Apache web server on port 80, with a page showing the machine's name.
  ports: [80]
  links: ["http://{ip}/"]
  debian:
    packages: [apache2]
    script: |
      echo "<h1>$hostname</h1><p>Apache, deployed by the lab panel.</p>" >/var/www/html/index.html
      systemctl enable --now apache2
  rhel:
    packages: [httpd]
    script: |
      echo "<h1>$hostname</h1><p>Apache, deployed by the lab panel.</p>" >/var/www/html/index.html
      systemctl enable --now httpd
      lab_open 80/tcp

- id: apache-https
  name: Apache + HTTPS
  category: Web servers
  description: Apache on ports 80 and 443, with a self-signed certificate made for this machine.
  ports: [80, 443]
  links: ["http://{ip}/", "https://{ip}/"]
  options:
    - id: domain
      label: Domain name
      help: The name the certificate is for, e.g. intranet.lab.example. The machine's name and address are always on it too.
      type: hostname
      default: "{fqdn}"
  debian:
    packages: [apache2, openssl]
    script: |
      lab_cert "$domain"
      sed -i -e "s#^\(\s*SSLCertificateFile\s\).*#\1$LAB_CERT#" \
             -e "s#^\(\s*SSLCertificateKeyFile\s\).*#\1$LAB_KEY#" \
        /etc/apache2/sites-available/default-ssl.conf
      echo "<h1>$domain</h1><p>Apache over HTTPS, deployed by the lab panel.</p>" >/var/www/html/index.html
      a2enmod -q ssl
      a2ensite -q default-ssl
      lab_apache
  rhel:
    packages: [httpd, mod_ssl, openssl]
    script: |
      lab_cert "$domain"
      cp "$LAB_CERT" /etc/pki/tls/certs/localhost.crt
      install -m 600 "$LAB_KEY" /etc/pki/tls/private/localhost.key
      echo "<h1>$domain</h1><p>Apache over HTTPS, deployed by the lab panel.</p>" >/var/www/html/index.html
      lab_apache
      lab_open 80/tcp 443/tcp

- id: wordpress
  name: WordPress
  category: Web apps
  description: WordPress as the machine's website, with its user as the administrator. Optionally over HTTPS.
  ports: [80, 443, 3306]
  password: true
  links:
    - text: "http://{ip}/"
      when: {https: ["no"]}
    - text: "https://{ip}/"
      when: {https: ["yes"]}
  notes:
    - "Sign in at /wp-admin/ as {username}, with the machine's password."
  options:
    - id: https
      label: Use HTTPS
      help: Served on https:// (http:// sends people there), with a self-signed certificate.
      type: boolean
      default: "no"
    - id: domain
      label: Domain name
      help: The name the certificate is for, e.g. blog.lab.example. The machine's name and address are always on it too.
      type: hostname
      default: "{fqdn}"
      when: {https: ["yes"]}
  debian:
    packages: [apache2, libapache2-mod-php, php-mysql, php-gd, php-curl, php-xml, php-mbstring, php-zip, php-intl, mariadb-server, openssl]
    script: |
      db_pass=$(openssl rand -hex 16)
      systemctl enable -q mariadb
      systemctl restart mariadb
      mariadb <<EOF
      CREATE DATABASE IF NOT EXISTS wordpress;
      CREATE USER IF NOT EXISTS 'wordpress'@'localhost' IDENTIFIED BY '$db_pass';
      GRANT ALL ON wordpress.* TO 'wordpress'@'localhost' IDENTIFIED BY '$db_pass';
      EOF
      mkdir -p /var/www/wordpress
      tar -xzf /opt/lab-deploy/wordpress.tar.gz -C /var/www/wordpress --strip-components=1
      chown -R www-data:www-data /var/www/wordpress
      a2enmod -q rewrite
      lab_apache_site /var/www/wordpress "$https" "$domain" </dev/null
      scheme=http
      [ "$https" = yes ] && scheme=https
      wp() { runuser -u www-data -- env HOME=/tmp WP_CLI_CACHE_DIR=/tmp/wp-cli php /usr/local/bin/wp --path=/var/www/wordpress "$@"; }
      wp config create --dbname=wordpress --dbuser=wordpress --dbpass="$db_pass" --skip-check
      wp core install --url="$scheme://$(lab_ip)" --title="$hostname" --admin_user="$username" \
        --admin_password="$password" --admin_email="$username@$hostname.lab.invalid" --skip-email

- id: nextcloud
  name: Nextcloud
  category: Web apps
  description: Nextcloud as the machine's website, installed from its archive, with its user as the administrator. Optionally over HTTPS.
  ports: [80, 443, 3306]
  password: true
  links:
    - text: "http://{ip}/"
      when: {https: ["no"]}
    - text: "https://{ip}/"
      when: {https: ["yes"]}
  notes:
    - "Sign in as {username}, with the machine's password."
  options:
    - id: https
      label: Use HTTPS
      help: Served on https:// (http:// sends people there), with a self-signed certificate.
      type: boolean
      default: "no"
    - id: domain
      label: Domain name
      help: The name the certificate is for, e.g. cloud.lab.example. The machine's name and address are always on it too.
      type: hostname
      default: "{fqdn}"
      when: {https: ["yes"]}
  debian:
    packages: [apache2, libapache2-mod-php, php-mysql, php-gd, php-curl, php-xml, php-mbstring, php-zip, php-intl, php-gmp, php-bcmath, mariadb-server, bzip2, openssl]
    script: |
      db_pass=$(openssl rand -hex 16)
      systemctl enable -q mariadb
      systemctl restart mariadb
      mariadb <<EOF
      CREATE DATABASE IF NOT EXISTS nextcloud CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
      CREATE USER IF NOT EXISTS 'nextcloud'@'localhost' IDENTIFIED BY '$db_pass';
      GRANT ALL ON nextcloud.* TO 'nextcloud'@'localhost' IDENTIFIED BY '$db_pass';
      EOF
      tar -xjf /opt/lab-deploy/nextcloud.tar.bz2 -C /var/www
      chown -R www-data:www-data /var/www/nextcloud
      # Nextcloud wants 512 MB for PHP.
      for dir in /etc/php/*/apache2/conf.d; do echo "memory_limit = 512M" >"$dir/99-lab-nextcloud.ini"; done
      a2enmod -q rewrite headers env dir mime
      lab_apache_site /var/www/nextcloud "$https" "$domain" <<'EOF'
      Options FollowSymLinks MultiViews
      <IfModule mod_dav.c>
          Dav off
      </IfModule>
      EOF
      occ() { runuser -u www-data -- php /var/www/nextcloud/occ "$@"; }
      occ maintenance:install --database=mysql --database-name=nextcloud --database-user=nextcloud \
        --database-pass="$db_pass" --admin-user="$username" --admin-pass="$password"
      ip=$(lab_ip)
      scheme=http
      [ "$https" = yes ] && scheme=https
      occ config:system:set trusted_domains 1 --value="$ip"
      occ config:system:set trusted_domains 2 --value="$hostname"
      occ config:system:set trusted_domains 3 --value="$domain"
      occ config:system:set overwrite.cli.url --value="$scheme://$ip"

- id: nextcloud-snap
  name: Nextcloud (snap)
  category: Web apps
  description: Nextcloud as the snap, with its own web server on ports 80 and 443; the machine's user is its administrator.
  ports: [80, 443]
  password: true
  minMemoryGB: 2
  links: ["http://{ip}/"]
  notes:
    - "Sign in as {username}, with the machine's password."
  debian:
    packages: [snapd]
    script: |
      # Snaps need their AppArmor profiles loaded: Ubuntu does that by default, Kali and Parrot don't.
      if systemctl cat snapd.apparmor.service >/dev/null 2>&1; then
        systemctl enable -q --now snapd.apparmor
      fi
      snap start --enable nextcloud
      # Its database and PHP take a moment to come up.
      for _ in $(seq 60); do nextcloud.occ status >/dev/null 2>&1 && break; sleep 5; done
      nextcloud.manual-install "$username" "$password"
      nextcloud.occ config:system:set trusted_domains 1 --value="$(lab_ip)"
      nextcloud.occ config:system:set trusted_domains 2 --value="$hostname"

- id: postgresql
  name: PostgreSQL
  category: Databases
  description: PostgreSQL, reachable from the network, with the machine's user as a superuser. Optionally filled with dummy data.
  ports: [5432]
  password: true
  notes:
    - "Connect to {ip} port 5432 as {username}, with the machine's password, e.g. psql -h {ip} -U {username}."
    - text: "Dummy data is in the database chinook: 11 tables (artist, album, track, customer, invoice…), e.g. SELECT count(*) FROM track; gives 3503."
      when: {sample_data: ["yes"]}
  options:
    - &sample_data
      id: sample_data
      label: Fill with dummy data
      help: Loads Chinook, a sample music store (artists, albums, tracks, customers, employees, invoices), about 15,000 rows in 11 tables.
      type: boolean
      default: "no"
  debian:
    packages: [postgresql]
    script: |
      # Debian and Ubuntu set PostgreSQL up with SSL on ssl-cert's snakeoil certificate, which clean.sh
      # deletes from templates (no two machines share one): this machine's own, or it won't start.
      if [ ! -e /etc/ssl/private/ssl-cert-snakeoil.key ] && command -v make-ssl-cert >/dev/null; then
        make-ssl-cert generate-default-snakeoil --force-overwrite
      fi
      hba=$(find /etc/postgresql -mindepth 3 -maxdepth 3 -path '*/main/pg_hba.conf' | sort -V | tail -n 1)
      if ! grep -q '^# Lab panel' "$hba"; then
        printf '# Lab panel: sign-ins with a password from anywhere.\nhost all all 0.0.0.0/0 scram-sha-256\nhost all all ::/0 scram-sha-256\n' >>"$hba"
      fi
      sql() { runuser -u postgres -- psql -q -v ON_ERROR_STOP=1 "$@"; }
      ready() { for _ in $(seq 30); do runuser -u postgres -- pg_isready -q && return; sleep 1; done; }
      systemctl enable -q postgresql
      systemctl restart postgresql
      ready
      # Listening on every address takes a restart.
      sql -c "ALTER SYSTEM SET listen_addresses = '*'"
      systemctl restart postgresql
      ready
      # Stored as SCRAM, as pg_hba.conf asks: PostgreSQL 13 and older (Ubuntu 20.04, 18.04) default to md5.
      sql <<EOF
      SET password_encryption = 'scram-sha-256';
      DO \$\$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$username') THEN CREATE ROLE "$username"; END IF;
      END \$\$;
      ALTER ROLE "$username" LOGIN SUPERUSER PASSWORD $(lab_sql_string "$password");
      EOF
      # Its own database too, so psql signs in without naming one.
      runuser -u postgres -- createdb -O "$username" "$username" 2>/dev/null || true
      if [ "$sample_data" = yes ]; then
        sql -f /opt/lab-deploy/chinook/Chinook_PostgreSql.sql >/dev/null
        sql -c "ALTER DATABASE chinook OWNER TO \"$username\""
      fi

- id: mariadb
  name: MariaDB
  category: Databases
  description: MariaDB, reachable from the network, with the machine's user able to do anything in it. Optionally filled with dummy data.
  ports: [3306]
  password: true
  notes:
    - "Connect to {ip} port 3306 as {username}, with the machine's password, e.g. mariadb -h {ip} -u {username} -p."
    - text: "Dummy data is in the database Chinook: 11 tables (Artist, Album, Track, Customer, Invoice…), e.g. SELECT count(*) FROM Track; gives 3503."
      when: {sample_data: ["yes"]}
  options:
    - *sample_data
  debian:
    packages: [mariadb-server]
    script: |
      cat >/etc/mysql/mariadb.conf.d/99-lab.cnf <<EOF
      # Written by the lab panel's MariaDB extra: reachable from the network.
      [mysqld]
      bind-address = 0.0.0.0
      EOF
      systemctl enable -q mariadb
      systemctl restart mariadb
      pw=$(lab_sql_string "$password" mysql)
      # GRANT … IDENTIFIED BY (not ALTER USER, which MariaDB 10.1 on Ubuntu 18.04 lacks) also sets the
      # password of a user that already exists.
      mariadb <<EOF
      CREATE USER IF NOT EXISTS '$username'@'%' IDENTIFIED BY $pw;
      GRANT ALL ON *.* TO '$username'@'%' IDENTIFIED BY $pw WITH GRANT OPTION;
      EOF
      if [ "$sample_data" = yes ]; then
        mariadb --default-character-set=utf8mb4 </opt/lab-deploy/chinook/Chinook_MySql.sql
      fi

- id: mysql
  name: MySQL
  category: Databases
  description: MySQL 8.4, reachable from the network, with the machine's user able to do anything in it. Optionally filled with dummy data.
  ports: [3306]
  password: true
  notes:
    - "Connect to {ip} port 3306 as {username}, with the machine's password, e.g. mysql -h {ip} -u {username} -p."
    - text: "Dummy data is in the database Chinook: 11 tables (Artist, Album, Track, Customer, Invoice…), e.g. SELECT count(*) FROM Track; gives 3503."
      when: {sample_data: ["yes"]}
  options:
    - *sample_data
  debian:
    # None baked in: it can't be alongside MariaDB, which the template has for WordPress and Nextcloud.
    # prepare.sh's bake_mysql keeps its packages in /opt/lab-deploy/mysql; installed in MariaDB's place.
    packages: []
    script: |
      export DEBIAN_FRONTEND=noninteractive
      if ! dpkg-query -W -f '${Status}' mysql-server 2>/dev/null | grep -q 'ok installed'; then
        [ -d /opt/lab-deploy/mysql ] || { echo "This template has no MySQL packages: rebuild it with today's prepare.sh."; exit 1; }
        # MariaDB's data isn't MySQL's: put it aside, and MySQL starts its own.
        systemctl disable -q --now mariadb 2>/dev/null || true
        if [ -d /var/lib/mysql ]; then mv /var/lib/mysql "/var/lib/mysql.mariadb.$(date +%s)"; fi
        # MariaDB's settings (which MySQL can't read) are what my.cnf points at while mariadb-common is
        # installed, and MySQL starts as it's installed: the plain fallback until then, MySQL's after.
        has_my_cnf() { update-alternatives --query my.cnf >/dev/null 2>&1; }
        if has_my_cnf; then update-alternatives --quiet --set my.cnf /etc/mysql/my.cnf.fallback; fi
        mkdir -p /opt/lab-deploy/mysql/partial
        # From the kept packages (with no internet, only from them); apt takes MariaDB out.
        apt-get install -yq -o Dir::Cache::archives=/opt/lab-deploy/mysql -o Dpkg::Options::=--force-confold mysql-server
        if has_my_cnf; then update-alternatives --quiet --set my.cnf /etc/mysql/mysql.cnf; fi
      fi
      # Reachable from the network. In Ubuntu's own settings, as they're read after any file of ours.
      sed -i -E 's/^(\s*bind-address\s*=).*/\1 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf
      grep -Eq '^\s*bind-address\s*=\s*0\.0\.0\.0' /etc/mysql/mysql.conf.d/mysqld.cnf ||
        printf '[mysqld]\nbind-address = 0.0.0.0\n' >>/etc/mysql/mysql.conf.d/mysqld.cnf
      systemctl enable -q mysql
      systemctl restart mysql
      pw=$(lab_sql_string "$password" mysql)
      mysql <<EOF
      CREATE USER IF NOT EXISTS '$username'@'%' IDENTIFIED BY $pw;
      ALTER USER '$username'@'%' IDENTIFIED BY $pw;
      GRANT ALL ON *.* TO '$username'@'%' WITH GRANT OPTION;
      EOF
      if [ "$sample_data" = yes ]; then
        mysql --default-character-set=utf8mb4 </opt/lab-deploy/chinook/Chinook_MySql.sql
      fi

- id: sqlite
  name: SQLite
  category: Databases
  description: The sqlite3 command-line tool. SQLite has no server; with dummy data, a database file in the user's home folder.
  notes:
    - "Sign in over SSH and run sqlite3 with a file, e.g. sqlite3 lab.db (it's made when you first write to it)."
    - text: "Dummy data is in ~/chinook.db: sqlite3 chinook.db, then .tables, or SELECT count(*) FROM Track; gives 3503."
      when: {sample_data: ["yes"]}
  options:
    - *sample_data
  debian:
    packages: [sqlite3]
    script: |
      if [ "$sample_data" = yes ]; then
        home=$(getent passwd "$username" | cut -d: -f6)
        install -o "$username" -g "$(id -gn "$username")" -m 644 /opt/lab-deploy/chinook/Chinook_Sqlite.sqlite "$home/chinook.db"
      fi

- id: mail
  name: Mail server
  category: Mail
  description: Postfix and Dovecot (IMAP, POP3, submission), with Roundcube webmail as the machine's website. Mail is delivered on this machine only.
  ports: [25, 80, 110, 143, 443, 587, 993, 995]
  password: true
  links:
    - text: "http://{ip}/"
      when: {https: ["no"]}
    - text: "https://{ip}/"
      when: {https: ["yes"]}
  notes:
    - "Mailboxes: {username}@{domain}, and any test users ({users}). Sign in to webmail, IMAP or POP3 with the machine's password."
    - "IMAP 143 (STARTTLS) and 993, POP3 110 and 995, SMTP submission 587, all with a self-signed certificate for {domain}."
  options:
    - id: domain
      label: Mail domain
      help: The domain mail is for, e.g. mail.lab.example. Mail to user@domain is delivered here.
      type: hostname
      default: "{fqdn}"
    - id: https
      label: Webmail over HTTPS
      help: Roundcube on https:// (http:// sends people there), with the mail domain's certificate.
      type: boolean
      default: "no"
    - id: users
      label: Test users
      help: More mailboxes, separated by commas, e.g. alice, bob. Each gets the machine's password.
      type: text
      pattern: "[a-z][a-z0-9-]{0,30}(\\s*,\\s*[a-z][a-z0-9-]{0,30}){0,9}"
  debian:
    packages: [postfix, dovecot-imapd, dovecot-pop3d, roundcube, roundcube-sqlite3, apache2, libapache2-mod-php, openssl]
    script: |
      lab_cert "$domain"
      echo "$domain" >/etc/mailname
      # Postfix: mail for the domain is delivered to Maildir in each user's home; sending needs a
      # sign-in (through Dovecot), except from this machine (Roundcube).
      # shellcheck disable=SC2016 # $mydomain is Postfix's, not the shell's
      postconf -e "myhostname = $domain" "mydomain = $domain" 'myorigin = $mydomain' \
        "mydestination = \$myhostname, $hostname, localhost.\$mydomain, localhost" \
        'inet_interfaces = all' 'inet_protocols = ipv4' 'home_mailbox = Maildir/' \
        "smtpd_tls_cert_file = $LAB_CERT" "smtpd_tls_key_file = $LAB_KEY" 'smtpd_tls_security_level = may' \
        'smtpd_sasl_type = dovecot' 'smtpd_sasl_path = private/auth' 'smtpd_sasl_auth_enable = yes' \
        'smtpd_relay_restrictions = permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination'
      postconf -M 'submission/inet=submission inet n - y - - smtpd'
      postconf -P 'submission/inet/syslog_name=postfix/submission' 'submission/inet/smtpd_tls_security_level=encrypt' \
        'submission/inet/smtpd_sasl_auth_enable=yes' 'submission/inet/smtpd_client_restrictions=permit_sasl_authenticated,reject'
      # Dovecot: the same Maildir, and sign-ins checked for Postfix. Its certificate is where its own
      # config looks (it opens that file even when told another): this machine's. Where the mail is
      # is said differently by 2.4 (Ubuntu 26.04, Debian 13) and 2.3 (Ubuntu 22.04 and 24.04, Debian 12).
      ln -sf "$LAB_CERT" /etc/dovecot/private/dovecot.pem
      ln -sf "$LAB_KEY" /etc/dovecot/private/dovecot.key
      case $(dovecot --version) in
      2.3*) maildir='mail_location = maildir:~/Maildir' ;;
      *) maildir=$(printf '%s\n' 'mail_driver = maildir' 'mail_path = %{home}/Maildir' 'mail_inbox_path = %{home}/Maildir') ;;
      esac
      cat >/etc/dovecot/conf.d/99-lab.conf <<EOF
      # Written by the lab panel's mail extra.
      $maildir
      service auth {
        unix_listener /var/spool/postfix/private/auth {
          mode = 0660
          user = postfix
          group = postfix
        }
      }
      EOF
      # Test users: mailboxes with the machine's password.
      IFS=', ' read -ra more <<<"$users"
      for user in "${more[@]}"; do
        [ -n "$user" ] || continue
        id "$user" >/dev/null 2>&1 || useradd -m -s /bin/bash "$user"
        echo "$user:$password" | chpasswd
      done
      # Roundcube: a key of this machine's own, and mail sent through Postfix here.
      key=$(openssl rand -hex 12)
      cat >>/etc/roundcube/config.inc.php <<EOF

      // Lab panel: this machine's own key, and mail sent through its Postfix.
      \$config['des_key'] = '$key';
      \$config['imap_host'] = 'localhost:143';
      \$config['smtp_host'] = 'localhost:25';
      \$config['smtp_user'] = '';
      \$config['smtp_pass'] = '';
      EOF
      # Ubuntu's Roundcube 1.6.11 and PHP 8.5 both define array_first(), so Roundcube won't load.
      # Until the package has upstream's fix, do what it does: keep Roundcube's only where PHP has none.
      boot=/usr/share/roundcube/program/lib/Roundcube/bootstrap.php
      if grep -q '^function array_first(' "$boot" && php -r 'exit(function_exists("array_first") ? 0 : 1);'; then
        awk '/^function array_first\(/ { print "if (!function_exists(\"array_first\")) {"; inside = 1 }
          { print } inside && /^}$/ { print "}"; inside = 0 }' "$boot" >"$boot.lab"
        mv "$boot.lab" "$boot"
      fi
      # Roundcube as the website. The package's own config (its folder's rules) stays on.
      a2enconf -q roundcube
      lab_apache_site /var/lib/roundcube/public_html "$https" "$domain" </dev/null
      systemctl enable -q postfix dovecot
      # Postfix first: its first start makes the folder Dovecot puts its sign-in socket in.
      systemctl restart postfix
      systemctl restart dovecot

- id: iredmail
  name: iRedMail
  category: Mail
  description: "iRedMail 1.8.8: a full mail server (Postfix, Dovecot, Amavis with SpamAssassin, iRedAPD) with Roundcube webmail and the iRedAdmin web admin, mailboxes in MariaDB. Installed as the machine starts: about 10 minutes."
  ports: [25, 80, 110, 143, 443, 465, 587, 993, 995, 4190]
  password: true
  setupMinutes: 20
  links: ["https://{ip}/mail/", "https://{ip}/iredadmin/"]
  notes:
    - "Mailboxes: {username}@{domain}, postmaster@{domain} and any test users ({users}), each with the machine's password. {username}@{domain} and postmaster@{domain} are iRedAdmin's administrators."
    - "IMAP 143 (STARTTLS) and 993, POP3 110 and 995, SMTP submission 587 and 465, all with a self-signed certificate. The server's name is {hostname}.{domain}."
    - "ClamAV is installed but off: offline, it has no virus definitions."
  options:
    - id: domain
      label: Mail domain
      help: The domain mail is for, e.g. lab.example. The server is named <machine>.<domain>.
      type: hostname
      default: lab.example
    - id: users
      label: Test users
      help: More mailboxes, separated by commas, e.g. alice, bob. Each gets the machine's password.
      type: text
      pattern: "[a-z][a-z0-9-]{0,30}(\\s*,\\s*[a-z][a-z0-9-]{0,30}){0,9}"
  debian:
    # Its installer and the files it fetches, in /opt/lab-deploy/iredmail (prepare.sh's bake_iredmail),
    # with the packages it installs kept there, not installed: run as it is here, it installs from
    # those alone, with no internet. Ubuntu 24.04 and 26.04, Debian 12 and 13 (what 1.8.8 supports).
    packages: [dialog, wget]
    script: |
      src=/opt/lab-deploy/iredmail
      [ -d "$src/iRedMail" ] || { echo "This template has no iRedMail: rebuild it with today's prepare.sh."; exit 1; }
      fqdn=$hostname.$domain
      # Its name, which the installer reads (and Postfix uses), in /etc/hosts too.
      sed -i '/^127\.0\.1\.1\s/d' /etc/hosts
      echo "127.0.1.1 $fqdn $hostname" >>/etc/hosts
      # The installer, from a copy (it writes its settings and progress there). Its downloads are
      # done (status_get_all): it goes straight to installing, from the kept packages only.
      rm -rf /root/iRedMail
      cp -a "$src/iRedMail" /root/iRedMail
      cd /root/iRedMail
      mkdir -p runtime
      echo 'export status_get_all="DONE"' >runtime/install.status
      rand() { openssl rand -hex 16; }
      # Its settings, as its own setup dialog would write them. MariaDB, nginx, Roundcube and
      # iRedAdmin; not SOGo, netdata (they'd need the internet) or Fail2ban (which would ban whoever
      # practises on it). Its postmaster's password is a random one here, then the machine's below:
      # the installer passes it on unquoted.
      cat >config <<EOF
      export STORAGE_BASE_DIR='/var/vmail'
      export WEB_SERVER='NGINX'
      export BACKEND_ORIG='MARIADB'
      export BACKEND='MYSQL'
      export FIRST_DOMAIN='$domain'
      export DOMAIN_ADMIN_PASSWD_PLAIN='$(rand)'
      export USE_IREDADMIN='YES'
      export USE_ROUNDCUBE='YES'
      export USE_SOGO='NO'
      export USE_NETDATA='NO'
      export USE_FAIL2BAN='NO'
      EOF
      for setting in VMAIL_DB_BIND_PASSWD VMAIL_DB_ADMIN_PASSWD MLMMJADMIN_API_AUTH_TOKEN NETDATA_DB_PASSWD \
        MYSQL_ROOT_PASSWD AMAVISD_DB_PASSWD IREDADMIN_DB_PASSWD RCM_DB_PASSWD SOGO_DB_PASSWD \
        SOGO_SIEVE_MASTER_PASSWD IREDAPD_DB_PASSWD FAIL2BAN_DB_PASSWD; do
        echo "export $setting='$(rand)'" >>config
      done
      # Its marker that the file is complete: without it, the installer asks everything instead.
      echo '#EOF' >>config
      chmod 400 config
      IREDMAIL_HOSTNAME=$fqdn APTGET="apt-get --no-download -o Dir::Cache::archives=$src/debs" \
        AUTO_USE_EXISTING_CONFIG_FILE=y AUTO_INSTALL_WITHOUT_CONFIRM=y AUTO_CLEANUP_REMOVE_SENDMAIL=y \
        AUTO_CLEANUP_REPLACE_FIREWALL_RULES=n AUTO_CLEANUP_RESTART_FIREWALL=n AUTO_CLEANUP_REPLACE_MYSQL_CONFIG=y \
        bash iRedMail.sh </dev/null
      grep -q 'status_cleanup="DONE"' runtime/install.status || { echo "iRedMail's installer didn't finish: /root/iRedMail/runtime/install.log"; exit 1; }
      # No ClamAV: Amavis skips virus scanning instead of holding mail back for want of a scanner.
      systemctl disable -q --now clamav-daemon clamav-freshclam 2>/dev/null || true
      cat >>/etc/amavis/conf.d/50-user <<'EOF'

      # Lab panel: no ClamAV (no virus definitions offline), so no virus scanning.
      @bypass_virus_checks_maps = (1);
      @av_scanners = ();
      @av_scanners_backup = ();
      1;
      EOF
      # Mailboxes with the machine's password: the user (an administrator, like postmaster) and the
      # test users. As iRedMail's tools/create_mail_user_SQL.sh makes them.
      hash=$(lab_sql_string "$(doveadm pw -s SSHA512 -p "$password")" mysql)
      d=$(lab_sql_string "$domain" mysql)
      {
        echo "UPDATE mailbox SET password = $hash WHERE username = 'postmaster@$domain';"
        IFS=', ' read -ra more <<<"$users"
        for user in "$username" "${more[@]}"; do
          [ -n "$user" ] || continue
          u=$(lab_sql_string "$user@$domain" mysql)
          echo "INSERT IGNORE INTO mailbox (username, password, name, storagebasedirectory, storagenode, maildir, quota, domain, active, passwordlastchange, created)"
          echo "  VALUES ($u, $hash, $(lab_sql_string "$user" mysql), '/var/vmail', 'vmail1', $(lab_sql_string "$domain/$user/" mysql), 1024, $d, 1, NOW(), NOW());"
          echo "INSERT IGNORE INTO forwardings (address, forwarding, domain, dest_domain, is_forwarding) VALUES ($u, $u, $d, $d, 1);"
        done
        u=$(lab_sql_string "$username@$domain" mysql)
        echo "UPDATE mailbox SET isadmin = 1, isglobaladmin = 1 WHERE username = $u;"
        echo "INSERT IGNORE INTO domain_admins (username, domain, created, active) VALUES ($u, 'ALL', NOW(), 1);"
      } | mysql vmail
      # Its installer asks for a restart to start everything as configured: the services instead.
      systemctl daemon-reload
      for unit in mariadb postfix dovecot amavis iredapd iredadmin mlmmjadmin nginx $(systemctl list-unit-files --no-legend 'php*-fpm.service' | awk '{print $1}'); do
        systemctl cat "$unit" >/dev/null 2>&1 || continue
        systemctl enable -q "$unit"
        systemctl restart "$unit"
      done
      lab_wait_http https://127.0.0.1/mail/

- id: zimbra
  name: Zimbra
  category: Mail
  description: "Zimbra Collaboration 8.8.15, open source: mail, calendar and contacts, with its web client and admin console. The GA build (4179) with its last patch, P47 (2024). Set up as the machine starts: about 25 minutes."
  ports: [25, 80, 110, 143, 443, 465, 587, 993, 995, 7071]
  password: true
  setupMinutes: 40
  links: ["https://{ip}/", "https://{ip}:7071/"]
  notes:
    - "Sign in to webmail and to the admin console (port 7071) as {username}@{domain}, with the machine's password. Test users ({users}) have it too."
    - "The server's name is {hostname}.{domain}. Its certificate is self-signed; antivirus is off (offline, ClamAV has no virus definitions)."
  options:
    - id: domain
      label: Mail domain
      help: The domain mail is for, e.g. lab.example. The server is named <machine>.<domain>.
      type: hostname
      default: lab.example
    - id: users
      label: Test users
      help: More mailboxes, separated by commas, e.g. alice, bob. Each gets the machine's password.
      type: text
      pattern: "[a-z][a-z0-9-]{0,30}(\\s*,\\s*[a-z][a-z0-9-]{0,30}){0,9}"
  debian:
    # Zimbra is installed in its template, not configured (scripts/template/zimbra/prepare-zimbra.sh).
    packages: []
    script: |
      [ -x /opt/zimbra/libexec/zmsetup.pl ] || { echo "This template has no Zimbra: use the Zimbra template."; exit 1; }
      fqdn=$hostname.$domain
      # Its name, with this machine's address (Zimbra won't take a loopback one), in /etc/hosts.
      sed -i "/\s$hostname\(\s\|\$\)/d" /etc/hosts
      echo "$(lab_ip) $fqdn $hostname" >>/etc/hosts
      # Its settings: one server with everything, its user the administrator. Every address made from the
      # domain is given, as the defaults are made from the machine's name before these are read. The
      # password is a random one here (the file can't hold every character), the machine's below.
      config=$(mktemp)
      cat >"$config" <<EOF
      HOSTNAME=$fqdn
      LDAPHOST=$fqdn
      SMTPHOST=$fqdn
      DOCREATEDOMAIN=yes
      CREATEDOMAIN=$domain
      zimbraDefaultDomainName=$domain
      DOCREATEADMIN=yes
      CREATEADMIN=$username@$domain
      CREATEADMINPASS=$(openssl rand -hex 16)
      AVUSER=$username@$domain
      AVDOMAIN=$domain
      SMTPSOURCE=$username@$domain
      SMTPDEST=$username@$domain
      zimbraVersionCheckNotificationEmail=$username@$domain
      zimbraVersionCheckNotificationEmailFrom=$username@$domain
      TRAINSASPAM=spam.$(openssl rand -hex 4)@$domain
      TRAINSAHAM=ham.$(openssl rand -hex 4)@$domain
      VIRUSQUARANTINE=virus-quarantine.$(openssl rand -hex 4)@$domain
      RUNAV=no
      VERSIONUPDATECHECK=FALSE
      zimbraIPMode=ipv4
      STARTSERVERS=yes
      EOF
      # Configuring starts everything but its web application (mailboxd), which the GA build can't run on
      # today's Java: the patch kept in the template (P47) can. Then everything restarts on it.
      /opt/zimbra/libexec/zmsetup.pl -c "$config" </dev/null || true
      rm -f "$config"
      su - zimbra -c 'zmprov -l gs "$(zmhostname)" zimbraServiceEnabled' | grep -q mailbox || { echo "Zimbra's configuring didn't finish: /opt/zimbra/log/zmsetup.*.log"; exit 1; }
      # shellcheck disable=SC2046 # a list of package names
      DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-download -o Dir::Cache::archives=/opt/lab-deploy/zimbra-patch \
        $(cat /opt/lab-deploy/zimbra-patch/PACKAGES) >/var/log/lab-deploy/zimbra-patch.log 2>&1
      zm() { su - zimbra -c "$(printf '%q ' "$@")"; }
      # Straight to LDAP (-l): its web application only runs once restarted on the patch, below.
      # Mail for this server's own mailboxes goes by /etc/hosts, not DNS (the lab has none for it).
      zm zmprov -l mcf zimbraMtaLmtpHostLookup native
      zm zmprov -l sp "$username@$domain" "$password"
      IFS=', ' read -ra more <<<"$users"
      for user in "${more[@]}"; do
        [ -n "$user" ] || continue
        zm zmprov -l ca "$user@$domain" "$password"
      done
      zm zmcontrol restart
      systemctl enable -q zimbra 2>/dev/null || true
      lab_wait_http https://127.0.0.1/ 600

- id: ftp
  name: FTP
  category: File transfer
  description: vsftpd, for the machine's user, in its home folder. Optionally over TLS (FTPS).
  ports: [21]
  notes:
    - "Connect to {ip} port 21 as {username}, with the machine's password. Passive mode uses ports 40000-40100."
  options:
    - id: tls
      label: Use TLS (FTPS)
      help: Explicit FTPS with a self-signed certificate; plain FTP sign-ins are then refused.
      type: boolean
      default: "no"
  debian:
    packages: [vsftpd, openssl]
    script: |
      cat >/etc/vsftpd.conf <<EOF
      # Written by the lab panel's FTP extra.
      listen=YES
      listen_ipv6=NO
      anonymous_enable=NO
      local_enable=YES
      write_enable=YES
      local_umask=022
      chroot_local_user=YES
      allow_writeable_chroot=YES
      pasv_enable=YES
      pasv_min_port=40000
      pasv_max_port=40100
      secure_chroot_dir=/var/run/vsftpd/empty
      pam_service_name=vsftpd
      utf8_filesystem=YES
      EOF
      if [ "$tls" = yes ]; then
        lab_cert
        cat >>/etc/vsftpd.conf <<EOF
      ssl_enable=YES
      rsa_cert_file=$LAB_CERT
      rsa_private_key_file=$LAB_KEY
      force_local_logins_ssl=YES
      force_local_data_ssl=YES
      require_ssl_reuse=NO
      EOF
      fi
      systemctl enable -q vsftpd
      systemctl restart vsftpd

- id: desktop
  name: Desktop (XFCE)
  category: Remote desktop
  description: An XFCE desktop for the machine's user, over RDP (xrdp), VNC (TigerVNC), or both.
  ports: [3389, 5901]
  password: true
  minMemoryGB: 2
  notes:
    - text: "RDP: connect to {ip} as {username}, with the machine's password."
      when: {protocol: [rdp, both]}
    - text: "VNC: connect to {ip}:5901. Its password is the first 8 characters of the machine's (VNC allows no more)."
      when: {protocol: [vnc, both]}
  options:
    - id: protocol
      label: Connect with
      type: choice
      default: both
      choices:
        - {value: rdp, label: RDP (port 3389)}
        - {value: vnc, label: VNC (port 5901)}
        - {value: both, label: Both}
  debian:
    packages: [xfce4-session, xfwm4, xfce4-panel, xfdesktop4, xfce4-terminal, thunar, xfce4-settings, xfce4-notifyd, dbus-x11, xrdp, xorgxrdp, tigervnc-standalone-server, tigervnc-tools, ssl-cert, fonts-dejavu-core, adwaita-icon-theme]
    script: |
      home=$(getent passwd "$username" | cut -d: -f6)
      group=$(id -gn "$username")
      if [ "$protocol" != vnc ]; then
        # On a D-Bus session of its own, so it can run alongside the VNC desktop.
        echo "dbus-launch --exit-with-session xfce4-session" >"$home/.xsession"
        chown "$username:$group" "$home/.xsession"
        # xrdp's certificate and keys, of this machine's own (clean.sh removed the template's).
        make-ssl-cert generate-default-snakeoil --force-overwrite
        xrdp-keygen xrdp auto >/dev/null
        systemctl enable -q xrdp
        systemctl restart xrdp
        lab_open 3389/tcp
      fi
      if [ "$protocol" != rdp ]; then
        # VNC passwords are at most 8 characters: the first 8 of the machine's.
        config=$home/.config/tigervnc
        install -d -o "$username" -g "$group" -m 700 "$home/.config" "$config"
        printf '%s\n' "${password:0:8}" | vncpasswd -f >"$config/passwd"
        printf 'session=xfce\nlocalhost=no\ngeometry=1600x900\n' >"$config/config"
        chown "$username:$group" "$config/passwd" "$config/config"
        chmod 600 "$config/passwd"
        grep -qx ":1=$username" /etc/tigervnc/vncserver.users || echo ":1=$username" >>/etc/tigervnc/vncserver.users
        systemctl enable -q tigervncserver@:1
        systemctl restart tigervncserver@:1
        lab_open 5901/tcp
      fi

# Container apps: Docker images already in the template (prepare.sh's DOCKER_IMAGES, pinned), each run
# by lab_docker as the machine's whole website, so they work offline. Debian family.

- id: docker
  name: Docker
  category: Developer tools
  description: Docker Engine, with the machine's user allowed to use it (the docker group). No images; pull or build your own.
  notes:
    - "Sign in again after the first sign-in for {username} to be in the docker group, e.g. docker run hello-world."
  debian:
    packages: [docker.io]
    script: |
      systemctl enable -q --now docker
      usermod -aG docker "$username"

- id: python
  name: Python
  category: Developer tools
  description: A Python of your choice, from 2.7 to 3.15, beside the system's own (which the system's tools keep using). With pip.
  notes:
    - "python{version} and pip{version}, in /opt/python/{version}. For a project of its own: python{version} -m venv ~/venv."
    - text: "It's also python and pip (python2 and pip2, or python3 and pip3, by its version)."
      when: {make_default: ["yes"]}
  options:
    - id: version
      label: Version
      type: choice
      default: "3.14"
      choices:
        - {value: "2.7", label: "2.7 (end of life 2020; for old tools and exploits)"}
        - {value: "3.8", label: "3.8 (end of life)"}
        - {value: "3.9", label: "3.9 (end of life)"}
        - {value: "3.10", label: "3.10"}
        - {value: "3.11", label: "3.11"}
        - {value: "3.12", label: "3.12"}
        - {value: "3.13", label: "3.13"}
        - {value: "3.14", label: "3.14"}
        - {value: "3.15", label: "3.15 (newest)"}
    - id: make_default
      label: Make it the default
      help: python and pip run this one too, ahead of the system's (python3 too, for a 3.x). The system's own tools keep theirs.
      type: boolean
      default: "no"
  debian:
    # Each version's files are in /opt/lab-deploy/python (prepare.sh's bake_python): 3.x as
    # python-build-standalone builds them (what uv installs), 2.7 built for the template. These
    # packages are what 2.7 was built with, and what pip needs to build C extensions.
    packages: [build-essential, zlib1g-dev, libbz2-dev, libreadline-dev, libsqlite3-dev, libffi-dev, libncurses-dev]
    script: |
      file=/opt/lab-deploy/python/$version.tar.gz
      [ -s "$file" ] || { echo "This template has no Python $version: rebuild it with today's prepare.sh."; exit 1; }
      rm -rf "/opt/python/$version"
      mkdir -p "/opt/python/$version"
      tar -xzf "$file" -C "/opt/python/$version" --strip-components=1
      major=${version%%.*}
      link() { ln -sf "/opt/python/$version/bin/$1" "/usr/local/bin/$2"; }
      link "python$version" "python$version"
      link "pip$version" "pip$version"
      if [ "$make_default" = yes ]; then
        link "python$version" python
        link "pip$version" pip
        link "python$version" "python$major"
        link "pip$version" "pip$major"
      fi
      "/usr/local/bin/python$version" -c 'import ssl, sqlite3, zlib, ctypes'
