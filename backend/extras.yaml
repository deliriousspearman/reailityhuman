  ports: [443]
  links: ["https://{ip}/"]
  notes:
    - "Create an account on the first visit; the certificate is self-signed. Bitwarden's apps and browser extensions sign in with https://{ip} as a self-hosted server."
  debian:
    packages: [docker.io]
