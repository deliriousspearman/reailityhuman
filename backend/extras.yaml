# Optional services people can tick when they deploy a machine. A template offers the ones listed
# under its `extras` in templates.yaml; their packages are already in the template (installed,
# switched off, by scripts/template/prepare.sh), so nothing is downloaded at deploy and it works
# without internet. On the machine's first boot, cloud-init runs each chosen extra's `script` for
# the template's family.
#
#   category   the heading it's listed under on the deploy form, e.g. Web servers; extras of a
#              category are listed in this file's order, and categories in order of first use
#   minMemoryGB  optional: the least memory a machine needs for it (e.g. a desktop)
#   ports      the ports it listens on. Extras that would share one can't be chosen together.
#   provides   apache, for the extras that set Apache up; web apps can run inside them.
#   uses       apache, for web apps that run inside Apache at their own path: they can be combined
#              with each other and with an extra that provides Apache, but not with other servers
#              on Apache's ports (80, 443).
#   links      shown on the machine's page, once it has an address; and
#   notes      sentences shown with them, e.g. how to sign in. In both, {ip} is its address,
#              {username} its user, {hostname} its name, and {<option id>} that option's value.
#   options    fields shown when the extra is ticked. Each value reaches the script as a shell
#              variable of the same name, already validated and quoted; scripts never get raw input.
#                type      hostname: a DNS name, optionally "*."-prefixed; text: matched by `pattern`;
#                          choice: one of `choices` ([{value, label}]); boolean: "yes" or "no"
#                default   used when it's left blank. {hostname} is the machine's name, {fqdn} the
#                          name plus MACHINE_DOMAIN (just the name when that's empty)
#   <family>   debian or rhel: `packages` (must be in prepare.sh's EXTRA_PACKAGES_<FAMILY>, which a
#              test checks) and `script`, run with bash -e as root. $hostname is always set, and
#              the helpers in extras.py's LIB are there: lab_cert (a self-signed certificate),
#              lab_apache and lab_apache_conf (web apps inside Apache), lab_open (firewalld), lab_ip.
#              windows: just `script`, PowerShell run as SYSTEM with $ErrorActionPreference = 'Stop'
#              (any PowerShell error fails the extra). A program that fails doesn't stop it, though:
#              after running one, check it, e.g. `if ($LASTEXITCODE) { throw "x.exe failed" }`.
#              Options and $hostname are PowerShell variables. Windows roles and features install
#              from files already on the machine, so no packages are baked into the template.
#              An extra that needs a restart to finish exits with 3010 ("done, restart needed"), e.g.
#              `if ((Install-WindowsFeature X).RestartNeeded -eq 'Yes') { exit 3010 }`: Windows
#              restarts and the extras after it carry on (3 restarts at most, for all of them).

- id: nginx
  name: nginx
  category: Web servers
  description: Web server on port 80, with a page showing the machine's name.
  ports: [80]
  links: ["http://{ip}/"]
  debian:
    packages: [nginx]
    script: |
      echo "<h1>$hostname</h1><p>nginx, deployed by the lab panel.</p>" >/var/www/html/index.html
      systemctl enable --now nginx
  rhel:
    packages: [nginx]
    script: |
      echo "<h1>$hostname</h1><p>nginx, deployed by the lab panel.</p>" >/usr/share/nginx/html/index.html
      systemctl enable --now nginx
      lab_open 80/tcp

- id: apache
  name: Apache
  category: Web servers
  description: Apache web server on port 80, with a page showing the machine's name.
  ports: [80]
  provides: apache
  links: ["http://{ip}/"]
  debian:
    packages: [apache2]
    script: |
      echo "<h1>$hostname</h1><p>Apache, deployed by the lab panel.</p>" >/var/www/html/index.html
      systemctl enable --now apache2
  rhel:
    packages: [httpd]
    script: |
      echo "<h1>$hostname</h1><p>Apache, deployed by the lab panel.</p>" >/var/www/html/index.html
      systemctl enable --now httpd
      lab_open 80/tcp

- id: apache-https
  name: Apache + HTTPS
  category: Web servers
  description: Apache on ports 80 and 443, with a self-signed certificate made for this machine.
  ports: [80, 443]
  provides: apache
  links: ["http://{ip}/", "https://{ip}/"]
  options:
    - id: domain
      label: Domain name
      help: The name the certificate is for, e.g. intranet.lab.example. The machine's name and address are always on it too.
      type: hostname
      default: "{fqdn}"
  debian:
    packages: [apache2, openssl]
    script: |
      lab_cert "$domain"
      sed -i -e "s#^\(\s*SSLCertificateFile\s\).*#\1$LAB_CERT#" \
             -e "s#^\(\s*SSLCertificateKeyFile\s\).*#\1$LAB_KEY#" \
        /etc/apache2/sites-available/default-ssl.conf
      echo "<h1>$domain</h1><p>Apache over HTTPS, deployed by the lab panel.</p>" >/var/www/html/index.html
      a2enmod -q ssl
      a2ensite -q default-ssl
      lab_apache
  rhel:
    packages: [httpd, mod_ssl, openssl]
    script: |
      lab_cert "$domain"
      cp "$LAB_CERT" /etc/pki/tls/certs/localhost.crt
      install -m 600 "$LAB_KEY" /etc/pki/tls/private/localhost.key
      echo "<h1>$domain</h1><p>Apache over HTTPS, deployed by the lab panel.</p>" >/var/www/html/index.html
      lab_apache
      lab_open 80/tcp 443/tcp

- id: iis
  name: IIS
  category: Web servers
  description: Microsoft's web server on port 80, with a page showing the machine's name.
  ports: [80]
  links: ["http://{ip}/"]
  windows:
    script: |
      if (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue) {
        Install-WindowsFeature -Name Web-Server -IncludeManagementTools | Out-Null
      } else {
        # Windows 10/11: an optional feature rather than a server role.
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebServerRole, IIS-WebServer -All -NoRestart | Out-Null
      }
      Set-Content -Path C:\inetpub\wwwroot\index.html -Encoding ascii -Value "<h1>$hostname</h1><p>IIS, deployed by the lab panel.</p>"
