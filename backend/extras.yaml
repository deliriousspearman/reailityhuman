      lab_cert
      lab_docker vaultwarden -p 443:80 -v vaultwarden:/data -v /etc/ssl/lab-deploy:/ssl:ro \
        -e ROCKET_TLS="{certs=\"/ssl/${LAB_CERT##*/}\",key=\"/ssl/${LAB_KEY##*/}\"}" \
        -e DOMAIN="https://$(lab_ip)" vaultwarden/server:1.37.4-alpine
      lab_wait_http https://127.0.0.1/

- id: gitea
  name: Gitea
