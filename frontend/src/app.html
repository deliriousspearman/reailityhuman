<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Apply the saved theme before the page draws, so it doesn't flash. "auto" (or nothing
			// saved) follows the system setting. See src/lib/theme.svelte.ts and src/lib/palettes.ts;
			// LIGHT lists the light palettes (any other saved name is dark).
			try {
				const LIGHT = ['light', 'latte', 'solarlight'];
				const saved = localStorage.getItem('labs-theme');
				const root = document.documentElement;
				if (saved && /^[a-z0-9]+$/.test(saved)) {
					root.dataset.theme = LIGHT.includes(saved) ? 'light' : 'dark';
					if (saved !== 'light' && saved !== 'dark') root.dataset.palette = saved;
				} else {
					root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
