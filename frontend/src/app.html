<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Apply the saved theme before the page draws, so it doesn't flash. "auto" (or nothing
			// saved) follows the system setting. See src/lib/theme.svelte.ts.
			try {
				const saved = localStorage.getItem('labs-theme');
				const dark = matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
				document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
