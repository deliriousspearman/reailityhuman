# How the offline install (deploy/install.sh) builds each template, and what each build needs.
# docs/offline-install.md explains the install; docs/build-templates.md the builds themselves.
#
# Each [[template]]:
#   id         the name the config's [templates] build list and the report use
#   catalogue  its entry in backend/templates.yaml: "<template> <version>"
#   build      the command, from the repo's root (packer/build.sh or an import script)
#   vars       Packer variables, -var name=value; a value with a {placeholder} is only passed when
#              the placeholder has a value:
#                {mirror.<name>}       the config's [mirrors] <name>; {mirror.<name>.host} and
#                                      {mirror.<name>.path} its host and path, for debian-installer
#                {media}               the media folder's address (the installer serves it)
#                {media_dir}           the media folder's path, for the Windows builds' CD
#                {http_ip}             this server's address on the VM network
#   env        environment for import scripts, with the same placeholders
#   isos       what must be in the datastore's ISO folder: names in scripts/isos/isos.txt, or
#              file:<name> for an ISO made from one (Proxmox's -auto, VyOS's own)
#   mirrors    "<mirror>:<path>": the mirror, and a file it must have for this release
#   media      files the build reads from the media folder, offline
#   extras     true: Linux, built with the catalogue's extras that can be built (-var extras=);
#              "windows": Office and SQL Server's files decide outlook and mssql
#   extras_var the Packer variable for that list, when it isn't extras (Ubuntu Desktop: desktop_extras)
#   needs      templates built first (Parrot's base VM)
#   internet   set when the build still downloads something no mirror or media option covers yet:
#              offline, it's skipped and the reason is shown
#   eval_days  an evaluation licence's length, for the report

# Ubuntu (autoinstall; 18.04 and 16.04 with debian-installer)
[[template]]
id = "ubuntu-26.04"
catalogue = "ubuntu 26.04"
build = "packer/build.sh ubuntu"
vars = ["apt_mirror={mirror.ubuntu}", "media_url={media}", "zabbix_mirror={mirror.zabbix}"]
isos = ["ubuntu-26.04"]
mirrors = ["ubuntu:dists/resolute/Release"]
extras = true

[[template]]
id = "ubuntu-24.04"
catalogue = "ubuntu 24.04"
build = "packer/build.sh ubuntu"
vars = ["version=24.04", "iso=ubuntu-24.04.5-live-server-amd64.iso", "apt_mirror={mirror.ubuntu}", "media_url={media}", "zabbix_mirror={mirror.zabbix}", "php_mirror={mirror.php}"]
isos = ["ubuntu-24.04"]
mirrors = ["ubuntu:dists/noble/Release"]
extras = true

[[template]]
