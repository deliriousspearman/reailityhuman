env = ["MEDIA={media_dir}/images"]
media = ["images/ub1404.box"]

# What extras need from the media folder offline (the Linux ones; the Windows ones are Office's files
# and SQL Server's ISO). An extra not listed needs only the template's package mirror. The Docker
# extras, k3s and Winlogbeat aren't here: their image ISOs come from the bundle (labinstall/images.py).
[extras]
wordpress = ["linux/wordpress/latest.tar.gz", "linux/wp-cli/wp-cli.phar"]
nextcloud = ["linux/nextcloud/latest.tar.bz2"]
postgresql = ["linux/chinook"]
mariadb = ["linux/chinook"]
mysql = ["linux/chinook"]
sqlite = ["linux/chinook"]
minio = ["linux/minio/minio", "linux/minio/mc"]
python = ["linux/python/Python-2.7.18.tgz", "linux/python/openssl-1.1.1w.tar.gz"]
iredmail = ["linux/iredmail/iRedMail-1.8.8.tar.gz"]
zimbra = ["linux/zimbra/zcs-8.8.15_GA_4179.UBUNTU20_64.20211118033954.tgz"]
wazuh = ["linux/wazuh/wazuh-offline.tar.gz", "linux/wazuh/wazuh-install.sh"]
wazuh-agent = ["linux/wazuh/wazuh-agent_4.14.9-1_amd64.deb"]
outlook = ["windows/office/setup.exe"]
mssql = ["iso:sql-server-2025", "windows/chinook/Chinook_SqlServer.sql"]

# Extras whose packages come from a repository of their own: offline, built in only with its mirror
# ([mirrors] in the config); without it, left out.
[extras_mirrors]
zabbix = "zabbix"
zabbix-agent = "zabbix"

# Per-template choices (templates.yaml `choices`) that come from a repository of their own: offline,
# without its mirror, a build passing that mirror ({mirror.<name>} in its vars) leaves them out, so
# the panel's catalogue doesn't offer them (PHP 5.6 to 8.5 come from Ondřej Surý's PPA).
[choices_mirrors]
php = "php"

# Extras that can't be built without internet at all.
[extras_online_only]
nextcloud-snap = "it installs from the Snap Store"
