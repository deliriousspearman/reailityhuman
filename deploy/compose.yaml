# The panel's services on the server, in /srv/lab-deploy (copied there by deploy/deploy.sh):
# Caddy serving the built frontend and proxying /api, the API, the job worker, and PostgreSQL.
# SITE_ADDRESS comes from .env next to this file (written by deploy.sh); everything else the API and
# worker need (vCenter, database password) is in lab-deploy.env, written once on the server.
name: lab-deploy

x-backend: &backend
  image: lab-deploy-backend
  restart: unless-stopped
  env_file: lab-deploy.env

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. SITE_ADDRESS=labs.example}
    volumes:
      # The folder, not the file: deploys replace the Caddyfile, and a single-file mount would keep
      # showing the container the old one.
      - ./caddy:/etc/caddy:ro
      - ./site:/srv/site:ro
      # Caddy's internal CA and certificates: keep them, or every browser has to trust a new root.
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: lab-deploy.env
    environment:
      POSTGRES_USER: labdeploy
      POSTGRES_DB: labdeploy
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'labdeploy']
      interval: 5s
      retries: 12

  # Runs the database migrations, then serves the API on :8000 (Caddy proxies /api to it).
  api:
    <<: *backend
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/config')"]
      interval: 10s
      start_period: 30s
      retries: 6

  # Deploys, power changes and the per-minute expiry sweep. Starts once the API has migrated.
  worker:
    <<: *backend
    command: ['procrastinate', '--app=app.jobs.app', 'worker', '--concurrency=4']
    # Same image as the API, built locally by it; there's nothing to pull.
    pull_policy: never
    # On a redeploy, let running jobs (a deploy takes minutes) finish rather than killing them
    # after Docker's default 10 s. Jobs cut off anyway are failed by the sweep.
    stop_grace_period: 15m
    depends_on:
      api:
        condition: service_healthy

  # The per-minute sweep (expiry, lost jobs, a lab's next machines) and quick actions (start, stop,
  # reboot, destroy), on their own queue, so they still run while long deploys fill the worker
  # (app/jobs.py). The worker takes them too when it has room.
  sweeper:
    <<: *backend
    command: ['procrastinate', '--app=app.jobs.app', 'worker', '--queues=quick', '--concurrency=3']
    pull_policy: never
    # Its jobs take seconds, a destroy a minute or two.
    stop_grace_period: 3m
    depends_on:
      api:
        condition: service_healthy

  # A dump of the database on start and then daily, in /srv/lab-deploy/backups, kept for 14 days. It
  # holds every machine's password and settings: without it, a lost database leaves VMs in vCenter
  # that the panel knows nothing about. Restoring: README.md, "Backups".
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: lab-deploy.env
    environment:
      PGHOST: postgres
      PGUSER: labdeploy
      PGDATABASE: labdeploy
      KEEP_DAYS: 14
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -o pipefail
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        while true; do
          file=/backups/labdeploy-$$(date +%Y%m%d-%H%M).sql.gz
          if pg_dump --clean --if-exists | gzip >"$$file.part"; then
            mv "$$file.part" "$$file"
            echo "Backed up to $$file"
          else
            rm -f "$$file.part"
            echo "Backup failed" >&2
          fi
          find /backups -name 'labdeploy-*.sql.gz' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  caddy_data:
  caddy_config:
  postgres:
